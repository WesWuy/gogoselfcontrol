  // ---- 3D head ambient presence ----
  // Stylized wireframe head silhouette via Three.js LatheGeometry, drifting
  // toward the cursor. Brand fit: tasteful line-art companion on the
  // assessment only; matches the olive accent. Graceful no-op if Three.js
  // failed to load or the user prefers reduced motion.
  function initHead() {
    if (typeof THREE === 'undefined') {
      console.warn('[head] Three.js failed to load — skipping');
      return;
    }
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      console.log('[head] reduced-motion preferred — skipping');
      return;
    }
    const mount = document.getElementById('head-mount');
    if (!mount) {
      console.warn('[head] mount element not found');
      return;
    }
    if (window.innerWidth < 720) {
      console.log('[head] viewport <720px — skipping');
      return;
    }

    console.log('[head] initializing wireframe head');
    const SIZE = 180;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
    camera.position.z = 3.6;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(SIZE, SIZE);
    renderer.setClearColor(0x000000, 0);
    mount.appendChild(renderer.domElement);

    // Profile of a head silhouette — points are [radius, y] revolved around Y axis.
    // Tuned for: rounded crown, slight forehead, cheekbones widest, jaw taper,
    // chin tuck, neck.
    const profile = [
      new THREE.Vector2(0.05, 1.10),
      new THREE.Vector2(0.40, 1.05),
      new THREE.Vector2(0.72, 0.90),
      new THREE.Vector2(0.88, 0.60),
      new THREE.Vector2(0.95, 0.25),
      new THREE.Vector2(0.88, -0.05),
      new THREE.Vector2(0.70, -0.40),
      new THREE.Vector2(0.45, -0.65),
      new THREE.Vector2(0.40, -1.00),
    ];
    const geometry = new THREE.LatheGeometry(profile, 28);
    const wireframe = new THREE.WireframeGeometry(geometry);
    const material = new THREE.LineBasicMaterial({
      color: 0x3D5A40,
      transparent: true,
      opacity: 0.65
    });
    const head = new THREE.LineSegments(wireframe, material);
    scene.add(head);

    // Mouse tracking: map cursor to small rotation deltas, ease toward target.
    let targetX = 0, targetY = 0;
    document.addEventListener('mousemove', (e) => {
      targetY = (e.clientX / window.innerWidth - 0.5) * 1.1;   // horizontal turn
      targetX = (e.clientY / window.innerHeight - 0.5) * 0.5;  // vertical nod
    });

    function animate() {
      requestAnimationFrame(animate);
      // Low lerp factor = slow, human-feeling drift.
      head.rotation.x += (targetX - head.rotation.x) * 0.04;
      head.rotation.y += (targetY - head.rotation.y) * 0.04;
      renderer.render(scene, camera);
    }
    animate();
  }

  const stage = document.getElementById('stage');

  // ---- state ----
  // step shape:

  let history = [{ kind: 'intro' }];
  let answers = {};  // qId -> option

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function progressBar(qIdx) {
    const filled = ((qIdx + 1) / TOTAL_Q) * 100;
    return '<p class="assess-progress">Question ' + (qIdx + 1) + ' of ' + TOTAL_Q +
           '<span class="bar"><span style="width:' + filled + '%"></span></span></p>';
  }

  function render() {
    const step = history[history.length - 1];
    if (step.kind === 'intro') return renderIntro();
    if (step.kind === 'question') return renderQuestion(step.qIdx);
    if (step.kind === 'echo')     return renderEcho(step.qIdx, step.optionIdx);
    if (step.kind === 'results')  return renderResults();
  }

  function renderIntro() {
    const cfg = PAYLOAD.config.intro;
    const html = '<div class="assess-screen assess-intro">' +
      '<h1>' + escapeHtml(cfg.title) + '</h1>' +
      cfg.body.map(p => '<p>' + escapeHtml(p) + '</p>').join('') +
      '<button class="assess-continue" id="start-btn">' + escapeHtml(cfg.cta) + ' →</button>' +
      '</div>';
    stage.innerHTML = html;
    document.getElementById('start-btn').addEventListener('click', () => {
      history.push({ kind: 'question', qIdx: 0 });
      render();
    });
  }

  function renderQuestion(qIdx) {
    const q = QUESTIONS[qIdx];
    const sceneHtml = q.scene.map(p => '<p>' + escapeHtml(p) + '</p>').join('');
    const optsHtml = q.options.map((o, i) =>
      '<li><button data-idx="' + i + '">' + escapeHtml(o.label) + '</button></li>'
    ).join('');
    const backHtml = qIdx > 0 || history.length > 1
      ? '<button type="button" class="assess-back" id="back-btn">← Back</button>'
      : '';
    stage.innerHTML = '<div class="assess-screen">' +
      progressBar(qIdx) +
      '<div class="assess-scene">' + sceneHtml + '</div>' +
      '<h2 class="assess-prompt">' + escapeHtml(q.prompt) + '</h2>' +
      '<ul class="assess-options">' + optsHtml + '</ul>' +
      backHtml +
      '</div>';
    stage.querySelectorAll('.assess-options button').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = parseInt(btn.dataset.idx, 10);
        answers[q.id] = q.options[i];
        history.push({ kind: 'echo', qIdx: qIdx, optionIdx: i });
        render();
      });
    });
    const backBtn = document.getElementById('back-btn');
    if (backBtn) backBtn.addEventListener('click', goBack);
  }

  function renderEcho(qIdx, optionIdx) {
    const q = QUESTIONS[qIdx];
    const opt = q.options[optionIdx];
    const isLast = qIdx === TOTAL_Q - 1;
    const continueLabel = isLast ? 'See your doors →' : 'Continue →';
    stage.innerHTML = '<div class="assess-screen">' +
      progressBar(qIdx) +
      '<blockquote class="assess-echo">' + escapeHtml(opt.echo) + '</blockquote>' +
      '<button class="assess-continue" id="cont-btn">' + escapeHtml(continueLabel) + '</button>' +
      '<button type="button" class="assess-back" id="back-btn">← Back</button>' +
      '</div>';
    document.getElementById('cont-btn').addEventListener('click', () => {
      if (isLast) history.push({ kind: 'results' });
      else history.push({ kind: 'question', qIdx: qIdx + 1 });
      render();
    });
    document.getElementById('back-btn').addEventListener('click', goBack);
  }

  function goBack() {
    if (history.length > 1) {
      history.pop();
      render();
    }
  }

  // ---- routing engine ----
  function computeRanking() {
    const buckets = {};
    for (const slug of Object.keys(PAYLOAD.labels)) buckets[slug] = 0;
    let tradition = null;
    let forceOpenIntake = false;

    for (const q of QUESTIONS) {
      const a = answers[q.id];
      if (!a) continue;
      for (const [slug, w] of Object.entries(a.weights || {})) {
        buckets[slug] = (buckets[slug] || 0) + w;
      }
      if (a.tradition) tradition = a.tradition;
      if (a.force_open_intake) forceOpenIntake = true;
    }

    const ranked = Object.entries(buckets)
      .filter(([_, score]) => score > 0)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 3);

    return { ranked, tradition, forceOpenIntake };
  }

  // Map the four faith-coded answers to actual `tradition:` enum values used in entries.
  const TRADITION_TO_ENUMS = {
    'christian':   ['christian'],
    'muslim':      ['muslim'],
    'jewish':      ['jewish'],
    'other-faith': ['buddhist', 'hindu', 'sikh', 'bahai', 'interfaith'],
  };

  function pickEntries(bucketSlug, tradition, forceOpenIntake, limit) {
    let pool = PAYLOAD.entries.filter(e => e.category === bucketSlug);

    // Tradition filter — only if the user surfaced one AND this bucket is faith-shaped.
    if (tradition && bucketSlug === 'faith-community') {
      const allowed = new Set(TRADITION_TO_ENUMS[tradition] || []);
      const filtered = pool.filter(e => allowed.has(e.tradition));
      if (filtered.length > 0) pool = filtered;
    }

    // Sort: open intake first if forced, then crisis_safe yes, then everything else.
    pool.sort((a, b) => {
      if (forceOpenIntake) {
        const aOpen = a.intake === 'open' ? 1 : 0;
        const bOpen = b.intake === 'open' ? 1 : 0;
        if (bOpen !== aOpen) return bOpen - aOpen;
      }
      const aFree = a.cost === 'free' ? 1 : 0;
      const bFree = b.cost === 'free' ? 1 : 0;
      if (bFree !== aFree) return bFree - aFree;
      return 0;
    });

    return pool.slice(0, limit);
  }

      '</div>' +
      '<p class="description">' + escapeHtml(e.description) + '</p>' +
      '<p class="locator"><a href="' + escapeHtml(e.url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(e.url) + '</a></p>' +
    '</li>';
  }

  function buildSynthesis() {
    // Compose a one-line "you said" recap from a few key answers.
    const parts = [];
    const q1 = answers['q1'];
    const q5 = answers['q5'];
    if (q1 && q1.id === 'unsure') parts.push('You said you don\'t know yet.');
    else if (q1) parts.push('You named what\'s missing.');
    if (q5) {
      if (q5.id === 'none') parts.push('You said no men would show up for you.');
      else if (q5.id === 'one') parts.push('You said one man, maybe.');
      else if (q5.id === 'few') parts.push('You said two or three.');
      else if (q5.id === 'many') parts.push('You said more than five.');
      else if (q5.id === 'unsure-friends') parts.push('You said you have friends but you\'re not sure they\'d show up.');
    }
    return parts.join(' ');
  }

  function renderResults() {
    const { ranked, tradition, forceOpenIntake } = computeRanking();
    const cfg = PAYLOAD.config.results;
    const synthesis = buildSynthesis();

    if (ranked.length === 0) {
      stage.innerHTML = '<div class="assess-screen assess-results">' +
        '<h1>Walk through the front door.</h1>' +
        '<p>Your answers didn\'t pull strongly toward any one bucket. Browse the full directory and pick what fits.</p>' +
        '<a href="directory.html" class="assess-continue">Browse all →</a>' +
      '</div>';
      return;
    }

    const doorsHtml = ranked.map(([slug, _score]) => {
      const entries = pickEntries(slug, tradition, forceOpenIntake, 3);
      if (entries.length === 0) return '';
      return '<section class="door-bucket">' +
        '<h2>' + escapeHtml(PAYLOAD.labels[slug] || slug) + '</h2>' +
        '<p class="why">' + escapeHtml(PAYLOAD.reasons[slug] || '') + '</p>' +
        '<ul>' + entries.map(entryCard).join('') + '</ul>' +
      '</section>';
    }).join('');

    stage.innerHTML = '<div class="assess-screen assess-results">' +
      '<h1>' + escapeHtml(cfg.title_a) + '</h1>' +
      (synthesis ? '<p class="synthesis">' + escapeHtml(synthesis) + '</p>' : '') +
      '<p class="doors-label">' + escapeHtml(cfg.title_b) + '</p>' +
      doorsHtml +
      '<div class="results-foot">' +
        '<a href="assess.html" id="redo-link">' + escapeHtml(cfg.footer_try_again) + ' →</a>' +
        '<a href="directory.html">' + escapeHtml(cfg.footer_browse) + ' →</a>' +
      '</div>' +
    '</div>';

    document.getElementById('redo-link').addEventListener('click', (ev) => {
      ev.preventDefault();
      history = [{ kind: 'intro' }];
      answers = {};
      render();
      window.scrollTo(0, 0);
    });

    window.scrollTo(0, 0);
    document.title = 'Your doors — gogoselfcontrol.org';
  }

  render();
})();
</script>
