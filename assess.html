<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assessment — gogoselfcontrol.org</title>
<meta name="description" content="Help men who need their men to find their men. A directory of men's gatherings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F2EAD3;
  --bg-card: #FBF6E8;
  --bg-soft: #EBE2C5;
  --fg: #2A2520;
  --fg-mute: #6B6256;
  --fg-deep: #423B30;
  --accent: #3D5A40;
  --accent-soft: #6E8A6F;
  --rule: #C7B98F;
  --rule-soft: #DDD2A8;
  --warn-bg: #ECE0BF;
  --warn-fg: #6B4F18;
  --crisis-bg: #2A4D3A;
  --crisis-fg: #F2EAD3;
  --serif: 'EB Garamond', Garamond, 'Times New Roman', Georgia, serif;
  --mono: 'IBM Plex Mono', Menlo, Consolas, monospace;
  --measure: 36rem;
  --measure-wide: 64rem;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  font-family: var(--serif);
  font-size: 1.0625rem;
  line-height: 1.55;
  color: var(--fg);
  background: var(--bg);
  margin: 0;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { color: var(--fg); }
hr { border: none; border-top: 1px solid var(--rule-soft); margin: 2rem 0; }

.site-wrap { max-width: var(--measure-wide); margin: 0 auto; padding: 2rem 1.5rem 3rem; }
.measure { max-width: var(--measure); }

/* Masthead — used on inner pages, not on home */
.masthead {
  border-bottom: 1px solid var(--rule);
  padding-bottom: 1rem;
  margin-bottom: 2.5rem;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 1rem 2rem;
}
.masthead .brand {
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 500;
  letter-spacing: 0.01em;
  color: var(--fg);
  text-decoration: none;
  margin-right: auto;
}
.masthead .brand .dot { color: var(--accent); }
.masthead nav {
  font-family: var(--mono);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.13em;
  display: flex;
  gap: 1.5rem;
}
.masthead nav a {
  color: var(--fg-mute);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  padding-bottom: 2px;
}
.masthead nav a:hover,
.masthead nav a[aria-current="page"] {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* Type */
h1, h2, h3 { font-family: var(--serif); font-weight: 500; color: var(--fg); margin-top: 0; }
h1 { font-size: 2.25rem; line-height: 1.18; margin-bottom: 1rem; }
h2 { font-size: 1.5rem; line-height: 1.25; margin: 2rem 0 0.75rem; }
h3 { font-size: 1.2rem; line-height: 1.3; margin: 1.4rem 0 0.5rem; }
p { margin: 0 0 1rem; }
.lede { font-size: 1.2rem; line-height: 1.5; color: var(--fg-deep); max-width: 38rem; }
.lede em { color: var(--accent); font-style: italic; }
.kicker {
  font-family: var(--mono);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent);
  margin-bottom: 0.75rem;
}

/* ---------- HOME (Google-style assessment) ---------- */

body.home {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  padding: 0;
}
.home-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 3rem 1.5rem 2rem;
  max-width: 36rem;
  margin: 0 auto;
}
.home-wordmark {
  font-family: var(--serif);
  font-size: 2.6rem;
  font-weight: 500;
  margin: 0 0 0.5rem;
  letter-spacing: -0.005em;
}
.home-wordmark .dot { color: var(--accent); }
.home-mission {
  font-family: var(--serif);
  font-style: italic;
  color: var(--fg-mute);
  font-size: 1.05rem;
  margin: 0 0 3.5rem;
  max-width: 28rem;
}

/* Quiet crisis link in home footer — for the man who needs it; not a primary CTA */
.crisis-quiet {
  color: var(--fg-mute);
  text-decoration: none;
  border-bottom: 1px dotted var(--rule);
}
.crisis-quiet:hover { color: var(--accent); border-bottom-color: var(--accent); }

/* Primary CTA — the assessment journey */
.journey-cta {
  display: inline-flex;
  align-items: center;
  gap: 0.75rem;
  margin: 0 auto 2rem;
  padding: 0.95rem 1.5rem;
  background: var(--accent);
  color: var(--crisis-fg);
  text-decoration: none;
  border-radius: 2px;
  font-family: var(--mono);
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  font-weight: 500;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  box-shadow: 0 2px 8px rgba(61, 90, 64, 0.18);
  min-height: 48px;
}
.journey-cta:hover, .journey-cta:focus {
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(61, 90, 64, 0.28);
  background: var(--fg);
  color: var(--crisis-fg);
  outline: none;
}
.journey-cta-arrow { font-family: var(--serif); font-size: 1.1rem; letter-spacing: 0; }
.home-or {
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--fg-mute);
  margin: 0 0 1rem;
  position: relative;
}
.home-or::before, .home-or::after {
  content: '';
  display: inline-block;
  width: 2.5rem;
  height: 1px;
  background: var(--rule-soft);
  vertical-align: middle;
  margin: 0 0.75rem;
}
@media (max-width: 540px) {
  .journey-cta { width: 100%; max-width: 24rem; justify-content: center; padding: 1rem 1.2rem; }
}

/* ---------- ASSESSMENT (choose-your-own-adventure wizard) ---------- */
body.assess {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  padding: 0;
}

/* Wireframe-head ambient presence — top-right of the assessment, drifts
   toward the cursor. Hidden on small screens and when reduced motion is
   preferred. The canvas is positioned fixed and pointer-events: none so it
   never interferes with the wizard interaction. */
.head-mount {
  position: fixed;
  top: 1.25rem;
  right: 1.25rem;
  width: 180px;
  height: 180px;
  pointer-events: none;
  z-index: 1;
  opacity: 0.85;
}
.head-mount canvas { display: block; }
@media (max-width: 720px) {
  .head-mount { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .head-mount { display: none; }
}
.assess-stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 3rem 1.5rem 4rem;
  max-width: 36rem;
  margin: 0 auto;
  width: 100%;
}
.assess-progress {
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--fg-mute);
  margin: 0 0 2.5rem;
  text-align: center;
}
.assess-progress .bar {
  display: inline-block;
  width: 8rem;
  height: 2px;
  background: var(--rule-soft);
  margin-left: 0.75rem;
  vertical-align: middle;
  position: relative;
}
.assess-progress .bar > span {
  position: absolute;
  top: 0; left: 0; height: 100%;
  background: var(--accent);
  transition: width 0.4s ease;
}
.assess-screen { animation: fadeIn 0.45s ease-out both; width: 100%; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.assess-scene {
  font-family: var(--serif);
  font-style: italic;
  color: var(--fg-mute);
  font-size: 1.05rem;
  line-height: 1.55;
  margin: 0 0 1.5rem;
}
.assess-scene p + p { margin-top: 0.8rem; }
.assess-prompt {
  font-family: var(--serif);
  font-size: 1.55rem;
  line-height: 1.25;
  font-weight: 500;
  margin: 0 0 1.75rem;
  color: var(--fg);
}
.assess-options {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 0.65rem;
}
.assess-options button {
  display: block;
  width: 100%;
  text-align: left;
  font-family: var(--serif);
  font-size: 1.05rem;
  line-height: 1.4;
  padding: 0.95rem 1.1rem;
  background: var(--bg-card);
  border: 1px solid var(--rule-soft);
  border-left: 3px solid var(--rule);
  border-radius: 2px;
  color: var(--fg);
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
}
.assess-options button:hover, .assess-options button:focus {
  border-left-color: var(--accent);
  background: white;
  outline: none;
}
.assess-options button:active { transform: translateY(1px); }
.assess-echo {
  font-family: var(--serif);
  font-size: 1.15rem;
  line-height: 1.55;
  color: var(--fg-deep);
  margin: 0 0 2rem;
  padding-left: 1.1rem;
  border-left: 3px solid var(--accent);
}
.assess-continue {
  font-family: var(--mono);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  padding: 0.85rem 1.4rem;
  background: var(--accent);
  color: var(--crisis-fg);
  border: 1px solid var(--accent);
  cursor: pointer;
  border-radius: 2px;
}
.assess-continue:hover { background: var(--fg); border-color: var(--fg); }
.assess-back {
  display: inline-block;
  margin-top: 2rem;
  font-family: var(--mono);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--fg-mute);
  text-decoration: none;
  border: none;
  background: none;
  cursor: pointer;
}
.assess-back:hover { color: var(--accent); }
.assess-intro h1 {
  font-family: var(--serif);
  font-size: 2.4rem;
  font-weight: 500;
  margin: 0 0 1.5rem;
}
.assess-intro p {
  font-size: 1.1rem;
  line-height: 1.55;
  color: var(--fg-deep);
  margin: 0 0 1rem;
}
.assess-intro .assess-continue { margin-top: 1.5rem; }

/* Results */
.assess-results h1 {
  font-family: var(--serif);
  font-size: 2.1rem;
  font-weight: 500;
  margin: 0 0 1rem;
}
.assess-results .synthesis {
  font-family: var(--serif);
  font-size: 1.15rem;
  line-height: 1.55;
  color: var(--fg-deep);
  margin: 0 0 2rem;
  font-style: italic;
}
.assess-results .doors-label {
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 0.75rem;
}
.assess-results .door-bucket {
  margin-bottom: 2.5rem;
}
.assess-results .door-bucket h2 {
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 500;
  margin: 0 0 0.4rem;
  border: none;
  padding: 0;
}
.assess-results .door-bucket .why {
  font-family: var(--serif);
  font-style: italic;
  color: var(--fg-mute);
  font-size: 1rem;
  margin: 0 0 1rem;
}
.assess-results .door-bucket ul {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 0.85rem;
}
.assess-results .results-foot {
  margin-top: 2rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--rule-soft);
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem 1.5rem;
  font-family: var(--mono);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.13em;
}
.assess-results .results-foot a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px dotted var(--accent);
}
.assess-results .results-foot a:hover { border-bottom-style: solid; }

@media (max-width: 540px) {
  .assess-stage { padding: 2rem 1.25rem 3rem; }
  .assess-prompt { font-size: 1.3rem; }
  .assess-intro h1 { font-size: 1.9rem; }
  .assess-results h1 { font-size: 1.75rem; }
}

/* Crisis-block tel: links + locale priority */
.crisis-block .tel {
  font-family: var(--mono);
  font-size: 1rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  white-space: nowrap;
  color: var(--crisis-fg);
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
  padding: 0.4rem 0;
  display: inline-block;
  min-height: 44px;
  line-height: 1.2;
}
.crisis-block .tel:hover { color: var(--accent-soft); }
.crisis-block li.locale-priority {
  background: rgba(255, 255, 255, 0.06);
  padding: 0.7rem 0.7rem;
  margin: 0.25rem -0.7rem;
  border-radius: 2px;
  border-top: none;
}
.crisis-block li.locale-priority + li { border-top: 1px solid rgba(242, 234, 211, 0.2); }
.crisis-block li.locale-priority .region {
  color: var(--bg);
  font-weight: 500;
}

/* Disclaimer crisis-line tap targets */
.callout.warn .tel {
  font-family: var(--mono);
  font-weight: 500;
  white-space: nowrap;
  padding: 0.15rem 0.4rem;
  border-radius: 2px;
  background: rgba(107, 79, 24, 0.08);
  text-decoration: none;
  color: var(--warn-fg);
}
.callout.warn .tel:hover { background: rgba(107, 79, 24, 0.18); text-decoration: underline; }

.home-prompt {
  font-family: var(--serif);
  font-size: 1.55rem;
  font-weight: 500;
  margin: 0 0 1.25rem;
  color: var(--fg);
}
.ask-form {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
  align-items: center;
}
.ask-form .ask-row {
  display: flex;
  width: 100%;
  gap: 0.5rem;
}
.ask-form input {
  flex: 1;
  font-family: var(--serif);
  font-size: 1.1rem;
  padding: 0.85rem 1rem;
  border: 1px solid var(--rule);
  background: white;
  color: var(--fg);
  border-radius: 2px;
  min-width: 0;
}
.ask-form input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(61, 90, 64, 0.2);
}
.ask-form button {
  font-family: var(--mono);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  padding: 0.85rem 1.4rem;
  background: var(--accent);
  color: var(--crisis-fg);
  border: 1px solid var(--accent);
  cursor: pointer;
  border-radius: 2px;
  white-space: nowrap;
}
.ask-form button:hover { background: var(--fg); border-color: var(--fg); }

.pills {
  list-style: none;
  padding: 0;
  margin: 1.5rem 0 0;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.5rem 0.75rem;
}
.pills li a {
  display: inline-block;
  font-family: var(--mono);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.13em;
  padding: 0.45rem 0.95rem;
  border: 1px solid var(--rule);
  background: var(--bg-card);
  color: var(--fg-deep);
  text-decoration: none;
  border-radius: 999px;
  transition: border-color 0.15s ease, color 0.15s ease;
}
.pills li a:hover {
  color: var(--accent);
  border-color: var(--accent);
  background: white;
}
.home-foot {
  font-family: var(--mono);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.13em;
  color: var(--fg-mute);
  text-align: center;
  padding: 1.5rem 1rem 2rem;
  border-top: 1px solid var(--rule-soft);
  margin: 2.5rem auto 0;
  max-width: 40rem;
}
.home-foot a { color: var(--fg-mute); text-decoration: none; border-bottom: 1px dotted var(--rule); }
.home-foot a:hover { color: var(--accent); border-bottom-color: var(--accent); }
.home-foot .dot-sep { margin: 0 0.6rem; color: var(--rule); }

/* ---------- PATH (tailored response) ---------- */

.path-echo {
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  color: var(--fg-mute);
  background: var(--bg-card);
  border-left: 2px solid var(--rule);
  padding: 0.7rem 1rem;
  margin-bottom: 2rem;
  text-transform: uppercase;
}
.path-echo .you-said { display: block; font-size: 0.65rem; color: var(--accent); margin-bottom: 0.2rem; }
.path-echo .text { font-family: var(--serif); font-size: 0.95rem; text-transform: none; letter-spacing: 0; color: var(--fg); font-style: italic; }
.path-headline { font-family: var(--serif); font-size: 2.1rem; line-height: 1.18; margin: 0 0 0.75rem; max-width: 28ch; }
.path-intro { font-size: 1.1rem; line-height: 1.55; color: var(--fg-deep); max-width: 38rem; margin: 0 0 2rem; }

.crisis-block {
  background: var(--crisis-bg);
  color: var(--crisis-fg);
  padding: 1.5rem 1.75rem;
  border-radius: 2px;
  margin: 1.5rem 0 2rem;
}
.crisis-block h2 {
  font-family: var(--mono);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--crisis-fg);
  margin: 0 0 1rem;
  font-weight: 500;
  border: none;
  padding: 0;
}
.crisis-block ul { list-style: none; padding: 0; margin: 0; }
.crisis-block ul li {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.5rem 1rem;
  padding: 0.5rem 0;
  border-top: 1px solid rgba(242, 234, 211, 0.2);
}
.crisis-block ul li:first-child { border-top: none; }
.crisis-block .label {
  font-family: var(--serif);
  font-size: 1rem;
  flex: 1 1 auto;
}
.crisis-block .number {
  font-family: var(--mono);
  font-size: 1rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  white-space: nowrap;
}
.crisis-block .region {
  font-family: var(--mono);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.13em;
  color: var(--accent-soft);
  flex-basis: 100%;
  margin-bottom: -0.25rem;
}

.starts {
  list-style: none;
  padding: 0;
  margin: 0 0 2rem;
  display: grid;
  gap: 1rem;
}
.start-card {
  background: var(--bg-card);
  border: 1px solid var(--rule-soft);
  border-left: 3px solid var(--rule);
  padding: 1.1rem 1.4rem 1.2rem;
  border-radius: 2px;
}
.start-card:hover { border-left-color: var(--accent); }
.start-card .name {
  font-family: var(--serif);
  font-size: 1.2rem;
  font-weight: 500;
  margin: 0 0 0.4rem;
}
.start-card .name a { color: var(--fg); text-decoration: none; }
.start-card .name a:hover { color: var(--accent); }
.start-card .badges { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.35rem 0 0.6rem; }
.start-card .badge {
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 0.15rem 0.5rem;
  background: var(--bg-soft);
  color: var(--fg-deep);
  border: 1px solid var(--rule-soft);
  border-radius: 2px;
}
.start-card .badge.crisis { background: var(--crisis-bg); color: var(--crisis-fg); border-color: var(--crisis-bg); }
.start-card .badge.cost-free { background: #DDE9DA; color: #2C4A2D; border-color: #BFD4BC; }
.start-card .description { margin: 0 0 0.5rem; font-size: 1rem; line-height: 1.5; color: var(--fg); }
.start-card .locator {
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.04em;
  word-break: break-all;
}
.start-card .locator a { color: var(--accent); }

.path-foot {
  margin-top: 2rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--rule-soft);
  font-family: var(--mono);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem 1.5rem;
}
.path-foot a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); }
.path-foot a:hover { border-bottom-style: solid; }

/* ---------- DIRECTORY page ---------- */
.dir-toolbar {
  background: var(--bg-card);
  border: 1px solid var(--rule-soft);
  border-radius: 2px;
  padding: 1.25rem 1.5rem;
  margin-bottom: 1.5rem;
  display: grid;
  grid-template-columns: 1fr;
  gap: 1rem;
}
@media (min-width: 720px) {

.entry .locator a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.entry .locator-label { color: var(--fg-mute); margin-right: 0.5rem; text-transform: uppercase; letter-spacing: 0.13em; font-size: 0.7rem; }
.entry .verification-flag {

.empty { padding: 3rem 1.5rem; text-align: center; color: var(--fg-mute); font-style: italic; background: var(--bg-card); border: 1px dashed var(--rule); border-radius: 2px; }

(function() {
  const PAYLOAD = {"config": {"intro": {"title": "Five questions.", "body": ["Three minutes. No forms, no signup, nothing stored.", "No wrong answers \u2014 only honest ones and dishonest ones, and you'll know the difference.", "By the end, you'll have a few real doors to walk through."], "cta": "Start"}, "questions": [{"id": "q1", "pillar": "Diagnostic Consciousness", "scene": ["Something pulled you here. Whatever it was \u2014 a quiet ache, a scary moment, somebody else's nudge \u2014 it counts.", "You don't have to name it perfectly. Just point at it."], "prompt": "What feels most missing right now?", "options": [{"id": "friends", "label": "Real friendships \u2014 men who'll actually show up", "weights": {"drop-in": 2, "civic-fraternal": 2, "outdoor-fitness": 1}, "echo": "OK. So it's the men. Or the lack of them. Most men carry that one and don't say it out loud \u2014 naming it is half the work."}, {"id": "purpose", "label": "A clear sense of direction or purpose", "weights": {"faith-community": 2, "curriculum-retreat": 2, "civic-fraternal": 1}, "echo": "Direction. The 'what am I aiming at' question. Most men spend a decade pretending they have an answer \u2014 naming it puts you ahead of them."}, {"id": "habit", "label": "Control over a habit I keep losing to", "weights": {"drop-in": 3, "therapy-clinical": 1}, "echo": "Whatever it is \u2014 drink, scroll, food, money, the way you talk to someone you love when you're tired \u2014 naming it is half. Hold it."}, {"id": "turning-point", "label": "A turning point that means something", "weights": {"curriculum-retreat": 3, "rites-boys": 1}, "echo": "You're feeling the gap between who you are and who you're trying to become. There's a kind of work made for that gap."}, {"id": "family", "label": "Better with my partner, kids, or family", "weights": {"fatherhood": 3, "therapy-clinical": 2}, "echo": "That's a brave answer. Most men don't admit they want to do better at home. Hold it."}, {"id": "unsure", "label": "I don't ine. The conversation. The repair.", "There's no shame in it. Just point at yours."], "prompt": "What is it?", "options": [{"id": "discipline", "label": "A discipline (sobriety, fitness, money, sleep)", "weights": {"drop-in": 3, "outdoor-fitness": 1}, "echo": "The body, the budget, the bottle. Whatever the shape, the work is the same: not alone. Rooms meet weekly for exactly this."}, {"id": "work", "label": "A career, business, or work move", "weights": {"civic-fraternal": 2, "curriculum-retreat": 2}, "echo": "What you build, what you earn, what you make of yourself in time and labor. There are specific rooms for that."}, {"id": "repair", "label": "A relationship I need to repair", "weights": {"therapy-clinical": 2, "fatherhood": 1, "faith-community": 1}, "echo": "Repair is heavy. It's almost never solo work \u2014 it's witnessed work."}, {"id": "spiritual", "label": "A spiritual practice I keep meaning to begin", "weights": {"faith-community": 3}, "echo": "Prayer that doesn't happen. Meditation that doesn't sit. There's a community-shaped answer for that \u2014 practice loves company."}, {"id": "follow-through", "label": "I follow through on most things", "weights": {"curriculum-retreat": 2, "rites-boys": 1, "civic-fraternal": 1}, "echo": "Then you're not most of us. Different doors for you \u2014 ones that ask more, and give more back."}, {"id": "unsure-start", "label": "I don't know where to start", "weights": {"drop-in": 1, "curriculum-retreat": 1, "civic-fraternal": 1}, "echo": "Fair. We'll keep going. The last two questions give us enough."}]}, {"id": "q4", "pillar": "Spiritual-Philosophical Foundation", "scene": ["Something hard is going to land. Not today, maybe not this year \u2014 but it will. The job. The diagnosis. The call about your father.", "When the floor moves, what stays under your feet?"], "prompt": "What grounds you?", "options": [{"id": "faith-christian", "label": "A Christian faith I practice", "weights": {"faith-community": 3}, "tradition": "christian", "echo": "Then your tradition has rooms made for men. The directory has them \u2014 Catholic, Protestant, Orthodox, charismatic \u2014 sorted."}, {"id": "faith-muslim", "label": "A Muslim faith I practice", "weights": {"faith-community": 3}, "tradition": "muslim", "echo": "Then your tradition has rooms \u2014 mosque circles, Sufi orders, Tablighi gatherings. The directory will route you."}, {"id": "faith-jewish", "label": "A Jewish practice", "weights": {"faith-community": 3}, "tradition": "jewish", "echo": "Then your tradition has rooms \u2014 Federation, Mussar, Aleph, congregation-level Brotherhoods. The directory will route you."}, {"id": "faith-other", "label": "Another faith (Buddhist, Hindu, Sikh, Bah\u00e1'\u00ed, other)", "weights": {"faith-community": 3}, "tradition": "other-faith", "echo": "The directory holds rooms for several traditions. We'll route you toward yours."}, {"id": "philosophy", "label": "Philosophy or wisdom traditions, but not religion", "weights": {"curriculum-retreat": 2, "civic-fraternal": 1, "outdoor-fitness": 1}, "echo": "Stoicism, the Tao, secular ethics \u2014 call it what you call it. There are rooms shaped that way too."}, {"id": "people", "label": "The people in my life", "weights": {"drop-in": 1, "civic-fraternal": 1, "outdoor-fitness": 1}, "echo": "Then the question becomes whether they know it, and whether they'd still be there at three a.m."}, {"id": "discipline", "label": "Discipline and self-reliance", "weights": {"outdoor-fitness": 2, "civic-fraternal": 1, "curriculum-retreat": 1}, "echo": "Strong stance. It also has a ceiling. Most men past forty find it \u2014 better to find it with company than alone."}, {"id": "nothing", "label": "Honestly, nothing reliable yet", "weights": {"curriculum-retreat": 2, "drop-in": 1}, "echo": "That answer is more common than men admit. You said it. Don't fake it on the next one."}]}, {"id": "q5", "pillar": "Scalable Community Architecture", "scene": ["Last one.", "You're going to need help one day. The kind you can't fake your way through. The kind that's bigger than a friend favor."], "prompt": "How many men in your life would actually show up for you?", "options": [{"id": "many", "label": "More than five", "weights": {"curriculum-retreat": 1, "rites-boys": 1, "civic-fraternal": 1}, "echo": "Lucky. And probably partly your doing. Your work isn't building a circle \u2014 it's depth, or it's giving back."}, {"id": "few", "label": "Two or three", "weights": {"drop-in": 1, "civic-fraternal": 1, "outdoor-fitness": 1}, "echo": "Real number. Most men have less. Hold them \u2014 and consider widening, not because two isn't enough but because two is fragile."}, {"id": "one", "label": "One \u2014 maybe", "weights": {"drop-in": 2, "civic-fraternal": 2, "outdoor-fitness": 1}, "echo": "That maybe is a real word. We'll route you toward rooms where the answer becomes 'definitely.'"}, {"id": "none", "label": "None I can name", "weights": {"drop-in": 3, "civic-fraternal": 3, "faith-community": 1}, "force_open_intake": true, "echo": "That's the truth most men won't tell. You named it. The next page is for you specifically."}, {"id": "unsure-friends", "label": "I have friends, but I don't know if they would", "weights": {"drop-in": 2, "civic-fraternal": 1, "outdoor-fitness": 1}, "echo": "That's the most common honest answer. The work is testing it before you need to."}]}], "results": {"title_a": "Here's where you are.", "title_b": "And here's where to walk in.", "doors_label": "Three doors", "footer_try_again": "Try a different mix", "footer_browse": "Browse all"}}, "labels": {"drop-in": "Drop-in support rooms", "faith-community": "Faith-rooted community", "curriculum-retreat": "Curriculum or retreat program", "civic-fraternal": "Civic or fraternal order", "outdoor-fitness": "Outdoor or fitness brotherhood", "fatherhood": "Fatherhood program", "reentry": "Reentry / justice-adjacent", "therapy-clinical": "Therapy / clinical", "rites-boys": "Rites of passage ative Extension System of US land-grant universities. Approximately 6 million youth members ages 5\u201319. Programs cover agriculture, science, healthy living, and leadership through the \"Head, Heart, Hands, Health\" framework. Adult volunteer leaders provide significant mentorship \u2014 many adult men in rural agricultural communities maintain their 4-H involvement across generations."}, {"name": "611 Bread of Life Christian Church Men's Ministry", "url": "https://611hk.org", "category": "faith-community", "tradition": "christian", "cost": "free", "intake": "open", "crisis_safe": "no", "regions": ["hong-kong-nationwide", "online"], "description": "Men's-ministry network of 611 Bread of Life Christian Church (\u516d\u4e00\u4e00\u9748\u7ce7\u5802), one of Hong Kong's largest Pentecostal/charismatic megachurches, founded 2001. Operates men's small groups, retreats, and the men-specific \"Manhood\" formation tracks. Cantonese-medium primarily with some English-medium content. Distinctive Cantonese-charismatic register reaches local-language men's audiences that Anglo-Anglican and English-medium ministries don't."}, {"name": "Alcoholics Anonymous Bahamas", "url": "https://aabahamas.org", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["bahamas-nationwide", "online"], "description": "Bahamas AA service body, coordinating English-language meetings primarily in Nassau (Providence Island) and modest meetings on the Family Islands. Standard 12-step format: free, anonymous, weekly. Meetings serve a mix of Bahamian, expatriate, and tourist-area populations."}, {"name": "Alcoholics Anonymous Barbados", "url": "https://aabarbados.org", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["barbados-nationwide", "online"], "description": "Barbados AA service body, coordinating English-language meetings primarily in Bridgetown and the south coast. Standard 12-step format: free, anonymous, weekly. Meetings serve a mix of Bajan, expatriate, and tourist-area populations."}, {"name": "AA en Espa\u00f1ol (Alcoh\u00f3licos An\u00f3nimos en Espa\u00f1ol)", "url": "https://www.aa.org/es", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["us-nationwide", "online"], "description": "Spanish-language meetings of Alcoholics Anonymous across the United States. Same fellowship structure as English-language AA \u2014 Twelve Steps, Twelve Traditions, anonymous, free, peer-led \u2014 with Spanish-speaking groups (Grupos Hispanos) and Spanish-language resources. Densest in California, Texas, Florida, New York, and Illinois. Many cities have dedicated Spanish-language intergroups; aa.org/es is the central Spanish-language landing page."}, {"name": "Alcoholics Anonymous Ghana", "url": "https://aaghana.org", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["ghana-nationwide", "online"], "description": "Ghanaian General Service Office of Alcoholics Anonymous, coordinating AA meetings primarily in Accra, Kumasi, and Takoradi. Standard AA 12-step format: free, anonymous, weekly, English-language. Meeting density is modest \u2014 Ghana's AA infrastructure is smaller than Nigeria's or South Africa's but stable."}, {"name": "Alcoholics Anonymous Hong Kong", "url": "https://aa-hk.org", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["hong-kong-nationwide", "online"], "description": "Hong Kong's AA service body, coordinating English- and Cantonese-language meetings across HK Island, Kowloon, and the New Territories. AA arrived in Hong Kong in the late 1950s. Standard 12-step format: free, anonymous, weekly. Expatriate-heavy English meeting density is one of the highest in Asia given Hong Kong's professional / financial-services demographics."}, {"name": "Alcoholics Anonymous India", "url": "https://www.aagsoindia.org/", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["india-nationwide", "online"], "description": "General Service Office of Alcoholics Anonymous India, coordinating thousands of AA meetings across India. AA reached India in the late 1950s; the General Service Office is based in Hyderabad. Standard AA 12-step format: free, anonymous, weekly, in English, Hindi, and many regional languages. Densest in major metros (Mumbai, Delhi, Bangalore, Hyderabad, Chennai, Kolkata) and growing rapidly in tier-2 cities."}, {"name": "Alcoholics Anonymous Jamaica", "url": "https://www.aajamaica.org/", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["jamaica-nationwide", "online"], "description": "Jamaican AA service body, coordinating meetings primarily in Kingston, Montego Bay, Mandeville, and Ocho Rios. Standard AA 12-step format: free, anonymous, weekly, English-language. Meeting density is modest given Jamaica's scale; meetings serve a mix of local Jamaican and expatriate / tourist-area populations."}, {"name": "Alcoholics Anonymous Kenya", "url": "https://aakenya.co.ke", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["kenya-nationwide", "online"], "description": "Kenyan General Service Office of Alcoholics Anonymous, coordinating AA meetings across major Kenyan metros \u2014 Nairobi, Mombasa, Kisumu, Nakuru, Eldoret. Standard AA 12-step format: free, anonymous, weekly. Meetings are predominantly English-language with growing Kiswahili meetings."}, {"name": "Alcoholics Anonymous Malaysia", "url": "https://aamalaysia.org", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["malaysia-nationwide", "online"], "description": "Malaysia's AA service body, coordinating English-language meetings primarily in Kuala Lumpur, Penang, Johor Bahru, Kuching, and Kota Kinabalu. Standard 12-step format: free, anonymous, weekly. Meetings are predominantly English-language given AA's expat-and-middle-class-Malaysian base."}, {"name": "Alcoholics Anonymous Nigeria", "url": "https://aanigeria.org", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["nigeria-nationwide", "online"], "description": "Nigerian General Service Office of Alcoholics Anonymous, coordinating AA meetings across major Nigerian metros \u2014 Lagos, Abuja, Port Harcourt, Ibadan, Kano. Standard AA 12-step format: free, anonymous, weekly, English-language. Meeting density is modest given Nigeria's scale but the network is established. Meetings serve both Nigerian and expatriate participants."}, {"name": "Alcoholics Anonymous Philippines", "url": "https://aaphilippines.org", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["philippines-nationwide", "online"], "description": "Philippines AA service body, coordinating meetings primarily in Metro Manila, Cebu, Davao, Baguio, Subic, and several other major cities, plus an active online network. Standard 12-step format: free, anonymous, weekly. Meetings are predominantly English-language (with Tagalog and Cebuano alternatives growing). The Philippines has a substantial AA infrastructure relative to many Asian countries \u2014 both expat-driven and local-Filipino-driven."}, {"name": "Alcoholics Anonymous Singapore", "url": "https://aasingapore.org", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["singapore-nationwide", "online"], "description": "Singapore's General Service Office of Alcoholics Anonymous, coordinating English-language AA meetings across the city-state. Standard AA 12-step format: free, anonymous, weekly, open or closed format depending on the meeting. Meetings are predominantly English-language and serve a mix of local Singaporean and expatriate populations. Meeting density is modest in absolute terms but stable."}, {"name": "Alcoholics Anonymous South Africa", "url": "https://aasouthafrica.org.za", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["south-africa-nationwide", "online"], "description": "South African General Service Office of Alcoholics Anonymous, coordinating roughly 700+ AA meetings across the country \u2014 primarily in English, Afrikaans, and isiZulu, with regional language support. AA arrived in South Africa in 1946. Standard AA 12-step format: free, anonymous, weekly, open or closed format depending on the meeting. Densest in Gauteng and Western Cape."}, {"name": "Alcoholics Anonymous Trinidad and Tobago", "url": "https://www.aatt.org/", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["trinidad-and-tobago-nationwide", "online"], "description": "Trinidad and Tobago AA service body, coordinating English-language meetings primarily in Port of Spain, San Fernando, and on Tobago. Standard 12-step format: free, anonymous, weekly. Meetings serve a mix of Trinidadian, Tobagonian, expatriate, and visiting populations."}, {"name": "Alcoholics Anonymous United Arab Emirates", "url": "https://aa-uae.org", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["united-arab-emirates-nationwide", "online"], "description": "UAE AA service body, coordinating English-language meetings primarily in Dubai (densest), Abu Dhabi, Sharjah, and a growing online network. AA reached the UAE in the late 1980s alongside the expansion of Western expatriate professional populations. Standard 12-step format: free, anonymous, weekly. Almost all meetings are English-language given expat demographics. Meetings typically held in licensed religious-compound venues (St Mary's Catholic, Holy Trinity Anglican, etc.) given UAE's regulatory framework."}, {"name": "Acts 29 Network", "url": "https://www.acts29.com", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "Reformed evangelical church-planting network founded in 2000, focused on supporting and assessing church-planters across the US and globally. Member churches typically run distinctive men's-ministry programming with Reformed theological framing \u2014 emphasizing biblical manhood, accountability, and intentional discipleship. Active across the US with concentration in major metros."}, {"name": "Adult Children of Alcoholics & Dysfunctional Families (ACA)", "url": "https://adultchildren.org", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["us-nationwide", "online"], "description": "12-step fellowship for adults raised in alcoholic, abusive, or otherwise dysfunctional family systems, founded in 1978. Meetings address how childhood patterns shape adult relationships, work, and self-perception, using the program's \"Laundry List\" of common traits as a starting point. Phone, online, and in-person meetings nationally; free, anonymous, peer-led."}, {"name": "Adventist Men's Ministries", "url": "https://www.adventist.org", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "Men's ministry department of the Seventh-day Adventist Church (SDA), with chapters at member SDA congregations across the US. Local groups run study, service, retreats, and an annual men's congress at the conference and union levels. The SDA's distinctive theology \u2014 Saturday Sabbath worship, vegetarian-leaning health emphasis, end-times eschatology \u2014 shapes the men's ministry's character distinctly from mainline or evangelical Protestant counterparts."}, {"name": "AHEPA (American Hellenic Educational Progressive Association)", "url": "https://ahepa.org/", "category": "civic-fraternal", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "Greek-American fraternal organization founded in 1922 in Atlanta, originally to combat anti-Greek discrimination (notably Ku Klux Klan attacks on Greek-American immigrants). Now broadly serves the Greek-American community with chapters across the US. Programs include Hellenic cultural preservation, scholarships, and charitable work. While not formally Greek-Orthodox, the organization is deeply intertwined with Greek-Orthodox Church communities."}, {"name": "Alcoholics Anonymous", "url": "https://www.aa.org", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["us-nationwide", "online"], "description": "International fellowship of men and women recovering from alcoholism, founded in 1935. Meetings happen multiple times daily in most US cities; many groups host men-only formats. Free, anonymous, and the lowest-barrier intake of any recovery community \u2014 a foundational door for any man in active crisis around drinking."}, {"name": "Aleph Society", "url": "https://alephsociety.org", "category": "faith-community", "tradition": "jewish", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide", "online"], "description": "Jewish educational organization founded in 1988 to support the work of Rabbi Adin Even-Israel Steinsaltz (1937\u20132020), focusing on making Talmud study accessible to broad Jewish audiences. While not strictly a men's organization, Aleph Society partners support Talmud-study chevrutas (study pairs) and small-group classes that traditionally have a strong men's-participation register in Orthodox communities."}, {"name": "All Pro Dad", "url": "https://allprodad.com/", "category": "fatherhood", "tradition": "christian", "cost": "free", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "National fatherhood organization running \"All Pro Dad's Day\" \u2014 monthly father-child breakfasts at participating elementary schools across the US. Founded in 1997 as a program of Family First (a Christian family-policy organization in Tampa, FL). The school-based programming is religion-dry by design, focused on the dad-child relationship and structured conversation. Workplace and community-chapter formats also exist. Free for participants."}, {"name": "Alpine Club of Canada (ACC)", "url": "https://alpineclubofcanada.ca/", "category": "outdoor-fitness", "tradition": "secular", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["canada-nationwide"], "description": "Canada's national climbing and mountaineering organization, founded in 1906 in Winnipeg. Operates a network of mountain huts across the Canadian Rockies, regional sections, courses, and expeditions. Mixed-gender by design; men's-gathering function emerges through climbing partnerships, expedition cohorts, and section events."}, {"name": "AME Sons of Allen", "url": "https://www.ame-church.com", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "Men's ministry of the African Methodist Episcopal Church (AME), known as Sons of Allen after Richard Allen, the AME's founder (1816). Local Sons of Allen chapters at member AME congregations run breakfasts, study groups, service projects, and an annual congress. The AME Church is the oldest independent Black Protestant denomination in the US."}, {"name": "AME Zion Men's Ministry", "url": "https://amezion.org/", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "Men's ministry of the African Methodist Episcopal Zion Church (AME Zion), founded as a denomination in 1796 in New York City. Distinct from the AME Church (founded 1816 in Philadelphia), with its own structure and history \u2014 notable for Frederick Douglass and Sojourner Truth's affiliations and its abolition-era role as the \"Freedom Church.\" Local men's groups at member congregations across the US."}, {"name": "American Alpine Club", "url": "https://americanalpineclub.org", "category": "outdoor-fitness", "tradition": "secular", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Climbing and mountaineering organization founded in 1902, with national HQ in Golden, CO and approximately 30 regional sections across the US. Members get access to lodge facilities (notably the New River Gorge Climbers' Campground), climbing-grant programs, the AAC library, and section-based events. Mixed-gender by design; men's-gathering function emerges through climbing partnerships, expedition cohorts, and section events."}, {"name": "American Group Psychotherapy Association", "url": "https://agpa.org/", "category": "therapy-clinical", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "National professional association for group psychotherapists, founded in 1942. AGPA's website hosts a \"Find a Therapist\" directory of clinicians who run therapy groups across the US, including men's-only groups. The right meta-entry for a man seeking clinician-led group therapy \u2014 the locator surfaces practitioners by state and specialty."}, {"name": "AMVETS (American Veterans)", "url": "https://www.amvets.org", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "yes", "regions": ["us-nationwide"], "description": "Veterans service organization founded in 1944, congressionally chartered, open to all US military veterans of any era including currently serving members of the Reserves and National Guard. Operates roughly 1,400 posts across the US providing fellowship, benefits advocacy, and community service. Distinguishes from [[Veterans of Foreign Wars]] (foreign-service requirement) and [[The American Legion]] (broader but excludes Reserves) by including currently-serving Reservists."}, {"name": "ANAVETS (Army, Navy & Air Force Veterans in Canada)", "url": "https://anavets.ca", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "yes", "regions": ["canada-nationwide"], "description": "The oldest Canadian veterans organization, founded in 1840 (originally as the Army & Navy Veterans Association). Operates units across Canada providing fellowship, advocacy, and community service. Smaller in absolute size than the [[Royal Canadian Legion]] but with deeper historical continuity \u2014 pre-Confederation roots."}, {"name": "Ancient Order of Hibernians (AOH)", "url": "https://aoh.com/", "category": "civic-fraternal", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "Irish-American Catholic fraternal society founded in 1836 in New York City. Open exclusively to Catholic men of Irish ancestry; local \"divisions\" across the US run charitable work, Irish cultural preservation, and St. Patrick's Day parade organization. Strongest concentration in the Northeast (NY, NJ, MA, PA, CT) and major Catholic cities (Chicago, Cleveland, San Francisco). The Ladies Ancient Order of Hibernians (LAOH) is a parallel women's organization."}, {"name": "Andy's Man Club", "url": "https://andysmanclub.co.uk", "category": "drop-in", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["uk-nationwide"], "description": "UK men's peer-support and suicide-prevention community founded in 2016 by Luke Ambler in memory of his brother-in-law Andy Roberts. Operates approximately 200 weekly Monday-night peer-support groups across the UK. Free, anonymous, peer-led. The motto is \"It's OK to talk.\" Has become one of the most-recognized UK men's-mental-health movements."}, {"name": "Anglican Church of Canada Men's Ministries", "url": "https://www.anglican.ca", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["canada-nationwide"], "description": "Men's ministry network of the Anglican Church of Canada \u2014 the Canadian member province of the Anglican Communion. Local men's groups at member parishes run study, retreats, and service. The Brotherhood of St. Andrew has Canadian chapters operating in coordination with the broader US/global Brotherhood structure (see [[Brotherhood of St Andrew]])."}, {"name": "Anglican Men's Fellowship \u2014 Diocese of Jamaica & The Cayman Islands", "url": "https://anglicandioceseofjamaica.org", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["jamaica-nationwide"], "description": "Men's-fellowship network of the Anglican Diocese of Jamaica & The Cayman Islands, the Jamaican-and-Cayman component of the Church in the Province of the West Indies. Operates parish-level fellowship structures across Jamaican Anglican parishes (~150+) plus Cayman Islands. Activities include monthly fellowship meetings, parish service, and diocesan men's events. The Anglican Church has deep historical roots in Jamaica (since 1655) as the established colonial church; substantial absolute Anglican population."}, {"name": "Anglican Men's Fellowship \u2014 Anglican Church of Kenya (ACK)", "url": "https://www.ackenya.org/", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["kenya-nationwide"], "description": "Men's-fellowship network of the Anglican Church of Kenya (ACK), one of the larger Anglican provinces in Africa. Operates parish-level, diocesan, and provincial structures across the ACK's ~30+ dioceses. Activities include monthly fellowship meetings, evangelical mission, pastoral care, and provincial men's conferences."}, {"name": "Anglican Men's Society of the Church of Nigeria", "url": "https://anglican-nig.org", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["nigeria-nationwide"], "description": "Men's-fellowship network of the Church of Nigeria (Anglican Communion) \u2014 the largest Anglican province globally by active membership. Operates parish-level, diocesan, and provincial structures across the Church of Nigeria's ~160+ dioceses. Activities include monthly fellowship meetings, evangelical mission, pastoral care, and the annual provincial men's conference."}, {"name": "Anglican Sheng Kung Hui (Hong Kong) Men's Fellowship", "url": "https://www.hkskh.org", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["hong-kong-nationwide"], "description": "Men's-fellowship network of Hong Kong Sheng Kung Hui (HKSKH), the autonomous Anglican Province covering Hong Kong and Macau (separated from the Anglican Church in China after 1949 and made an independent Province in 1998). Operates parish-level fellowship structures across HKSKH's Hong Kong Island, Eastern Kowloon, and Western Kowloon dioceses, in both English and Cantonese. St John's Cathedral (Central, since 1849) is the historic flagship and host of the most-prominent English-medium men's gatherings."}, {"name": "Australian Men's Health Forum (AMHF)", "url": "https://www.amhf.org.au", "category": "drop-in", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "no", "regions": ["australia-nationwide", "online"], "description": "National peak body for men's health in Australia. Operates as a research, advocacy, and convening organisation linking the men's-health, men's-mental-health, and men's-services sectors. Publishes the long-running *AMHF News* newsletter, hosts the National Men's Health Gathering, and maintains a directory of Australian men's-health and men's-services organisations that complements (and overlaps with) this directory."}, {"name": "Australian Men's Shed Association", "url": "https://mensshed.org", "category": "drop-in", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "unknown", "regions": ["australia-nationwide"], "description": "National peak body for the roughly 1,200 local Men's Sheds across Australia \u2014 community workshops where men gather to make and build things, plus share tea, conversation, and informal support. Australia is the **origin** of the global Men's Sheds movement (regional Victoria, late 1990s), and AMSA was formalised as the national association in 2007. Sheds are typically free or low-cost, operate weekly, and are particularly meaningful for older men in retirement, isolation, or post-bereavement."}, {"name": "Authentic Manhood / Men's Fraternity", "url": "https://www.authenticmanhood.com/", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Christian men's ministry curriculum and movement founded by Pastor Robert Lewis, originally as \"Men's Fraternity\" at Fellowship Bible Church in Little Rock in 1990. Programs use video-based curriculum (notably \"33 The Series\") supported by small-group discussion, attempting to systematically address what Lewis calls the \"four pillars of authentic manhood.\" Active in churches across the US through curriculum adoption."}, {"name": "Backcountry Hunters & Anglers Canada", "url": "https://www.backcountryhunters.org", "category": "outdoor-fitness", "tradition": "secular", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["canada-nationwide"], "description": "Canadian chapter of [[Backcountry Hunters and Anglers]], founded 2017. Public-land conservation paired with active hunting/fishing culture. Operates provincial chapters in BC, Alberta, Ontario, and other provinces. Mixed-gender by design; men's-gathering function emerges through chapter events, \"Pint Nights,\" and habitat-stewardship days similar to the US BHA."}, {"name": "Backcountry Hunters & Anglers", "url": "https://www.backcountryhunters.org", "category": "outdoor-fitness", "tradition": "secular", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Hunting, fishing, and public-land conservation organization, founded in 2004 in Oregon. Operates state and regional chapters across the US \u2014 chapter meetings, \"Pint Nights,\" habitat-stewardship days, and educational events constitute the recurring gathering. Officially mixed-gender; in practice many chapter events function as significant men's-gathering sites in regions where hunting and fishing remain male-coded activities."}, {"name": "Bah\u00e1'\u00ed Faith (US Community)", "url": "https://www.bahai.us", "category": "faith-community", "tradition": "bahai", "cost": "free", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "Independent monotheistic religion with US community since 1894 and approximately 150,000 US members. The US National Spiritual Assembly is headquartered near the Bah\u00e1'\u00ed House of Worship in Wilmette, IL. Local Bah\u00e1'\u00ed communities (\"Local Spiritual Assemblies\") gather for the Nineteen Day Feasts (held every 19 days), study circles, devotional gatherings, and youth-development programs."}, {"name": "BAPS Swaminarayan Sanstha", "url": "https://www.baps.org", "category": "faith-community", "tradition": "hindu", "cost": "free", "intake": "open", "crisis_safe": "unknown", "regions": ["us-multiple"], "description": "Global Swaminarayan Hindu denomination with one of the largest US temple networks, including the BAPS Swaminarayan Akshardham Mahamandir in Robbinsville, NJ \u2014 the largest Hindu temple in the US (opened 2023). Local BAPS centers (mandirs) across the US run age-graded men's groups including Bal Mandals (boys), Yuvak Mandals (young men), and Karyakar networks (adult male volunteers and seva). Strong men's-specific structure within a fundamentally family-oriented religious community."}, {"name": "Bellwood Health Services", "url": "https://www.edgewoodhealthnetwork.com/locations/bellwood/", "category": "therapy-clinical", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "yes", "regions": ["ca-ON"], "description": "Toronto-based addiction-treatment centre with residential and outpatient programs. Part of the Edgewood Health Network alongside [[Edgewood Treatment Centre]] in BC. Mixed-gender residential with separate men's-track programming and specialized programs for first responders, veterans, and professionals. Insurance-funded for many; private-pay also."}, {"name": "Beyond Blue", "url": "https://www.beyondblue.org.au", "category": "therapy-clinical", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["australia-nationwide", "online"], "description": "Australia's largest mental-health charity, founded in 2000 by former Victorian Premier Jeff Kennett. Operates a 24/7 phone and webchat support service (1300 22 4636), peer-moderated online forums, and substantial men's-specific mental-health programs and resources. Not men-only, but its men's-mental-health programming and the heavily-male user base of its forums make it a primary entry point for Australian men in distress."}, {"name": "Big Brothers Big Sisters of Canada", "url": "https://bigbrothersbigsisters.ca", "category": "rites-boys", "tradition": "secular", "cost": "free", "intake": "vetted", "crisis_safe": "no", "regions": ["canada-nationwide"], "description": "Canadian counterpart to [[Big Brothers Big Sisters of America]], operating as a separate Canadian organization since 1916 (Toronto). Operates roughly 100 local agencies across Canada. The \"Big Brother\" program matches adult male volunteers with boys for one-to-one mentoring relationships of at least one year. Free for participants; volunteer Bigs go through screening and training."}, {"name": "Big Brothers Big Sisters of America", "url": "https://www.bbbs.org", "category": "rites-boys", "tradition": "secular", "cost": "free", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "National youth-mentorship organization founded in 1904, operating roughly 230 local affiliated agencies across the US. The \"Big Brother\" program matches adult male volunteers (\"Bigs\") with boys (\"Littles\") for one-to-one mentoring relationships of at least one year's duration. Free for participants; volunteer Bigs go through screening, background checks, and training. Listed under `rites` because the boy-meets-mentor relationship is the program's core, and the adult Big-volunteer cohort constitutes a meaningful men's-mentorship community."}, {"name": "Big Buddy Mentoring", "url": "https://www.bigbuddy.org.nz/", "category": "rites-boys", "tradition": "secular", "cost": "free", "intake": "vetted", "crisis_safe": "no", "regions": ["new-zealand-nationwide"], "description": "New Zealand mentoring charity that matches fatherless boys with screened, trained adult-male mentors for ongoing one-to-one relationship over years. Founded in 1997. Operates primarily in the upper North Island (Auckland, Waikato, Bay of Plenty), with nation-wide aspirations. Vetted intake \u2014 mentors undergo full screening and training before being matched. Free for the boy and his family."}, {"name": "Black Fathers Foundation", "url": "https://blackfathersfoundation.org", "category": "fatherhood", "tradition": "secular", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "Non-profit organization focused on supporting Black fathers through programming, advocacy, mentorship, and community-building. Operates in cities across the US through chapters or program partnerships. Listed alongside [[Concerned Black Men National]] and [[100 Black Men of America]] for Black men's gathering coverage \u2014 Black Fathers Foundation focuses specifically on fatherhood while CBM and 100 Black Men have broader civic mentorship missions."}, {"name": "Light of Jesus Family \u2014 Brotherhood", "url": "https://lightofjesus.com", "category": "faith-community", "tradition": "christian", "cost": "free", "intake": "open", "crisis_safe": "no", "regions": ["philippines-nationwide", "online"], "description": "Men's-fellowship network of Light of Jesus Family (LOJ), a Filipino Catholic charismatic lay community founded 1980 by Bo Sanchez. LOJ operates the long-running Kerygma Community / Feast worship gatherings (often >50,000 attendance per major gathering) plus the smaller-scale Brotherhood / men's-cohort tracks. Free participation; Catholic-charismatic frame with Bo Sanchez's distinctive popular-spirituality and prosperity-adjacent teachings."}, {"name": "Boys & Girls Clubs of America", "url": "https://www.bgca.org", "category": "rites-boys", "tradition": "secular", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "National network of after-school clubs for youth ages 6\u201318, with origins in 1860 (Hartford, CT) and the modern federation founded in 1956. Operates roughly 5,000 club sites across the US, plus military bases and Native American lands. Co-ed since the 1990 merger of Boys' Clubs of America and the Girls Clubs; adult male volunteers and staff constitute significant mentorship presence. Listed under `rites` for its youth-development mission and the men's-mentorship structure within the broader program."}, {"name": "The Boys' Brigade in Malaysia", "url": "https://bb.org.my", "category": "rites-boys", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["malaysia-nationwide"], "description": "Malaysia's national Boys' Brigade organisation, founded 1946 (the first BB Company in Singapore-Malaya territory was actually established 1930 in Singapore; Malaysia's separate national body emerged after independence). School-based weekly companies for boys aged 9\u201318 in Christian-rooted character, leadership, and faith development. Active across Peninsular Malaysia, Sabah, and Sarawak; particularly strong in mission-school networks and Methodist / Anglican / Catholic-affiliated schools."}, {"name": "The Boys' Brigade in Singapore", "url": "https://bb.org.sg/", "category": "rites-boys", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["singapore-nationwide"], "description": "Singapore's national Boys' Brigade organisation, founded 1930 and one of the oldest BB national bodies outside the UK. School-based weekly companies for boys aged 9\u201318 in Christian-rooted character, leadership, and faith development. ~5,000 active members across most major Singapore secondary schools. Uniformed-youth structure with parade nights, badges, camps, and the long-running Sharity Gift Box charity drive. Christian frame throughout but inclusive of non-Christian boys at participating schools."}, {"name": "The Boys' Brigade", "url": "https://boys-brigade.org.uk", "category": "rites-boys", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["uk-nationwide", "ireland-nationwide"], "description": "Christian uniformed youth organization for boys ages 5\u201318, founded in 1883 in Glasgow by William Alexander Smith \u2014 predates Boy Scouts (1907) and is the original modern Christian boys' organization. Combines drill, education, badges, and Christian formation. Active in the UK, Republic of Ireland, Northern Ireland, and former British Commonwealth countries; smaller US presence as Christian Service Brigade adopted some Boys' Brigade structures."}, {"name": "Boys to Men Mentoring Network", "url": "https://boystomen.org", "category": "rites-boys", "tradition": "secular", "cost": "sliding", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Mentorship and rites-of-passage program for adolescent boys, founded in San Diego in 1996. Combines weekly mentor-led groups for boys with multi-day \"Adventure\" weekends led by adult male volunteers. Adult mentors are vetted and trained. US chapter network is concentrated in California with expansions across the country and abroad."}, {"name": "Benevolent and Protective Order of Elks (BPOE)", "url": "https://www.elks.org", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "US-only fraternal order founded in 1868 in New York City, operating roughly 2,000 lodges across all 50 states. Lodges meet weekly for fellowship, charitable work, and signature programs including extensive veterans support, scholarships, and youth programs. Membership requires belief in God, US citizenship, and 21+. Co-ed since 1995, but lodges remain male-majority in many cities."}, {"name": "Brotherhood of Saint Andrew Canada", "url": "https://www.brothersandrew.net", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["canada-nationwide"], "description": "Canadian chapters of the Brotherhood of St. Andrew, the international Anglican men's organization founded in 1883 (see US [[Brotherhood of St Andrew]] entry). Canadian chapters operate at member parishes within the [[Anglican Church of Canada Mens Ministries]] tradition. Members commit to weekly disciplines of prayer, study, and service."}, {"name": "Brotherhood of St Andrew India", "url": "https://cnisynod.org", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["india-nationwide"], "description": "Anglican / Mar Thoma men's-fellowship presence in India, operating through the Church of North India (CNI), Church of South India (CSI), and the Mar Thoma Syrian Church. The Brotherhood of St Andrew was founded 1883 in the United States; Indian chapters exist particularly in Kerala (Mar Thoma heartland), Tamil Nadu, Andhra Pradesh, and Maharashtra. Activities include monthly fellowship, parish service, and the Brotherhood's \"Rule of Prayer and Service\" \u2014 a daily commitment to prayer for the spread of Christ's kingdom among men."}, {"name": "Brotherhood of St. Andrew", "url": "https://www.brothersandrew.net", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "Men's ministry of the Episcopal Church (and select Anglican parishes), founded in Chicago in 1883 \u2014 the oldest continuously-operating Episcopal men's organization in the US. Chapters at member parishes commit to weekly disciplines of prayer, study, and service. Active in Episcopal cathedrals and parishes across the US, with international counterparts elsewhere in the Anglican Communion."}, {"name": "Brothers in Arms NZ", "url": "https://brothersinarms.co.nz", "category": "drop-in", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["new-zealand-nationwide"], "description": "NZ men's peer-support charity running free local group meetings designed as low-barrier entry points for men experiencing mental-health distress, isolation, or grief. Modeled in spirit on UK [[Andys Man Club]] \u2014 peer-led, weekly, free, anonymous, \"it's OK to talk.\" Operates across multiple NZ regions with growing reach."}, {"name": "Buddhist Churches of America (BCA)", "url": "https://www.buddhistchurchesofamerica.org", "category": "faith-community", "tradition": "buddhist", "cost": "free", "intake": "open", "crisis_safe": "unknown", "regions": ["us-multiple"], "description": "Mainstream Buddhist denomination in the US for Jodo Shinshu (True Pure Land) Buddhism, founded in 1899 as the Buddhist Mission of North America. Approximately 60 temples across the US, concentrated in California and Hawaii where Japanese-American Buddhist communities historically settled. Each temple has a sangha (community) with men's-specific groups (Buddhist Brotherhood / Sangha) running parallel to women's and youth divisions. Free, donation-supported."}, {"name": "CALM (Campaign Against Living Miserably)", "url": "https://www.thecalmzone.net", "category": "drop-in", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["uk-nationwide"], "description": "UK men's-suicide-prevention charity founded in 2006. Operates the CALM helpline (5pm to midnight, free), webchat support, and a community/awareness platform. Suicide is the leading killer of men under 50 in the UK; CALM's mission centers on changing that. Not a gathering itself but a critical crisis-support layer alongside [[Andys Man Club]] and [[Samaritans]] in the UK men's-mental-health-crisis landscape."}, {"name": "Centre for Addiction and Mental Health (CAMH)", "url": "https://www.camh.ca", "category": "drop-in", "tradition": "secular", "cost": "free", "intake": "vetted", "crisis_safe": "yes", "regions": ["ca-ON"], "description": "Canada's largest mental-health and addiction teaching hospital, located in Toronto. Founded in 1998 through merger of four predecessor institutions. Operates inpatient, outpatient, and community programs including some men's-specific services for substance use, concurrent disorders, and trauma. Public-funded through Ontario healthcare; many programs are free or covered."}, {"name": "Canadian Baptist Ministries", "url": "https://www.cbmin.org", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["canada-nationwide"], "description": "Umbrella body for the four main Canadian Baptist Convention bodies \u2014 the Canadian Baptists of Atlantic Canada, the Canadian Baptists of Ontario and Quebec, the Canadian Baptists of Western Canada, and the Union d'\u00c9glises Baptistes Francophones du Canada (French-language). Men's ministries operate at convention and congregation levels with study, retreats, and service projects. Theological orientation generally mainline-evangelical."}, {"name": "Canadian Cadet Programs (Sea / Army / Air Cadets)", "url": "https://cadets.ca", "category": "rites-boys", "tradition": "secular", "cost": "free", "intake": "vetted", "crisis_safe": "no", "regions": ["canada-nationwide"], "description": "Canadian Forces\u2013sponsored youth program for ages 12\u201318, comprising the Royal Canadian Sea Cadets, Royal Canadian Army Cadets, and Royal Canadian Air Cadets. Free for cadets \u2014 uniforms, training, and summer-camp programs are funded by the Canadian government. Adult mentors include serving and former Canadian Armed Forces members plus civilian volunteers (the Civilian Instructor Cadre)."}, {"name": "Canadian Centre for Men and Families (CCMF)", "url": "https://menandfamilies.org", "category": "therapy-clinical", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["canada-nationwide"], "description": "Multi-city Canadian organization providing peer support, mental-health services, and family support to men, founded in 2014 with locations in Toronto, Calgary, Ottawa, Halifax, and other cities. Programs include peer-led support groups, fatherhood programs, men's mental-health counseling, and crisis support. Free or low-cost for participants."}, {"name": "Canadian Mental Health Association (CMHA)", "url": "https://cmha.ca", "category": "therapy-clinical", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["canada-nationwide"], "description": "Largest Canadian mental health charity, founded in 1918, with branches across all provinces and one territory. Many CMHA branches run men's-specific peer-support groups, mental-wellness workshops, and crisis-line services. Programs vary by branch and province; the national umbrella supports advocacy and research while local branches deliver direct services."}, {"name": "Catholic Bishops' Conference of the Philippines (CBCP) Men's Ministry", "url": "https://cbcponline.net", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["philippines-nationwide"], "description": "Men's-ministry coordination of the Catholic Bishops' Conference of the Philippines, operating through ~86 territorial dioceses and ~10 military / personal apostolic structures. Parish-level men's groups follow varied forms \u2014 Holy Name Society confraternities, Knights of Columbus councils, Cursillo de Cristiandad alumni groups, and lay-renewal-movement chapters (CFC BCBP, El Shaddai, Light of Jesus). The CBCP itself coordinates national pastoral programmes; per-parish men's-fellowship contacts vary widely."}, {"name": "Catholic Diocese of Hong Kong Men's Ministry", "url": "https://catholic.org.hk", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["hong-kong-nationwide"], "description": "Men's-ministry network of the Catholic Diocese of Hong Kong (founded 1841 as Apostolic Prefecture; Diocese since 1946), one of the larger Catholic dioceses in East Asia. Operates parish-level men's-fellowship structures across Hong Kong's ~50+ Catholic parishes \u2014 including [[Holy Name Society]]-style confraternities. Substantial Filipino-Catholic men's gatherings concentrate around parishes serving the Filipino domestic-worker community (St Joseph's Garden Road, Wan Chai; The Holy Spirit, etc.). Bilingual operation in English, Cantonese, and Filipino."}, {"name": "Catholic Men Association of Kenya", "url": "https://kccb.or.ke", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["kenya-nationwide"], "description": "Lay men's body of the Kenya Conference of Catholic Bishops (KCCB) \u2014 the men's parallel to the Catholic Women Association (CWA). Operates parish-level, diocesan, and national structures across all Kenyan Catholic dioceses. Membership requires being a practising Catholic man; activities include monthly meetings, parish service, retreats, and the annual association assembly."}, {"name": "Catholic Men Organisation of Nigeria (CMON)", "url": "https://cmonnational.org", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["nigeria-nationwide"], "description": "Official lay men's body of the Catholic Bishops' Conference of Nigeria \u2014 the men's parallel to the Catholic Women Organisation (CWO). Operates parish-level, diocesan, and national structures across all Nigerian Catholic dioceses (~50+ dioceses). Membership requires being a practising Catholic man; activities include monthly meetings, parish service, retreats, and the annual CMON National Conference. Significantly larger in absolute scale than most Western-Catholic men's fraternal orders given Nigeria's Catholic population."}, {"name": "Catholic Men's Society of Ghana", "url": "https://catholicchurchghana.com", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["ghana-nationwide"], "description": "Lay men's body associated with the Ghana Catholic Bishops' Conference. Operates parish-level, diocesan, and national structures across Ghanaian Catholic dioceses. Membership requires being a practising Catholic man; activities include monthly meetings, parish service, retreats, and an annual society conference. Counterpart institutional pattern to Catholic men's lay bodies in other African Catholic countries."}, {"name": "Catholic War Veterans of the USA", "url": "https://www.cwv.org", "category": "civic-fraternal", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "yes", "regions": ["us-nationwide"], "description": "Congressionally chartered veterans service organization for Catholic men and women who served in US military combat or war-zone deployments, founded in 1935. Operates posts across the US providing fellowship, advocacy, and Catholic-faith-rooted veteran community. Smaller in absolute size than [[Veterans of Foreign Wars]] or [[The American Legion]] but distinctive in its explicit Catholic identity \u2014 combines the veteran-fraternal model with parish-level Catholic men's-ministry character."}, {"name": "Celebrate Recovery", "url": "https://celebraterecovery.com/", "category": "drop-in", "tradition": "christian", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["us-nationwide"], "description": "Christian 12-step-influenced recovery program hosted by churches across the US, addressing addictions and what they call \"hurts, habits, and hang-ups.\" Most meetings include open share groups segmented by gender. Free, weekly, and low-friction \u2014 a viable door for a man in crisis who's open to a Christian frame."}, {"name": "Center for Employment Opportunities (CEO)", "url": "https://ceoworks.org", "category": "reentry", "tradition": "secular", "cost": "free", "intake": "vetted", "crisis_safe": "yes", "regions": ["us-multiple"], "description": "Reentry employment program founded in 1996 in New York City, now operating in multiple US states. Provides immediate-paid transitional work (typically 4-day-a-week crew labor) plus job-readiness services and full-time job placement for men recently released from incarceration. Free for participants. Independently validated through randomized controlled trials showing significant reductions in recidivism."}, {"name": "Centre for Fathering Singapore", "url": "https://fathers.com.sg", "category": "fatherhood", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "no", "regions": ["singapore-nationwide", "online"], "description": "Singapore charity founded in 2000 to promote active and engaged fatherhood; in 2009 launched the national **Dads for Life** movement in partnership with the Singapore government. Programmes include the Dads for Life Family Life Champions network, fatherhood courses, school-based engagement (e.g. ICAN \u2014 Involved-Caring-Available-Networking), and corporate partnerships. Free for participants; widely-recognised national fatherhood programme studied as a model internationally."}, {"name": "CFC Brotherhood of Christian Businessmen and Professionals (BCBP)", "url": "https://couplesforchrist.com.ph", "category": "faith-community", "tradition": "christian", "cost": "free", "intake": "vetted", "crisis_safe": "no", "regions": ["philippines-nationwide", "online"], "description": "Men's-fellowship arm of Couples for Christ (CFC), the global Filipino-rooted Catholic charismatic lay renewal movement (founded 1981 in Manila; now operating in 165+ countries). The BCBP runs men-specific weekly chapter meetings, retreats, and the Christian Life Program (CLP) \u2014 a multi-week introductory teaching series that all CFC members complete. Free participation; Catholic-charismatic frame throughout. Branches operate across the Philippines and in major Filipino-diaspora communities (US, Canada, UK, Australia, Hong Kong, UAE, Saudi Arabia, etc.)."}, {"name": "CFK Africa (Carolina for Kibera)", "url": "https://cfkafrica.org", "category": "rites-boys", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "no", "regions": ["kenya-nationwide"], "description": "Kenyan-led NGO operating in Kibera (Africa's largest urban informal settlement) and other Nairobi communities, founde
