d in 2001 as a partnership between Kenyan community leaders and the University of North Carolina. Programmes include the Taka Ni Pato youth-environmental movement, sports-for-development (the long-running Kibera Soccer League), girls' empowerment, healthcare, and the Daraja Boys' programme \u2014 a youth-mentoring intervention for adolescent boys at risk of gang involvement."}, {"name": "Chabad-Lubavitch (Local Centers)", "url": "https://www.chabad.org/centers", "category": "faith-community", "tradition": "jewish", "cost": "free", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "International Hasidic Jewish outreach movement with thousands of Chabad Houses and centers across the US. Each center is independent and run by a Chabad rabbi-couple, but most host daily morning minyan (men's prayer), men's Torah study, and other men-specific gatherings as part of broader community programming. Listed as a meta-entry pointing to chabad.org's center locator; intake is welcoming to Jewish men of any background, including unaffiliated and beginner-level."}, {"name": "Christian Motorcyclists Association UK", "url": "https://bike.org.uk", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["uk-nationwide"], "description": "UK Christian motorcyclist ministry, the British counterpart to the US [[Christian Motorcyclists Association]]. Members ride together for fellowship and street-level evangelism at biker events and rallies across the UK. Various UK Christian biker ministries exist; CMA UK is one of the more-established, with a presence at major UK rallies (BMF Show, etc.)."}, {"name": "Christian Motorcyclists Association (CMA)", "url": "https://cmausa.org", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Christian motorcyclist ministry founded in 1975 in Hatfield, AR. Local chapters across the US gather for rides, charitable work, and street-level evangelism. Distinctive in combining motorcycle culture with explicit Christian formation. Not all CMA members ride; \"Friends of CMA\" supports the ministry without riding. Men's-gathering function emerges through chapter rides, work events, and the National Rally."}, {"name": "Christian Reformed Church Men's Ministry", "url": "https://www.crcna.org", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["us-multiple"], "description": "Men's ministry of the Christian Reformed Church in North America (CRCNA), a Dutch Reformed (Calvinist) denomination with US members concentrated in Michigan (especially Grand Rapids), Iowa, Illinois, California, and Washington. Local men's groups at member congregations run study, retreats, and service projects within an explicit Reformed-Calvinist theological frame."}, {"name": "Christian Service Brigade (CSB)", "url": "https://csbministries.org", "category": "rites-boys", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["canada-nationwide", "us-nationwide"], "description": "Cross-denominational evangelical Christian boys' program founded in 1937, with active US and Canadian operations. Boys ages 7\u201317 join age-graded sections (Stockade for younger boys, Battalion for older boys) led by adult men trained as CSB leaders. Programs combine Christian formation, outdoor skills, and badge-based advancement."}, {"name": "Christian Surfers United States", "url": "https://csunitedstates.org", "category": "outdoor-fitness", "tradition": "christian", "cost": "free", "intake": "open", "crisis_safe": "no", "regions": ["us-multiple"], "description": "US chapter of Christian Surfers International, a global Christian surfing ministry founded in Australia in 1977. US presence centers on coastal communities (CA, FL, HI, the Carolinas, Oregon). Local chapters host beach gatherings, paddle-outs, and Christian formation rooted in surfing culture. Mixed-gender but male-majority given surf demographics."}, {"name": "Christian Vision for Men (CVM)", "url": "https://www.cvm.org.uk", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["uk-nationwide"], "description": "UK evangelical men's ministry founded in 1996 by Carl Beech. Hosts annual men's conferences (notably \"The Gathering\"), publishes resources, and supports local church-based men's groups across the UK. Theologically evangelical Protestant."}, {"name": "City Dads Group", "url": "https://dadssupportingdads.org/", "category": "fatherhood", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Network of dad meetup groups in major US cities, founded in NYC in 2008. Local chapters host playdates, dad's nights out, and discussion groups; entry is free and informal. Best for new and active dads looking for peer connection in an urban environment."}, {"name": "Civil Air Patrol (CAP)", "url": "https://www.gocivilairpatrol.com", "category": "rites-boys", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Congressionally chartered nonprofit and official auxiliary of the US Air Force, founded in 1941. Three core missions: emergency services (search and rescue, disaster response), aerospace education, and a cadet program for youth ages 12\u201321. Adult members serve as senior members supporting the cadet program and operations. The cadet program is a meaningful rites-of-passage structure for boys with adult-male mentor presence."}, {"name": "Christian Methodist Episcopal (CME) Men", "url": "https://thecmechurch.org/", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "Men's ministry of the Christian Methodist Episcopal Church (CME), one of the three historic Black Methodist denominations alongside [[AME Sons of Allen]] and [[AME Zion Men]]. Founded in 1870 in Jackson, TN as the Colored Methodist Episcopal Church (renamed in 1954). Local men's groups at member CME congregations across the US."}, {"name": "Cocaine Anonymous", "url": "https://ca.org", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["us-nationwide", "online"], "description": "12-step fellowship for recovery from cocaine and other mind-altering substances, founded in 1982. The fellowship's tradition is open to anyone with \"a desire to stop using cocaine and all other mind-altering substances,\" making it cross-addiction friendly. Phone, online, and in-person meetings nationally; free, anonymous, peer-led."}, {"name": "Codependents Anonymous (CoDA)", "url": "https://coda.org", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["us-nationwide", "online"], "description": "12-step fellowship for recovery from codependency patterns in relationships, founded in 1986 in Phoenix, AZ. Meetings address compulsive caretaking, people-pleasing, controlling behaviors, and difficulty maintaining functional intimate relationships. In-person and online meetings nationwide. Free, anonymous, peer-led."}, {"name": "COGIC Department of Men", "url": "https://www.cogic.org", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "Men's department of the Church of God in Christ (COGIC), the largest Pentecostal denomination of African Americans, founded in 1907 by Bishop Charles Harrison Mason. Headquartered in Memphis, TN. Department of Men programs operate at the local-church, district, jurisdiction, and national levels with annual gatherings drawing thousands of men. The COGIC Holy Convocation in Memphis (held in November) is among the largest Black Christian gatherings in the US."}, {"name": "Combat Stress", "url": "https://combatstress.org.uk/", "category": "therapy-clinical", "tradition": "secular", "cost": "free", "intake": "vetted", "crisis_safe": "yes", "regions": ["uk-nationwide"], "description": "UK military mental-health charity founded in 1919 (originally the Ex-Servicemen's Welfare Society), among the oldest veteran mental-health organizations in the world. Provides clinical mental-health services, peer support, and a 24/7 helpline for UK veterans dealing with PTSD, depression, moral injury, and combat trauma. Free for UK veterans."}, {"name": "Compassion Prison Project", "url": "https://compassionprisonproject.org", "category": "reentry", "tradition": "secular", "cost": "free", "intake": "vetted", "crisis_safe": "yes", "regions": ["us-nationwide", "online"], "description": "Trauma-informed prison program founded in 2018 by Fritzi Horstman, focused on healing childhood trauma (Adverse Childhood Experiences / ACEs) inside US correctional facilities. Programs combine ACE-survey conversations, circle work, and trauma education with men inside, and training outside volunteers to facilitate. Free for participants; volunteer-driven on the outside."}, {"name": "Concerned Black Men National (CBM)", "url": "https://cbmnational.org/", "category": "fatherhood", "tradition": "secular", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "National non-profit founded in Philadelphia in 1975, focused on Black male mentorship, fatherhood support, and youth development. Local chapters across the US run mentor programs for boys, fatherhood programs for adult men, and community service. CBM operates the \"CARES Mentoring Movement\" and other ongoing programs alongside chapter-based work."}, {"name": "Conquer Series", "url": "https://conquerseries.com", "category": "therapy-clinical", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Ten-week video-curriculum series for Christian men's sexual integrity, produced by Kingdom Works Productions and led by Jeremy Wiles. Used by churches and small groups across the US \u2014 typically watched together with weekly small-group accountability discussion. Cinematic production quality differentiates it from earlier workbook-based ministries. Christian frame is explicit; cessation of pornography use is the core goal."}, {"name": "Christian Reformed Church Canada", "url": "https://www.crcna.org", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["canada-nationwide"], "description": "Canadian member region of the [[Christian Reformed Church Mens Ministry]] (CRC of North America). Dutch Reformed (Calvinist) denomination with approximately 40,000 Canadian members concentrated in Ontario, BC, and Alberta, where Dutch immigrant communities settled post-WWII. Local men's groups at member CRC congregations within the CRCNA's bi-national structure."}, {"name": "Crystal Meth Anonymous (CMA)", "url": "https://www.crystalmeth.org/", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["us-nationwide", "online"], "description": "12-step fellowship for recovery from methamphetamine and crystal-meth dependence, founded in 1994 in West Hollywood, CA. In-person and online meetings are free, anonymous, peer-led. Particularly active in cities with significant gay-male populations where meth use has been a persistent issue, plus the Mountain West and rural areas with documented meth problems."}, {"name": "Cursillo Movement Canada (Mouvement des Cursillos du Canada)", "url": "https://www.cursillocanada.ca", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["canada-nationwide"], "description": "Canadian member of the global Cursillo Movement \u2014 Catholic three-day retreat program (see US [[Cursillo Movement]] entry). Particularly active in Quebec where the Mouvement des Cursillos op\u00e9rates in French; English-language Cursillos run in Ontario, the Atlantic provinces, and other dioceses. Group Reunions and Ultreyas continue post-weekend, providing ongoing Catholic men's community."}, {"name": "Cursillos de Cristiandad (Cursillo Movement)", "url": "https://cursillousa.org/", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Catholic three-day retreat movement that began in Spain in 1944 (the name means \"short course\") and arrived in the US in 1957. Cursillo weekends are gender-segregated \u2014 men's weekends and women's weekends run separately \u2014 combining teaching, sharing, and small-group reflection. After the weekend, participants join \"Group Reunions\" (small ongoing accountability groups) and periodic regional gatherings called \"Ultreyas.\" Active in most US Catholic dioceses with both English and Spanish tracks; Spanish-language Cursillos are particularly significant in dioceses with large Hispanic populations."}, {"name": "Dad 2.0 Summit", "url": "https://www.dad20summit.com", "category": "fatherhood", "tradition": "secular", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide", "online"], "description": "Annual conference and ongoing community for fathers, founded 2012, oriented toward modern fatherhood and dad bloggers / content creators. The annual summit (typically held in February or March in a different US city each year) includes panels, workshops, and structured networking. An active online community continues year-round through a private Facebook group and similar channels. Conference attendance is fee-based; community participation is free."}, {"name": "Dads Group Australia", "url": "https://www.dadsgroup.org", "category": "fatherhood", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "no", "regions": ["australia-nationwide"], "description": "Australian fatherhood charity supporting a national network of free local Dads Groups \u2014 peer-led gatherings of new and existing fathers with their kids, modeled loosely on traditional mothers' groups but designed for dads. Founded in 2014. Groups typically meet weekly or fortnightly at parks, cafes, libraries, or community centres. Free to join; volunteer-run with light national infrastructure for support and training."}, {"name": "Defy Ventures", "url": "https://defyventures.org", "category": "reentry", "tradition": "secular", "cost": "free", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Entrepreneurship and personal-development program for currently and formerly incarcerated men, founded 2010. Combines in-prison curriculum with post-release coaching and volunteer mentorship from outside business professionals. Free for participants; supported by volunteer engagement and donor funding."}, {"name": "DeMolay International", "url": "https://beademolay.org/", "category": "rites-boys", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "International fraternal youth organization for young men ages 12\u201321, founded in 1919 in Kansas City, MO. Sponsored by Freemasonry but does not require Masonic affiliation for membership. Local chapters operate across the US with adult Masonic advisors providing mentorship structure. Programs combine ritual ceremony, civic service, and leadership development."}, {"name": "Disabled American Veterans (DAV)", "url": "https://www.dav.org", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "yes", "regions": ["us-nationwide", "online"], "description": "Congressionally chartered veterans service organization founded in 1920 for veterans wounded or disabled in service. Operates roughly 1,300 chapters across the US, plus a national network of service officers who help veterans navigate VA disability claims and benefits. Chapter meetings provide brotherhood and mentorship; the service-officer work is among the most-used veterans-benefits navigation resources in the country."}, {"name": "Disciples of Christ Men's Ministry", "url": "https://disciples.org", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "Men's ministry of the Christian Church (Disciples of Christ), a mainline Protestant denomination rooted in the early-19th-century Restoration Movement. Local chapters at member congregations run study groups, service projects, and an annual gathering. Smaller in absolute size than [[United Methodist Men]] or the Presbyterian/Lutheran men's ministries but distinctive within the Restoration Movement tradition."}, {"name": "Ducks Unlimited Canada", "url": "https://www.ducks.ca", "category": "outdoor-fitness", "tradition": "secular", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["canada-nationwide"], "description": "Canadian waterfowl and wetlands conservation nonprofit founded in 1938, the Canadian parallel to [[Ducks Unlimited]] (US DU). Conducts wetlands habitat work across Canada with chapter networks running banquets, field events, and youth mentor programs. Men's-gathering function emerges through chapter culture similar to US DU, especially in Prairies provinces, Atlantic Canada, and Ontario."}, {"name": "Ducks Unlimited (DU)", "url": "https://www.ducks.org", "category": "outdoor-fitness", "tradition": "secular", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Waterfowl-conservation nonprofit founded in 1937, with approximately 700,000 members and chapter-banquet networks across the US. Mission centers on wetland and waterfowl-habitat conservation, but the chapter banquets, sportsmen's nights, and youth-mentor programs function as significant men's-gathering sites in regions with substantial duck-hunting culture."}, {"name": "Eastern Orthodox Parish Men's Groups", "url": "https://www.assemblyofbishops.org/", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "Eastern Orthodox parishes across the US \u2014 operating under multiple jurisdictions including OCA (Orthodox Church in America), Greek Orthodox Archdiocese, Antiochian Orthodox, ROCOR (Russian Orthodox Outside Russia), Serbian Orthodox, Romanian Orthodox, Bulgarian Orthodox, Coptic Orthodox, Ethiopian Orthodox, and others \u2014 typically maintain parish men's groups with variable programming. Most gather monthly for fellowship, charity, study, and discussion. The Assembly of Canonical Orthodox Bishops serves as a coordinating umbrella and parish-finder."}, {"name": "Eastern Orthodox Parishes Canada", "url": "https://www.assemblyofbishops.org/", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["canada-nationwide"], "description": "Eastern Orthodox parishes across Canada \u2014 operating under multiple jurisdictions including OCA Canada, Antiochian Orthodox Archdiocese of Canada, Greek Orthodox Metropolis of Toronto (Canada), Russian Orthodox Canadian dioceses (ROCOR and Moscow Patriarchate), Serbian Orthodox, Ukrainian Orthodox Church of Canada, Romanian Orthodox, Coptic Orthodox, and others. Most parishes maintain men's groups with variable programming."}, {"name": "Easton Mountain", "url": "https://www.eastonmountain.org/", "category": "curriculum-retreat", "tradition": "interfaith", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-NY"], "description": "Retreat centre and intentional community for gay, bisexual, queer, and questioning men, located on 175 acres in Greenwich, NY (upstate). Founded 2001. Hosts dozens of weekend and week-long retreats annually \u2014 including the long-running Body Electric workshops, naked yoga and meditation retreats, contemplative-Christian gay men's retreats, sober-recovery weekends, and creative arts intensives. Interfaith and inclusive of secular participants. Fee-based with sliding-scale options on selected programmes."}, {"name": "Edgewood Treatment Centre", "url": "https://www.edgewoodhealthnetwork.com", "category": "therapy-clinical", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "yes", "regions": ["ca-BC"], "description": "Major Canadian residential addiction-treatment centre in Nanaimo, BC, founded in 1994 \u2014 flagship facility of the Edgewood Health Network. 12-step rooted, abstinence-based, with mixed-gender residential programs plus separate men's-track programming. Insurance-funded for many participants; private-pay also."}, {"name": "Evangelical Lutheran Church in Canada (ELCIC) Men", "url": "https://elcic.ca", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["canada-nationwide"], "description": "Men's network of the Evangelical Lutheran Church in Canada (ELCIC), the largest mainline Lutheran denomination in Canada. Canadian counterpart to the US-based [[Lutheran Men in Mission]] (ELCA). Local men's groups at member ELCIC congregations run study, retreats, and service projects."}, {"name": "Esalen Institute", "url": "https://www.esalen.org", "category": "therapy-clinical", "tradition": "secular", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-CA"], "description": "Big Sur, CA retreat center founded in 1962, considered the birthplace of the human-potential movement. Hosts hundreds of week-long and weekend workshops year-round on topics including emotional integration, somatic work, gestalt therapy, and personal-growth practice. Mixed-gender by default, with periodic men's-only retreats and workshops. Costs are significant but include lodging at the Big Sur property."}, {"name": "Evryman", "url": "https://www.evryman.com", "category": "curriculum-retreat", "tradition": "secular", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide", "online"], "description": "National community of men's groups built around emotional fluency, vulnerability, and peer support. Runs weekly virtual and in-person groups, multi-day retreats, and an online member community. Free intro events lead into paid ongoing groups; intake is straightforward."}, {"name": "F3 Canada", "url": "https://f3nation.com", "category": "outdoor-fitness", "tradition": "interfaith", "cost": "free", "intake": "open", "crisis_safe": "no", "regions": ["canada-nationwide"], "description": "Canadian chapters and AOs (areas of operation) of [[F3 Nation]] \u2014 the free, peer-led men's outdoor workout brotherhood. Active in Toronto, Vancouver, Calgary, Ottawa, and other Canadian cities. Same format as US F3: dawn workouts, peer-led, free, three Fs (Fitness, Fellowship, Faith). The third F is framed broadly enough to include any belief in something larger than self; Canadian secular culture often interprets it lightly."}, {"name": "F3 Nation", "url": "https://f3nation.com", "category": "outdoor-fitness", "tradition": "interfaith", "cost": "free", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "National network of free, peer-led men's outdoor workouts held before dawn \u2014 five days a week in most cities. Founded 2011 in Charlotte, NC; now operates thousands of \"AOs\" (areas of operation) across all 50 states. The three Fs are Fitness, Fellowship, and Faith \u2014 the third is framed broadly enough to include any belief in something larger than self, and the workouts themselves carry no overt religious content."}, {"name": "Faithful & True Ministries", "url": "https://www.faithfulandtrue.com", "category": "therapy-clinical", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Christian sexual integrity ministry founded by Dr. Mark Laaser (1950\u20132019), based in Eden Prairie, MN. Programs include intensive workshops for men and couples dealing with sexual addiction and intimacy disorders, plus small-group materials for use in churches. Mark Laaser's *Healing the Wounds of Sexual Addiction* was a foundational text in the Christian sexual-integrity space."}, {"name": "Father a Nation", "url": "https://fatheranation.co.za", "category": "faith-community", "tradition": "christian", "cost": "free", "intake": "open", "crisis_safe": "no", "regions": ["south-africa-nationwide"], "description": "South African Christian men's-discipleship and fatherhood organisation running QUEST \u2014 a multi-week men's group process focused on identity, fatherhood, and healing father-wounds \u2014 through churches, communities, and prisons across South Africa. Founded 2010. Free participation; QUEST is delivered in church, community, and correctional-facility settings nationwide. Christian framing throughout."}, {"name": "Father & Child Trust", "url": "https://fatherandchild.org.nz", "category": "fatherhood", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "no", "regions": ["new-zealand-nationwide", "online"], "description": "NZ charity supporting fathers and father-figures across the spectrum \u2014 new dads, separated dads, dads with young children, dads facing care-and-protection issues. Operates regional offices (Christchurch flagship, plus Auckland and others) running peer support groups, parenting courses, and one-to-one casework. Free or low-cost. Distinctively engages with separated-fathers' family-court experience as part of its scope."}, {"name": "Fellowship of Evangelical Baptist Churches in Canada (FEBCC)", "url": "https://www.fellowship.ca", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["canada-nationwide"], "description": "Conservative evangelical Canadian Baptist body, the second-largest Canadian Baptist denomination after the [[Canadian Baptist Ministries]] mainline-evangelical umbrella. Approximately 500 member churches across Canada. Local men's ministries at member congregations within an explicit conservative-evangelical theological frame \u2014 stronger emphasis on biblical authority and traditional doctrine than the broader CBM tradition."}, {"name": "Federation of Jewish Men's Clubs", "url": "https://fjmc.org/", "category": "faith-community", "tradition": "jewish", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "Brotherhood organization affiliated with Conservative Jewish synagogues across the US, founded in 1929. Local clubs at member synagogues run social events, men's-focused study, charitable activities, and signature programs like \"Hearing Men's Voices\" on emotional vulnerability and mental health. The Conservative-movement parallel to [[Men of Reform Judaism]]."}, {"name": "Friends General Conference Quaker Men", "url": "https://www.fgcquaker.org", "category": "faith-community", "tradition": "christian", "cost": "free", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "Friends General Conference (FGC), the largest unprogrammed-tradition (silent worship) branch of Quakerism in the US. Yearly Meetings under FGC umbrella include Philadelphia, NY, Baltimore, New England, Lake Erie, Northern, Ohio Valley, Southeastern, and others. Men's-specific gathering varies \u2014 some yearly meetings have men's working groups, men's-of-color groups, and dedicated men's retreats; the broader pattern is mixed-gender silent worship with informal men's connection."}, {"name": "First Nations Health Authority (FNHA, BC)", "url": "https://www.fnha.ca", "category": "drop-in", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["ca-BC"], "description": "First Nations Health Authority of British Columbia, the first province-wide First Nations-governed health authority in Canada, established in 2013. Delivers health services and wellness programming to First Nations communities across BC. Men's-specific programming runs through community-level partnerships including men's-wellness initiatives at urban Friendship Centres and rural First Nations health stations."}, {"name": "Fraternal Order of Eagles (FOE)", "url": "https://foe.com/", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Fraternal organization founded in 1898 in Seattle, WA, with aeries (local lodges) across the US and Canada. Notable for civic-charitable work including driving the establishment of Mother's Day (1908) and significant medical-research charity (Diabetes, Children's Heart). Now formally co-ed (since 1981); many aeries remain male-majority. Lodge-and-canteen culture similar to [[BPOE Elks]] and [[Loyal Order of Moose]]."}, {"name": "Freemasonry (US Grand Lodges)", "url": "https://besomethingmore.org", "category": "civic-fraternal", "tradition": "interfaith", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Fraternal order operating through state-level Grand Lodges with thousands of local lodges across the US. Lodges meet monthly for ritual, fellowship, and charitable work. Membership requires petitioning a local lodge, vouching by current members, and a unanimous ballot \u2014 a slow but real door to a long-running brotherhood. Prince Hall Masonry, with origins in Black American masonic history, operates parallel Grand Lodges in most states and warrants a separate entry."}, {"name": "National FFA Organization (Future Farmers of America)", "url": "https://www.ffa.org", "category": "rites-boys", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "National agricultural-education organization for middle and high school students, founded in 1928. Operates through agricultural-education programs in approximately 8,800 US schools with ~700,000 members. Programs combine classroom agricultural education, hands-on Supervised Agricultural Experience (SAE) projects, and leadership development through FFA's organizational structure (chapter / state / national levels with annual conventions)."}, {"name": "Gamblers Anonymous", "url": "https://gamblersanonymous.org/", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["us-nationwide", "online"], "description": "12-step fellowship for recovery from compulsive gambling, founded in 1957. Meetings happen in most US cities plus online; free, anonymous, peer-led. Same low-barrier structure as [[Alcoholics Anonymous]] applied to gambling \u2014 a foundational door for any man in active crisis around gambling losses, sports betting, online wagering, or stock-market compulsion."}, {"name": "Gay Spirit Visions", "url": "https://gayspirit.org", "category": "curriculum-retreat", "tradition": "interfaith", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-GA", "us-multiple"], "description": "Long-running gay-men's spiritual community, founded 1989 in Atlanta, GA. Hosts twice-yearly multi-day spiritual retreats / conferences (\"Fall Conference\" and \"Winter Conference\") at The Mountain Retreat Center in Highlands, NC, plus regional men's circles, monthly Atlanta gatherings, and a network of GSV-affiliated chapters. Interfaith and inclusive \u2014 Christian, Jewish, Buddhist, Pagan, secular, and other gay men gather for shared spiritual exploration. Fee-based with scholarship options."}, {"name": "GMHC (Gay Men's Health Crisis)", "url": "https://gmhc.org/", "category": "therapy-clinical", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["us-NY", "online"], "description": "The world's first and largest HIV/AIDS-services organisation, founded in New York City in January 1982 by Larry Kramer, Paul Popham, Larry Mass, Paul Rapoport, Nathan Fain, and Edmund White \u2014 at the very beginning of the AIDS epidemic and decades before the disease had a name. Today GMHC delivers comprehensive HIV-prevention, HIV-positive case management, mental health counselling, substance-use counselling, hot-meal programmes, legal services, and support groups (including ongoing men's groups for HIV-positive long-term survivors, newly-diagnosed men, gay-men in recovery, and others) at its Times Square clinical centre and online. Free for clients."}, {"name": "GORUCK", "url": "https://www.goruck.com/pages/goruck-events", "category": "outdoor-fitness", "tradition": "secular", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Endurance/ruck-march event company and brotherhood, founded in 2008 by former Special Forces operator Jason McCarthy. Hosts overnight endurance events (\"Tough,\" \"Heavy,\" \"Selection,\" \"Sandlot\") in cities across the US year-round, led by current/former military cadre, that build small-group cohesion through shared physical hardship. The company sells gear, but the durable men's-gathering function is the events plus active local Facebook groups, training meetups, and continuing post-event teams."}, {"name": "Hazelden Betty Ford Foundation", "url": "https://www.hazeldenbettyford.org", "category": "therapy-clinical", "tradition": "12-step", "cost": "fee", "intake": "vetted", "crisis_safe": "yes", "regions": ["us-multiple"], "description": "Major nonprofit addiction-treatment system formed by the 2014 merger of Hazelden Foundation (founded 1949 in Center City, MN) and the Betty Ford Center (founded 1982 in Rancho Mirage, CA). Operates residential and outpatient treatment, sober-living programs, family programs, and Hazelden Publishing. Best known for popularizing the \"Minnesota Model\" of 12-step-based addiction treatment."}, {"name": "The Healing Foundation", "url": "https://healingfoundation.org.au", "category": "drop-in", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "no", "regions": ["australia-nationwide", "online"], "description": "Australian national Aboriginal- and Torres-Strait-Islander-led organisation focused on intergenerational trauma healing for Stolen Generations survivors and their descendants. Founded 2009 in response to the Australian Government's National Apology (2008). Headquartered in Canberra. Operates the **Aboriginal and Torres Strait Islander Healing Forum**, the **Men's Healing programme** (which supports Aboriginal men's healing yarning circles and on-country healing camps across Australia), and policy / research / advocacy work. Free participation in member-organisation programming; the Healing Foundation itself is a coordination body funded by Australian government grants and philanthropy."}, {"name": "Help for Heroes", "url": "https://www.helpforheroes.org.uk", "category": "civic-fraternal", "tradition": "secular", "cost": "free", "intake": "vetted", "crisis_safe": "yes", "regions": ["uk-nationwide"], "description": "UK wounded-veterans charity founded in 2007 by Bryn and Emma Parry in response to the Iraq/Afghanistan conflicts. Operates Recovery Centres (Tedworth House, Phoenix House, Plas Y Brenin) plus regional support, sports rehabilitation programs, and family support. Free for UK veterans and their families. Distinguished from older [[Royal British Legion]] (1921 fraternal/welfare) by its specific post-2003 wounded-veterans focus."}, {"name": "Heroin Anonymous (HA)", "url": "https://heroinanonymous.org", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["us-nationwide", "online"], "description": "12-step fellowship for recovery from heroin and other opioid addiction, founded in 2004 in Phoenix, AZ. Meetings happen in-person and online, free, anonymous, peer-led. Smaller and newer than [[Alcoholics Anonymous]] but with full 12-step structure adapted for opioid recovery. Has grown significantly with the opioid crisis."}, {"name": "Holy Name Society", "url": "https://en.wikipedia.org/wiki/Holy_Name_Society", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "Catholic men's confraternity rooted in devotion to the Holy Name of Jesus, with a presence in many US Catholic parishes. Members typically attend a monthly Mass together, gather afterward for breakfast or fellowship, and run parish service projects. National-level coordination is loose \u2014 the National Association of the Holy Name Society (NAHNS) federates participating diocesan unions, but most activity is parish-level. Active most strongly in dioceses with substantial Italian, Irish, and Polish Catholic heritage."}, {"name": "Holy Trinity Church Dubai Men's Fellowship", "url": "https://holytrinitychurchdubai.org", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["united-arab-emirates-nationwide"], "description": "Men's-fellowship network of Holy Trinity Church Dubai, the central Anglican / interdenominational Christian church compound in Dubai, founded 1970 (worshipping in the present Jebel Ali / Oud Metha compound since 1983). Holy Trinity hosts more than 100 different congregations across multiple language and denominational expressions (English Anglican, Mar Thoma, Indian Pentecostal, etc.); the men's-fellowship operates primarily through the English-language Anglican congregation with multi-language overflow."}, {"name": "Homeboy Industries", "url": "https://homeboyindustries.org", "category": "reentry", "tradition": "christian", "cost": "free", "intake": "vetted", "crisis_safe": "yes", "regions": ["us-CA"], "description": "Los Angeles-based gang-intervention and reentry program founded in 1988 by Father Gregory Boyle, S.J. The program serves formerly-incarcerated and gang-involved men and women through 18-month paid trainee positions in social-enterprise businesses (Homeboy Bakery, Cafe, Silkscreen, etc.), tattoo removal, mental-health services, education, and a deeply embedded culture of \"kinship.\" Free for participants. Largest gang-intervention and rehabilitation program in the US."}, {"name": "Hsi Lai Temple / Fo Guang Shan", "url": "https://www.hsilai.us/", "category": "faith-community", "tradition": "buddhist", "cost": "free", "intake": "open", "crisis_safe": "unknown", "regions": ["us-CA", "us-multiple"], "description": "Hsi Lai Temple in Hacienda Heights, CA (opened 1988) is the US flagship of the Taiwan-rooted Fo Guang Shan Mahayana Buddhist order \u2014 among the largest Chinese Buddhist temples in the Western hemisphere. The order operates additional US temples in Houston, NYC, Las Vegas, Hawaii, and elsewhere. Men's-specific gathering happens through the Buddha's Light International Association (BLIA) men's chapters and through temple-based study groups, ceremonies, and seva."}, {"name": "I Am A Kind Man / Kizhaay Anishinaabe Niin", "url": "https://iamakindman.ca/", "category": "drop-in", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["ca-ON"], "description": "Indigenous men's program of the Ontario Federation of Indigenous Friendship Centres, focused on engaging Indigenous men in addressing and ending violence against women. Programming includes men's circles, traditional teachings, and community-based workshops grounded in Anishinaabe cultural practice. The Ojibwe phrase \"Kizhaay Anishinaabe Niin\" means \"I am a kind man.\" Free for participants."}, {"name": "Illuman", "url": "https://www.illuman.org/", "category": "rites-boys", "tradition": "interfaith", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide", "online"], "description": "Adult men's rites of passage organization founded in 2010, carrying forward the legacy of Franciscan priest Richard Rohr's \"M.A.L.Es\" (Men As Learners and Elders) community. Hosts Rohr-influenced rites of passage weekends and ongoing local \"Illumination Communities\" focused on contemplative spirituality, ego/shadow work, and elder-mentor relationships. Although Rohr's roots are Franciscan Catholic, Illuman is explicitly interfaith and welcomes men of any tradition or none."}, {"name": "Inclusive Therapists", "url": "https://www.inclusivetherapists.com", "category": "therapy-clinical", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide", "online"], "description": "Find-a-therapist directory focused on culturally-responsive and identity-affirming therapy across the US, with strong representation of BIPOC, LGBTQ+, and neurodivergent clinicians. Listings can be filtered by clinician identity, specialty, modality, and group format. Not men's-specific, but addresses an access gap that [[Psychology Today Therapist Directory]] doesn't always solve well: a man searching for a therapist who shares or understands his cultural context."}, {"name": "Independent Order of Odd Fellows (IOOF)", "url": "https://odd-fellows.org/", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Fraternal order founded in Baltimore in 1819 (US branch from the British Manchester Unity), historically the second-largest US fraternal after Freemasonry. Operates lodges across the US \u2014 diminished from its 19th-century peak but still active. Symbol is the three-link chain (\"Friendship, Love, Truth\"). Co-ed since 1971 (Rebekahs, the women's branch, dates to 1851). Membership requires belief in a Supreme Being."}, {"name": "Inside Circle", "url": "https://insidecircle.org", "category": "reentry", "tradition": "secular", "cost": "free", "intake": "vetted", "crisis_safe": "yes", "regions": ["us-nationwide"], "description": "California-rooted program running intensive men's-work circles inside US prisons, founded in 1996 by James McLeary. Outside facilitators trained in modern men's-work (mythopoetic, embodied, accountability-focused) lead weekly circles with incarcerated men \u2014 most prominently at Folsom State Prison, which was the subject of the 2017 documentary *The Work*. The program runs intentional emotional-development work for men serving long sentences, often for violent offenses, alongside skill-building for the outside men who facilitate."}, {"name": "Inside Out Dad", "url": "https://store.fatherhood.org/insideout-dad-3rd-edition-facilitators-kit/", "category": "reentry", "tradition": "secular", "cost": "free", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Group-based fatherhood curriculum delivered to incarcerated dads inside US correctional facilities. Operated through National Fatherhood Initiative; sessions are facilitated on-site by trained corrections staff or chaplains. Goal is to maintain father-child bond during incarceration and prepare dads for re-entry as engaged fathers."}, {"name": "Insight Meditation Society (IMS)", "url": "https://www.dharma.org", "category": "faith-community", "tradition": "buddhist", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-MA"], "description": "Vipassana / Insight Meditation retreat center in Barre, MA, founded in 1975 by Joseph Goldstein, Sharon Salzberg, and Jack Kornfield. The East Coast counterpart to [[Spirit Rock Meditation Center]]. Hosts mixed-gender retreats year-round (silent retreats from weekend to three-month length) including periodic men's-specific weekend retreats. Mostly fee-based with sliding-scale and dana options."}, {"name": "Iraq and Afghanistan Veterans of America (IAVA)", "url": "https://iava.org", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "yes", "regions": ["us-nationwide", "online"], "description": "Non-profit veterans organization for post-9/11 era veterans, founded in 2004. Combines advocacy work (notably on the Forever GI Bill and veteran-suicide prevention) with online and in-person community programs. Distinct from older VSOs ([[Veterans of Foreign Wars]], [[The American Legion]], [[AMVETS]]) by its generational focus and digital-first community structure."}, {"name": "Iron Sharpens Iron Conferences", "url": "https://ironsharpensiron.net/", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Network of one-day regional Christian men's conferences across the US, with workshops on marriage, fatherhood, work, and faith. The conferences are the front door \u2014 local follow-up depends on the host church. Built for men already inside Protestant Christian orbit; not a low-barrier door for the religiously unaffiliated."}, {"name": "ISKCON (Hare Krishna)", "url": "https://iskcon.org/", "category": "faith-community", "tradition": "hindu", "cost": "free", "intake": "open", "crisis_safe": "unknown", "regions": ["us-multiple"], "description": "International Society for Krishna Consciousness, a Vaishnava Hindu movement founded in 1966 in New York City by A.C. Bhaktivedanta Swami Prabhupada. US temples in major metros (NYC, LA, Chicago, Dallas, Atlanta, Detroit, San Diego, plus farm communities in WV \u2014 New Vrindaban \u2014 and NC). Men's-specific gathering happens through sankirtan (devotional chanting), kirtan parties, and seva (devotional service) at temples."}, {"name": "Islamic Society of North America (ISNA)", "url": "https://isna.net/", "category": "faith-community", "tradition": "muslim", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "Largest Muslim umbrella organization in North America, founded in 1981. ISNA's annual convention (typically Labor Day weekend) draws tens of thousands of attendees with extensive men's-specific programming. ISNA's website serves as a meta-locator for affiliated mosques and Islamic centers across the US, where the actual men's gatherings (daily prayer, Friday Jumu'ah, halaqas / study circles) take place."}, {"name": "Junior Chamber International USA (JCI USA)", "url": "https://www.jciusa.org", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "US affiliate of Junior Chamber International, a global service organization for young business leaders ages 18\u201340. Originally founded in 1915 in St. Louis as the \"Junior Citizens\" and later \"Jaycees.\" Local chapters across the US run civic projects, leadership-training programs, and networking events. Co-ed since the 1980s."}, {"name": "John Howard Society of Canada", "url": "https://johnhoward.ca", "category": "reentry", "tradition": "secular", "cost": "free", "intake": "vetted", "crisis_safe": "yes", "regions": ["canada-nationwide"], "description": "Federal-provincial network of community-based reentry and criminal-justice-reform organizations in Canada, with the original society founded in 1867 in Toronto. Provincial John Howard Societies operate independently with local programs in residential reentry, employment support, advocacy, and post-release mentorship. Funded primarily through provincial government contracts plus some donor support."}, {"name": "Kingdom Men (Tony Evans / Urban Alternative)", "url": "https://tonyevans.org/kingdom-men", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide", "online"], "description": "Christian men's ministry program of Pastor Tony Evans's Urban Alternative platform, based in Dallas. Operates the \"Kingdom Man\" curriculum \u2014 book, sermon series, and small-group materials \u2014 for men's discipleship in evangelical churches. Particularly strong reach in Black evangelical Protestant communities. Distinguished from broader Authentic Manhood / Promise Keepers descendants by Evans's specific Black-evangelical voice and Dallas-based platform."}, {"name": "Kiwanis International", "url": "https://www.kiwanis.org", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "International civic service organization founded in 1915 in Detroit. Operates clubs across the US, Canada, and worldwide focused on community service especially for children. Programs include Key Club (high school) and Builders Club (middle school) youth-development partnerships. Co-ed since 1987; many local clubs remain male-majority. Smaller absolute footprint than [[Lions Clubs International]] or [[Rotary International]] but distinctive youth-focused civic orientation."}, {"name": "Knights of Columbus Canada", "url": "https://www.kofc.org", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "unknown", "regions": ["canada-nationwide"], "description": "Canadian membership of the [[Knights of Columbus]] \u2014 among the largest national jurisdictions of KofC outside the US, with approximately 250,000 Canadian members and 1,700 councils. KofC arrived in Canada in 1897 (Montreal); subsequent Canadian growth was strongest in Quebec (where it is known as \"Chevaliers de Colomb\") and in Ontario, Atlantic Canada, and the Prairie provinces. Members are practicing Catholic men."}, {"name": "Knights of Columbus", "url": "https://www.kofc.org", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "Catholic fraternal order with thousands of local councils across the US providing fellowship, charitable work, and faith formation for Catholic men 18 and over. Membership requires being a practicing Catholic man; council activity is typically monthly with charitable and family-focused programming. Long-running and accessible to its target population \u2014 not a low-barrier door for non-Catholics."}, {"name": "Knights of Da Gama", "url": "https://knightsofdagama.org", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["south-africa-nationwide"], "description": "South African Catholic lay men's fraternal order, founded 1923 to support Catholic men in faith, family, and public life. Named after the Portuguese explorer Vasco da Gama, who is associated with Catholic mission in southern Africa. Operates councils across South Africa with monthly meetings, supporting Catholic charitable, social-justice, and faith-formation activities. Membership requires being a practising Catholic man."}, {"name": "Knights of Lithuania", "url": "https://www.knightsoflithuania.com", "category": "civic-fraternal", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "unknown", "regions": ["us-multiple"], "description": "Lithuanian-American Catholic fraternal organization founded in 1913. Membership open to Catholics of Lithuanian descent. Operates councils across the US in cities with substantial Lithuanian-American Catholic populations \u2014 Chicago (largest US Lithuanian community), Boston, NYC, Detroit, Philadelphia, Cleveland. Programs include Lithuanian cultural preservation, charitable work, and Catholic faith formation."}, {"name": "Knights of Peter Claver", "url": "https://www.kofpc.org", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "African-American Catholic fraternal order, founded in 1909 in Mobile, AL, named for Saint Peter Claver who ministered to enslaved Africans in Cartagena. Local councils across the US provide fellowship, charitable work, and faith formation for Black Catholic men. Functionally parallel to [[Knights of Columbus]] but historically founded because Black men were often excluded from KofC councils in the segregated South. Active in dioceses with significant Black Catholic populations (Louisiana, Texas, Mississippi, Alabama, Maryland, and urban centers)."}, {"name": "Knights of Pythias", "url": "https://www.pythias.org", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Fraternal order founded in 1864 in Washington, DC by Justus H. Rathbone, the first fraternal order chartered by Act of Congress. Operates lodges across the US \u2014 diminished from its 19th-century peak but still active. Motto is \"Friendship, Charity, Benevolence.\" Membership requires belief in a Supreme Being. The Pythian Sisters is a parallel organization. Smaller national footprint than [[Freemasonry]] or [[BPOE Elks]] today."}, {"name": "Knights of St Columba (Scotland)", "url": "https://www.knightsofstcolumba.org", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "unknown", "regions": ["gb-scotland"], "description": "Scottish Catholic fraternal order, founded in 1919 in Glasgow. Operates councils across Scotland providing fellowship, charitable work, and Catholic faith formation. Distinct from the Irish [[Knights of St Columbanus]] (1915 Belfast) and from the US/Canada [[Knights of Columbus]] / [[Knights of Columbus Canada]]."}, {"name": "Knights of St Columbanus", "url": "https://www.knightsofstcolumbanus.ie/", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "unknown", "regions": ["ireland-nationwide", "gb-northern-ireland"], "description": "Irish Catholic fraternal order, founded in 1915 in Belfast (now headquartered in Dublin). Approximately 3,000 members across the Republic of Ireland and Northern Ireland. Programs include charitable work, Catholic social teaching, and fellowship. The Irish counterpart to [[Knights of Columbus]] (US/Canada Catholic fraternal) \u2014 distinct organization with its own structure and history."}, {"name": "Knights of St. John (Catholic)", "url": "https://www.kofsj.org", "category": "civic-fraternal", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "unknown", "regions": ["us-multiple"], "description": "Catholic men's fraternal organization with military-uniform regalia, founded in 1879 by German-American immigrants. Operates commanderies across the US in cities with historical German Catholic populations. Programs include charitable work, ceremonial honor-guard service at Catholic events, and Catholic faith formation. Smaller in absolute size than [[Knights of Columbus]] but distinctive for its military-style structure and regalia."}, {"name": "Knights of the Southern Cross", "url": "https://kscaustralia.org.au", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["australia-nationwide"], "description": "Australian Catholic lay men's fraternal order, founded in Melbourne in 1919 to support Catholic men in faith, family, and public life. Operates state-based provinces with local branches that meet typically monthly, supporting Catholic charitable, social-justice, and faith-formation activities. Membership requires being a practising Catholic man; intake involves application and vouching by existing members."}, {"name": "Last Door Recovery Society", "url": "https://lastdoor.org", "category": "therapy-clinical", "tradition": "12-step", "cost": "fee", "intake": "vetted", "crisis_safe": "yes", "regions": ["ca-BC"], "description": "British Columbia\u2013based men's residential recovery program founded in 1984, headquartered in New Westminster, BC. Provides long-term residential treatment (typically 90 days+), youth services, and post-residential community engagement. Twelve-step rooted with strong peer-driven culture. Free or low-cost for many participants through provincial funding."}, {"name": "LDS Elders Quorum (Local Ward)", "url": "https://www.churchofjesuschrist.org/maps", "category": "faith-community", "tradition": "christian", "cost": "free", "intake": "vetted", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "The men's organization within every ward (local congregation) of The Church of Jesus Christ of Latter-day Saints. Every adult male member who holds the Aaronic or Melchizedek priesthood is assigned to a quorum, which meets weekly during Sunday services. Quorums coordinate service projects, ministering visits to other members, and emotional and practical support for one another. Listed as a meta-entry pointing toward the meetinghouse finder; intake requires LDS membership and priesthood ordination."}, {"name": "Lifeline Aotearoa", "url": "https://www.lifeline.org.nz", "category": "therapy-clinical", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["new-zealand-nationwide", "online"], "description": "NZ 24/7 crisis-support and suicide-prevention service. Operates the 0800 543 354 phone line and free TXT 4357 service. Trained volunteer crisis supporters. Not men-only, but NZ male-suicide rates make this a primary crisis-line resource for the directory's primary user (the man with nowhere else to go). Distinct entity from [[Lifeline Australia]] though both descend from the original Sydney-1963 Lifeline movement."}, {"name": "Lifeline Australia", "url": "https://www.lifeline.org.au", "category": "therapy-clinical", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["australia-nationwide", "online"], "description": "National 24/7 crisis-support and suicide-prevention service founded in Sydney in 1963 \u2014 the original Lifeline movement, which has since spread internationally. Operates the 13 11 14 phone line and webchat, plus a network of crisis-support services. Trained volunteer crisis supporters take calls. Not men-only, but Australian male callers are over-represented relative to population; men's-specific resources and safe-message collateral are produced for male-suicide-prevention."}, {"name": "Lions Clubs International", "url": "https://www.lionsclubs.org/en", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "International civic service organization, founded in 1917 in Chicago by Melvin Jones. Operates roughly 46,000 clubs in over 200 countries with \"We Serve\" as its motto and a long-running emphasis on vision and sight work, hunger relief, and youth programs. Lions Clubs were male-only until 1987 and remain male-majority in many local clubs, particularly in smaller US cities. Membership is by nomination; meetings are typically biweekly or monthly."}, {"name": "Local Gurdwara Sangat (Sikh)", "url": "https://www.sikhcoalition.org", "category": "faith-community", "tradition": "sikh", "cost": "free", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "Local Sikh congregations (sangat) gather at gurdwaras across the US for daily and weekly worship, communal meals (langar), and service (seva). Men's-specific gathering happens through participation in seva at the gurdwara, daily prayer (Nitnem), and study circles. Listed as a meta-entry pointing toward gurdwara-finder resources; intake is welcoming to anyone respectfully entering the sangat (with head covered, shoes removed, no shoes inside the prayer hall)."}, {"name": "Loyal Order of Moose", "url": "https://www.mooseintl.org", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Fraternal organization founded in 1888 in Louisville, KY, with lodges across the US and Canada. Notable for Mooseheart (a child-welfare campus in Illinois that has cared for children of deceased Moose members since 1913) and Moosehaven (a senior community in Florida). Operates as Moose International with the Loyal Order of Moose for men, the Women of the Moose, and Moose Legion as a degree-based men's leadership tier. Lodge-and-canteen culture; among the more accessible major fraternal orders for working-class men."}, {"name": "Lutheran Church Canada (LCC) Men's Ministry", "url": "https://www.lutheranchurchcanada.ca", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["canada-nationwide"], "description": "Men's ministry of Lutheran Church\u2013Canada (LCC), the second-largest Canadian Lutheran body. Theologically affiliated with the Lutheran Church\u2014Missouri Synod (LCMS) tradition \u2014 more conservative than the [[ELCIC Men]] mainline parallel. Local men's programming at member LCC congregations."}, {"name": "Lutheran Hour Ministries / Int'l Lutheran Laymen's League", "url": "https://www.lhm.org", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide", "online"], "description": "Men's auxiliary of the Lutheran Church\u2014Missouri Synod (LCMS), the second-largest US Lutheran body, distinguished from the ELCA-affiliated [[Lutheran Men in Mission]] by its more theologically conservative stance. The Lutheran Laymen's League (founded 1917) produces \"The Lutheran Hour\" radio program (founded 1930) and supports congregational men's ministry in LCMS churches. Active in cities with substantial LCMS Lutheran populations (Upper Midwest, Texas, Missouri)."}, {"name": "Lutheran Men in Mission", "url": "https://www.lutheranmeninmission.org", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "Men's ministry of the Evangelical Lutheran Church in America (ELCA), with roots tracing back to early-20th-century Lutheran men's organizations. Local chapters at member ELCA congregations run breakfasts, study groups, service projects, and an annual gathering. Programs emphasize service-oriented faith formation and brotherhood across age groups within the local congregation."}, {"name": "Manitoba M\u00e9tis Federation Men's Programming", "url": "https://www.mmf.mb.ca", "category": "drop-in", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "unknown", "regions": ["ca-MB"], "description": "Men's-wellness programming through the Manitoba M\u00e9tis Federation (MMF), the political body representing M\u00e9tis citizens of Manitoba. Includes men's circles, fatherhood programs, and culturally-rooted wellness initiatives. The MMF is one of the largest Indigenous political bodies in Canada and runs distinctive M\u00e9tis-specific programming."}, {"name": "ManKind Project Australia (MKP Australia)", "url": "https://www.mankindproject.org.au/", "category": "drop-in", "tradition": "secular", "cost": "sliding", "intake": "open", "crisis_safe": "unknown", "regions": ["australia-nationwide"], "description": "Australian regional ManKind Project organisation, conducting New Warrior Training Adventure weekends and ongoing peer-led integration groups (I-Groups) across the major Australian metros (Sydney, Melbourne, Brisbane, Perth, Adelaide). Sliding-scale fee for the weekend; ongoing I-Group participation typically low-cost or free. Distinct cultural register from US, Canadian, and UK&I MKP organisations."}, {"name": "ManKind Project Canada", "url": "https://mankindproject.org", "category": "drop-in", "tradition": "secular", "cost": "sliding", "intake": "open", "crisis_safe": "unknown", "regions": ["canada-nationwide"], "description": "Canadian chapters of The ManKind Project International, the global men's-work organization that runs the New Warrior Training Adventure weekend and ongoing peer-led integration groups (I-Groups). Active chapters in Greater Toronto, Vancouver / Pacific, Ottawa, Montreal, and Calgary regions. Weekend trainings conducted in Canada at retreat properties; I-Groups meet weekly in member cities. Sliding-scale fees."}, {"name": "ManKind Project New Zealand", "url": "https://www.mkp.org.nz/", "category": "drop-in", "tradition": "secular", "cost": "sliding", "intake": "open", "crisis_safe": "unknown", "regions": ["new-zealand-nationwide"], "description": "NZ regional ManKind Project organisation, conducting New Warrior Training Adventure weekends and ongoing peer-led integration groups (I-Groups) across New Zealand. Sliding-scale fee for the weekend; ongoing I-Group participation typically low-cost or free. Distinct cultural register from US, Canadian, UK&I, and Australian MKP organisations."}, {"name": "ManKind Project UK & Ireland (MKP UK&I)", "url": "https://mankindprojectuki.org/", "category": "drop-in", "tradition": "secular", "cost": "sliding", "intake": "open", "crisis_safe": "unknown", "regions": ["uk-nationwide", "ireland-nationwide"], "description": "Regional ManKind Project organization covering the UK and Ireland, conducting New Warrior Training Adventure weekends and ongoing peer-led integration groups (I-Groups) across the British Isles. Distinct from [[ManKind Project USA]] (US) and [[ManKind Project Canada]] (Canada) by its UK/Ireland-specific cultural register. Sliding-scale fee for the weekend; ongoing I-Group participation typically low-cost or free."}, {"name": "ManKind Project USA", "url": "https://mkpusa.org/", "category": "drop-in", "tradition": "secular", "cost": "sliding", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "International men's organization that runs the New Warrior Training Adventure weekend, plus ongoing peer-led integration groups (I-Groups) that meet weekly across the US. Open to any man over 18 who is willing to do the work; entry is typically through the weekend training, after which men are invited into local I-Groups. Sliding scale exists for the weekend; ongoing group participation is generally low-cost or free."}, {"name": "Marijuana Anonymous (MA)", "url": "https://marijuana-anonymous.org", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["us-nationwide", "online"], "description": "12-step fellowship for recovery from cannabis dependence, founded in 1989 in California. Meetings happen in-person and online, free, anonymous, peer-led. Smaller fellowship than [[Alcoholics Anonymous]] but with established traditions and a complete 12-step program adapted for marijuana addiction."}, {"name": "Marine Corps League", "url": "https://www.mcleaguelibrary.org/", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "yes", "regions": ["us-nationwide"], "description": "Congressionally chartered fraternal organization for current and former United States Marines, FMF Corpsmen, and FMF Chaplains, founded in 1923. Operates roughly 1,000 detachments across the US providing fellowship, charitable work, and Marine-specific brotherhood that crosses generations. Among the strongest single-service-branch men's-gathering institutions."}, {"name": "MATES in Construction New Zealand", "url": "https://mates.net.nz", "category": "drop-in", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["new-zealand-nationwide"], "description": "NZ chapter of the [[MATES in Construction]] industry-specific suicide-prevention model \u2014 same design as the Australian original, deployed in NZ construction-industry workplaces. Founded 2019 in NZ. Operates on-site through trained Connector and ASIST volunteers (workmates), a 24/7 helpline, and case-management. Targets a sub-population of NZ men (tradies) with disproportionately high suicide rates."}, {"name": "MATES in Construction", "url": "https://mates.org.au", "category": "drop-in", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["australia-nationwide"], "description": "Industry-specific suicide-prevention and mental-health charity for construction, mining, and energy workers \u2014 sectors with disproportionately high male-suicide rates in Australia. Founded in 2008 in response to research showing construction workers were dying by suicide at roughly twice the rate of other Australian men. Operates on-site through trained Connector and ASIST volunteers (workmates), a 24/7 helpline (1300 642 111), and case-management. Also operates in New Zealand."}, {"name": "Men Against Violence and Abuse (MAVA)", "url": "https://mavaindia.org", "category": "drop-in", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "no", "regions": ["india-nationwide", "online"], "description": "Mumbai-based men's organisation, founded 1993 \u2014 the oldest Indian NGO working with men and boys on gender equality, healthy masculinity, and the prevention of gender-based violence. Programmes include Yuva Maitri (boys' / young men's gender-sensitisation workshops in colleges), the long-running *Purush Spandan* / *Yaariyan* publications, and adult-male peer-support groups. Free participation; movement-building model alongside direct programming."}, {"name": "MEN & Healing", "url": "https://menandhealing.ca/", "category": "therapy-clinical", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["ca-ON"], "description": "Toronto-based clinical men's therapy organization providing group and individual psychotherapy specifically for men. Co-founded by Tod Augusta-Scott and others; specializes in trauma processing, abuse-perpetration recovery (work with men who have caused harm), and relational work. Some peer-supportive group programming alongside clinician-led therapy."}, {"name": "Men of Reform Judaism", "url": "https://www.menrj.org", "category": "faith-community", "tradition": "jewish", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "National brotherhood organization affiliated with Reform Jewish synagogues across the US, founded in 1923 as the National Federation of Temple Brotherhoods and renamed in 2003. Local chapters meet at member synagogues for fellowship, men's-focused study, social events, and synagogue volunteering. Most accessible at synagogues with active Brotherhood programs; not all Reform congregations have one."}, {"name": "MenEngage Africa", "url": "https://menengageafrica.org", "category": "drop-in", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "no", "regions": ["south-africa-nationwide", "online"], "description": "Africa-regional hub of the global MenEngage Alliance \u2014 a network of organisations engaging men and boys in gender equality and the prevention of gender-based violence. Hosted by [[Sonke Gender Justice]] in South Africa. Convenes member organisations across roughly 20 African countries through symposia, training, advocacy, and joint campaigns. Continental in scope but South Africa-rooted operationally."}, {"name": "MenEngage Nigeria", "url": "https://menengage.org", "category": "drop-in", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "no", "regions": ["nigeria-nationwide", "online"], "description": "Nigeria country network of the global MenEngage Alliance \u2014 a coalition of organisations engaging men and boys in gender equality and the prevention of gender-based violence. Hosted regionally by [[MenEngage Africa]] (Sonke-secretariat). Convenes Nigerian member organisations through trainings, advocacy campaigns, and the One Man Can / Brothers For Life-style programming adapted to Nigerian contexts."}, {"name": "Canadian Conference of Mennonite Brethren Churches", "url": "https://mbchurches.ca", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["canada-nationwide"], "description": "Mennonite Brethren is a distinct Anabaptist denomination from [[Mennonite Church Canada Men]] (the broader Mennonite Church). More theologically conservative and evangelical in practice \u2014 closer to evangelical Protestant culture while maintaining Anabaptist peace-church identity. Strong concentration in BC, Manitoba, Ontario, and Saskatchewan with approximately 250 Canadian congregations."}, {"name": "Mennonite Church Canada Men", "url": "https://www.mennonitechurch.ca", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["canada-nationwide"], "description": "Men's network within Mennonite Church Canada, the largest Mennonite denomination in Canada. Strongest in Manitoba (Winkler, Steinbach, Winnipeg areas), Ontario, BC, Alberta, and Saskatchewan where Mennonite communities historically settled. Anabaptist tradition emphasizes pacifism, community discernment, and simple living."}, {"name": "Mennonite Men", "url": "https://mennonitemen.org", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["us-multiple"], "description": "Men's organization of Mennonite Church USA, the largest Mennonite denomination in the US. Programs include men's retreats, fundraising for global Mennonite mission work (especially partnering with farmers in developing countries through the JoinHands initiative), and local congregational men's groups. Anabaptist tradition emphasizes pacifism, community discernment, and simple living."}, {"name": "Men's Health Network", "url": "https://menshealthnetwork.org/", "category": "drop-in", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide", "online"], "description": "Washington DC-based nonprofit founded in 1992 focused on men's-health policy, advocacy, and awareness. Operates as a meta-organization connecting men's-health initiatives nationally \u2014 promotes Men's Health Month (June), Men's Health Week, and various awareness campaigns. Not a gathering itself but a connector and advocate."}, {"name": "Men's Sheds Ireland", "url": "https://menssheds.ie", "category": "drop-in", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "unknown", "regions": ["ireland-nationwide"], "description": "Irish federation of approximately 450 local \"Sheds\" \u2014 community workshops where men gather to make and build things, plus share tea, conversation, and informal support. Australian movement origin (early 2000s); Irish chapter founded 2011. Sheds are typically free or low-cost, operate weekly, and are particularly meaningful for older Irish men in retirement, isolation, or post-bereavement."}, {"name": "MensLine Australia", "url": "https://mensline.org.au", "category": "therapy-clinical", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["australia-nationwide", "online"], "description": "Free 24/7 telephone, video, and online counselling service for Australian men, funded by the Department of Social Services and delivered by On the Line. Operates the national 1300 78 99 78 hotline plus webchat and video sessions. Specialises in relationship breakdown, family and parenting issues, anger and emotional regulation, and crisis support including suicide. Delivered by professional counsellors."}, {"name": "MenzShed New Zealand", "url": "https://menzshed.org.nz", "category": "drop-in", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "unknown", "regions": ["new-zealand-nationwide"], "description": "National federation of approximately 120 local MenzSheds across New Zealand \u2014 community workshops where men gather to make and build things, plus share tea, conversation, and informal support. Australian movement origin (regional VIC, late 1990s); NZ federation formalised 2010. Sheds are typically free or low-cost, operate weekly, and are particularly meaningful for older men in retirement, isolation, or post-bereavement."}, {"name": "Methodist Church in Malaysia Men's Fellowship", "url": "https://methodistchurch.org.my", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["malaysia-nationwide"], "description": "Men's-fellowship network of the Methodist Church in Malaysia (MCM) \u2014 the largest Protestant denomination in Malaysia, founded as a Wesleyan mission in 1885. Operates through five Annual Conferences (Trinity / Chinese / Tamil / Sarawak Iban / Sabah Provisional) plus the Sengoi Mission. Men's-fellowship operates at congregation level, with per-Conference variation in language and organising register."}, {"name": "Methodist Church in Singapore Men's Ministry", "url": "https://www.methodist.org.sg/", "category": "faith-community", "tradition": "christian", "cost": "free", "intake": "open", "crisis_safe": "no", "regions": ["singapore-nationwide"], "description": "Men's-ministry network of the Methodist Church in Singapore (MCS) \u2014 one of the largest Christian denominations in Singapore (~50,000 members across 46 churches). Methodist men's groups operate at congregation level in English, Mandarin, and Tamil annual conferences. Activities include weekly Bible study, monthly fellowship meetings, men's retreats, and church-supported service work."}, {"name": "Methodist Church of Great Britain Men's", "url": "https://www.methodist.org.uk", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["uk-nationwide"], "description": "Men's network within the Methodist Church of Great Britain, the largest Methodist denomination in the UK (covering England, Scotland, Wales, the Channel Islands, the Isle of Man, and Gibraltar). Local men's groups operate at member circuits with study, retreats, and service projects."}, {"name": "Methodist Men's Fellowship Ghana", "url": "https://methodistchurch.org.gh", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["ghana-nationwide"], "description": "Men's-fellowship network of the Methodist Church Ghana, one of the largest Methodist national bodies in Africa (founded as a Wesleyan mission in 1835 in Cape Coast; autonomous Ghanaian conference since 1961). Operates parish-level fellowship structures across the Methodist Church Ghana's ~3,000+ congregations. Activities include weekly Bible study, monthly fellowship meetings, men's retreats, and the annual Methodist Men's Fellowship conference."}, {"name": "Modern Elder Academy", "url": "https://www.meawisdom.com/", "category": "curriculum-retreat", "tradition": "secular", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-multiple"], "description": "Mid-life and late-career personal development organization founded by Chip Conley in 2018, holding week-long retreats at properties in Baja California Sur, Mexico and Santa Fe, NM. Programs focus on the elder transition \u2014 finding purpose after primary career, mentoring younger people, and processing midlife reckoning. Mixed-gender cohorts; men's-specific cohorts are offered intermittently."}, {"name": "Movember Australia", "url": "https://au.mov
