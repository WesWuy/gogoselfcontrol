ember.com", "category": "curriculum-retreat", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "unknown", "regions": ["australia-nationwide", "online"], "description": "Australian chapter and global birthplace of the Movember Foundation \u2014 the November mustache-growing campaign that funds men's-health programs (prostate cancer, testicular cancer, men's mental health). Founded in Melbourne in 2003, Movember now operates across 20+ countries; the Australian chapter funds local research, programs, and partnerships including with [[Beyond Blue]], [[Mensline Australia]], and [[MATES in Construction]]. Year-round Mo Bro communities meet in major Australian cities, especially during November."}, {"name": "Movember Canada", "url": "https://ca.movember.com", "category": "curriculum-retreat", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "unknown", "regions": ["canada-nationwide", "online"], "description": "Canadian chapter of the global Movember Foundation, established in Canada in 2007. Funds men's-health programs including prostate cancer, testicular cancer, and men's mental-health initiatives \u2014 with Canadian-specific research-funding and community programming distinct from the US chapter (see [[Movember Foundation]]). Year-round Mo Bro communities meet in major Canadian cities, especially during November."}, {"name": "Movember Foundation", "url": "https://us.movember.com", "category": "curriculum-retreat", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide", "online"], "description": "Global men's health charity founded in 2003 in Melbourne, Australia, with substantial US presence. Best known for the November mustache-growing campaign that funds prostate cancer, testicular cancer, and men's mental health programs. Beyond the November campaign, Movember runs ongoing community programs and produces research focused on men's mental health and suicide prevention. Active \"Mo Bro\" community gatherings happen in major US cities, especially during November."}, {"name": "Movember New Zealand", "url": "https://nz.movember.com", "category": "curriculum-retreat", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "unknown", "regions": ["new-zealand-nationwide", "online"], "description": "NZ chapter of the global Movember Foundation. Funds men's-health programs in Aotearoa (prostate cancer, testicular cancer, men's mental health) including NZ-specific grants and partnerships with local mental-health and crisis services. Year-round Mo Bro communities meet in major NZ cities, especially during November."}, {"name": "Movember South Africa", "url": "https://za.movember.com", "category": "curriculum-retreat", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "unknown", "regions": ["south-africa-nationwide", "online"], "description": "South African chapter and campaign of the global Movember Foundation. Funds men's-health programs in South Africa (prostate cancer, testicular cancer, men's mental health) through partnerships with local health and mental-health organisations. Year-round Mo Bro communities meet in major South African cities, especially during November."}, {"name": "Movember UK", "url": "https://uk.movember.com", "category": "curriculum-retreat", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "unknown", "regions": ["uk-nationwide", "online"], "description": "UK chapter of the global Movember Foundation. Funds men's-health programs (prostate cancer, testicular cancer, men's mental health) including UK-specific grants and partnerships with [[CALM]], Andy's Man Club, and other UK men's-mental-health initiatives. Year-round Mo Bro communities meet in major UK cities, especially during November."}, {"name": "Muslim American Society (MAS)", "url": "https://www.masnet.org", "category": "faith-community", "tradition": "muslim", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "National Muslim grassroots organization founded in 1993, focused on Islamic education, youth development, and community service. Local MAS chapters and centers run men's halaqas (study circles), youth programs (MAS Youth), community service projects, and family events. More community-and-grassroots-oriented than [[ISNA Islamic Society of North America|ISNA]]'s umbrella structure."}, {"name": "Native American Fatherhood and Families Association (NAFFA)", "url": "https://www.nativeamericanfathers.org/", "category": "fatherhood", "tradition": "secular", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "National non-profit founded in 2002 by Dr. Albert Pooley (Hopi/Navajo), based in Mesa, AZ. Programs (most notably \"Fatherhood Is Sacred / Motherhood Is Sacred\") use Native American cultural teachings to support fathers and families. Curriculum-based group programs run in tribal communities, urban Indian centers, and partner agencies across the US."}, {"name": "Naqshbandi Sufi Order (Naqshbandi-Haqqani branch and others)", "url": "https://naqshbandi.org", "category": "faith-community", "tradition": "muslim", "cost": "free", "intake": "open", "crisis_safe": "no", "regions": ["us-multiple", "online"], "description": "Major global Sunni Sufi order tracing its silsila (chain of spiritual authority) back through Bahauddin Naqshband Bukhari (14th-century Bukhara) to the Prophet Muhammad. The Naqshbandi-Haqqani branch (under the late Sheikh Nazim al-Qubrusi al-Haqqani d. 2014, succeeded by Sheikh Mehmet Adil al-Haqqani) is the most-publicly-visible US-and-Western-active branch, with established centres including the Sufi Meditation Center (Naqshbandi-Haqqani Sufi Order of America, multiple US locations including Fenton MI HQ). Other Naqshbandi branches (Mujaddidi, Khalidi, Owaysi) are also globally present. Local circles meet for weekly dhikr (devotional remembrance), study of the order's literature (especially Sheikh Nazim's discourses for the Haqqani branch), and seasonal retreats (suhba). Free participation; donations welcome."}, {"name": "Narcotics Anonymous", "url": "https://na.org/", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["us-nationwide", "online"], "description": "Worldwide 12-step fellowship for recovery from drug addiction, founded in 1953 in California. Same low-barrier intake as [[Alcoholics Anonymous]] \u2014 meetings happen multiple times daily in most US cities; many groups host men-only formats. Free, anonymous, peer-led. The foundational drug-specific 12-step community alongside the substance-specific fellowships ([[Cocaine Anonymous]], [[Heroin Anonymous]], [[Crystal Meth Anonymous]], [[Marijuana Anonymous]])."}, {"name": "Naropa University", "url": "https://www.naropa.edu", "category": "therapy-clinical", "tradition": "buddhist", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-CO"], "description": "Contemplative liberal-arts university in Boulder, CO, founded in 1974 by Ch\u00f6gyam Trungpa Rinpoche. Offers degree programs in contemplative psychotherapy, somatic counseling, ecopsychology, and other contemplative-rooted disciplines, plus public weekend workshops and continuing-education programs. Not strictly men's-specific, but Naropa-trained therapists are common in the men's-work field, and the university periodically runs men's-specific programs."}, {"name": "National Association of Friendship Centres (NAFC)", "url": "https://nafc.ca", "category": "drop-in", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["canada-nationwide"], "description": "Umbrella organization for approximately 125 Indigenous Friendship Centres across Canada, providing urban-Indigenous community services in cities and towns nationally since 1972. Many Friendship Centres run men's-specific programming including [[I Am A Kind Man]] / Kizhaay Anishinaabe Niin in Ontario, fatherhood circles, traditional teachings, youth mentorship, and reentry support."}, {"name": "National Center for Fathering", "url": "https://fathers.com", "category": "fatherhood", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide", "online"], "description": "National fatherhood organization founded in 1990 by Ken Canfield, providing research, curriculum, and programs for fathers across the US. Notable programs include WatchDOGS (Dads of Great Students \u2014 fathers as school volunteers), Father of Influence courses, and the Quenching the Father-Thirst Bible-study curriculum. Christian-rooted but with secular school-based programming widely deployed."}, {"name": "National Eagle Scout Association (NESA)", "url": "https://www.nesa.org", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide", "online"], "description": "Alumni network for adult Eagle Scouts (the highest rank achievable in Scouts BSA, formerly Boy Scouts of America), with chapters across the US. Programs include scholarship support, mentorship of current Scouts, networking among Eagle Scout alumni in business and leadership, and service projects. NESA is one of the few US adult-male brotherhood structures explicitly built on a shared youth experience."}, {"name": "National Fatherhood Initiative", "url": "https://www.fatherhood.org", "category": "fatherhood", "tradition": "secular", "cost": "unknown", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "National non-profit providing fatherhood programs, curriculum (24/7 Dad, Inside Out Dad), and resources to organizations that serve dads \u2014 workplaces, faith communities, military, and corrections. Direct programs are typically delivered through partner organizations rather than NFI itself; the website locator helps a man find a local program."}, {"name": "National Wild Turkey Federation (NWTF)", "url": "https://www.nwtf.org", "category": "outdoor-fitness", "tradition": "secular", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Hunting and habitat-conservation nonprofit founded in 1973, focused on wild-turkey-habitat work and youth hunter development (the \"JAKES\" program). Operates chapters across the US with banquet-fundraiser fellowship networks similar to [[Ducks Unlimited]] and [[Rocky Mountain Elk Foundation]]."}, {"name": "Native Brotherhood of British Columbia", "url": "https://www.nbbc.ca", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "unknown", "regions": ["ca-BC"], "description": "Indigenous British Columbia organization founded in 1931 \u2014 among the oldest Indigenous men's organizations in Canada. Originally focused on Indigenous BC commercial-fishing rights and political organizing for First Nations communities; continues as an Indigenous men's organization with cultural, economic, and advocacy programming for BC First Nations."}, {"name": "Naval Sea Cadet Corps", "url": "https://www.seacadets.org", "category": "rites-boys", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Congressionally chartered nonprofit youth program for boys (and now girls) ages 13\u201317, sponsored by the Navy and the Navy League since 1962. Cadets train in seamanship, leadership, and military structure with adult mentors who are typically Navy or Coast Guard veterans. The adult-mentor structure is a meaningful men's-gathering layer alongside the cadet program."}, {"name": "National Baptist Convention USA Brotherhood", "url": "https://nationalbaptist.com/", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "Men's ministry of the National Baptist Convention USA, Inc. \u2014 the largest historically Black Baptist denomination in the United States, founded in 1895 (via consolidation of three older Black Baptist conventions). Local brotherhoods and laymen's organizations operate at member churches with annual congresses bringing together men from churches across the country. Active in major metropolitan areas with strong Black church communities (Atlanta, Memphis, Detroit, Chicago, Houston, Birmingham, etc.)."}, {"name": "New Orleans Mardi Gras Krewes", "url": "https://www.mardigrasneworleans.com", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-LA"], "description": "Distinctive New Orleans tradition of all-male fraternal organizations (\"krewes\") that gather year-round for charitable work, ritual meetings, and brotherhood, culminating in elaborate Mardi Gras parades and balls. The Mistick Krewe of Comus (founded 1856) is the oldest; Rex (1872), Proteus (1882), Hermes (1937), and others followed. Some krewes (Bacchus, founded 1968) are more inclusive and less secretive; the older \"old-line\" krewes maintain strong invitation-only intake. Listed because the krewe pattern is a real, durable men's-gathering form distinctive to New Orleans."}, {"name": "NOLS (National Outdoor Leadership School)", "url": "https://www.nols.edu", "category": "rites-boys", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-multiple"], "description": "Wilderness-leadership education organization founded in 1965 in Lander, WY by Paul Petzoldt. Offers courses ranging from 10 days to full semesters in mountain, river, ocean, and desert environments worldwide. NOLS courses are durable rites-of-passage experiences for participants \u2014 especially the longer \"semester\" programs (70\u201390 days) that build deep expedition cohort cohesion."}, {"name": "Notre Dame Alumni Association", "url": "https://alumni.nd.edu/", "category": "civic-fraternal", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "unknown", "regions": ["us-nationwide", "online"], "description": "Alumni association of the University of Notre Dame, with hundreds of \"ND Clubs\" across the US that organize men's-network gatherings, watch parties, charitable work, and Catholic-faith-rooted community events. Distinct among US college alumni networks for its explicit Catholic-cultural grounding and the durability of its men's-cohort traditions. Open to graduates of the University of Notre Dame; membership and access through the alumni association."}, {"name": "Onsite Workshops", "url": "https://experienceonsite.com/", "category": "therapy-clinical", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-TN"], "description": "Tennessee-based personal-development and emotional-recovery retreat property, founded in 1974 by Jim Greenfield. Hosts week-long residential workshops covering grief, codependency, family-of-origin patterns, and addiction recovery. Mixed-gender and men's-specific programs both offered. Located on a working ranch outside Nashville; programs combine clinical intensives, somatic work, and structured peer engagement."}, {"name": "Open Path Psychotherapy Collective", "url": "https://openpathcollective.org", "category": "therapy-clinical", "tradition": "secular", "cost": "sliding", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide", "online"], "description": "Non-profit therapy network providing access to licensed therapists at sliding-scale rates of $30\u201380 per session, founded 2013. Users pay a one-time lifetime membership fee (around $59 as of recent verification) and then book sessions directly with member therapists. Not men's-specific, but addresses the cost barrier that keeps many men out of group and individual therapy. Members can search the network for therapists who lead men's groups."}, {"name": "Operation Surf", "url": "https://operationsurf.org/", "category": "outdoor-fitness", "tradition": "secular", "cost": "free", "intake": "vetted", "crisis_safe": "yes", "regions": ["us-CA", "us-multiple"], "description": "Non-profit running week-long surf-therapy camps for combat-wounded veterans with PTSD and traumatic brain injury, founded in 2009 in Cayucos, CA. Camps combine ocean therapy, peer support, and brotherhood with veterans of similar service backgrounds. Volunteer-driven, free for veteran participants. The surfing element is therapeutic-recreation rooted; the men's-gathering element comes from the cohort dynamic of week-long immersive camps."}, {"name": "Optimist International", "url": "https://www.optimist.org", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "International civic service organization, founded in 1919 in Buffalo, NY, with a primary focus on youth development. Operates roughly 2,500 clubs across the US, Canada, Caribbean, and Mexico. Programs include oratorical contests, scholarship programs, and Junior Optimist youth groups. Now formally co-ed but male-majority in many smaller US clubs."}, {"name": "Order of Malta Ireland", "url": "https://orderofmaltaireland.org/", "category": "civic-fraternal", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "yes", "regions": ["ireland-nationwide"], "description": "Irish Association of the Sovereign Military Order of Malta, the Catholic chivalric order founded in the 11th century. The Order of Malta Ireland operates volunteer ambulance and first-aid services (the Order of Malta Ambulance Corps), Malta International Camp youth programming, and men's chivalric fellowship within the broader Catholic Order. Members include both lay associates (Order of Malta Volunteers) and \"professed\" Knights of Malta."}, {"name": "Order of Man", "url": "https://orderofman.com/", "category": "curriculum-retreat", "tradition": "secular", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide", "online"], "description": "Modern men's-development brand and community founded by Ryan Michler around 2015. Centers on the \"Order of Man\" podcast (interviews with men about character, work, and family), the \"Iron Council\" paid membership community, occasional in-person Brotherhood Retreats, and a book/curriculum (notably *Sovereignty*). Audience skews entrepreneurial, fitness-oriented, and politically right-of-center."}, {"name": "Order of Saint Andrew the Apostle (Archons of the Ecumenical Patriarchate)", "url": "https://archons.org", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "US lay men's order honouring distinguished Greek Orthodox Christian laymen with the historic Byzantine title of Archon (\"ruler\" / \"leader\"). Each Archon is personally invested by the Ecumenical Patriarch (Bartholomew, since 1991) at the recommendation of the Greek Orthodox Archdiocese of America. The Order organises around defending religious freedom worldwide \u2014 particularly the threatened position of the Ecumenical Patriarchate in Istanbul \u2014 and supporting the mission of the Greek Orthodox Archdiocese. Members meet locally and at the annual Archon Weekend conference; service / philanthropy / advocacy focus. Vetted intake (invitation only, by patriarchal appointment) and ongoing membership dues."}, {"name": "The Order of St. Ignatius of Antioch", "url": "https://orderofstignatius.org", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Lay men's-and-women's fellowship of the Antiochian Orthodox Christian Archdiocese of North America, founded 1975 by Metropolitan Philip Saliba. Members commit to ongoing prayer, regular giving, and active parish service; in return participate in the Order's national gatherings, charitable mission, and annual investitures. Co-ed but with substantial men's lay-fraternal continuity. Operates parish-level, archdiocesan-level, and national structures across Antiochian parishes in the US and Canada."}, {"name": "Order Sons of Italy of Canada", "url": "https://www.osicanada.com", "category": "civic-fraternal", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "unknown", "regions": ["canada-nationwide"], "description": "Italian-Canadian fraternal organization, the Canadian counterpart to the US-based [[Sons of Italy in America]]. Lodges concentrated in Ontario (Toronto, Hamilton, Niagara), Quebec (Montreal), and other regions with substantial Italian-Canadian populations. Programs include Italian cultural preservation, scholarships, and charitable work."}, {"name": "Orthodox Union (OU)", "url": "https://www.ou.org", "category": "faith-community", "tradition": "jewish", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "National umbrella organization of Modern Orthodox Jewish synagogues and institutions in the US, founded in 1898. While not a men's-specific organization, OU supports extensive Modern Orthodox men's-focused programming including the National Council of Young Israel (NCYI) men's networks, daily Daf Yomi study groups, and shul-based men's halaqas / shiurim. URL serves as a meta-locator for affiliated Modern Orthodox synagogues nationally."}, {"name": "Outward Bound Canada", "url": "https://www.outwardbound.ca", "category": "rites-boys", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["canada-nationwide"], "description": "Canadian affiliate of [[Outward Bound]] International, founded in 1969. Operates multi-day wilderness expeditions across Canada (Algonquin, Yukon, Atlantic Canada, BC) for youth and adults. Adult expeditions function as significant rites-of-passage experiences for many men. Co-ed by default; men's-only adult programs offered intermittently."}, {"name": "Outward Bound USA", "url": "https://www.outwardbound.org", "category": "rites-boys", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-multiple"], "description": "Wilderness experiential education organization in the US since 1962 (modeled after Kurt Hahn's UK-founded Outward Bound). Operates multi-week expeditions in mountain, river, sea, and desert environments for participants 14+ \u2014 also adult and family programs. Adult expeditions function as significant rites-of-passage experiences for many men. Co-ed by default; men's-only adult programs exist intermittently."}, {"name": "Overeaters Anonymous (OA)", "url": "https://oa.org", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["us-nationwide", "online"], "description": "12-step fellowship for recovery from compulsive eating, food restriction, and disordered eating patterns, founded in 1960 in Los Angeles. Meetings address food obsession, binge eating, weight obsession, restriction, and exercise compulsion. In-person and online meetings nationally. Free, anonymous, peer-led."}, {"name": "Pentecostal Assemblies of Canada (PAOC) Men's Ministry", "url": "https://paoc.org", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["canada-nationwide"], "description": "Men's ministry of the Pentecostal Assemblies of Canada (PAOC), the largest Pentecostal denomination in Canada with approximately 1,100 churches across all provinces and territories, founded in 1919. Men's programming at member churches includes study, retreats, and service projects within an explicit Pentecostal-evangelical theological frame."}, {"name": "Patriot Guard Riders", "url": "https://patriotguard.org/", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Veterans-led motorcycle organization founded in 2005, dedicated to honoring fallen US service members, veterans, and first responders by riding to funerals at family invitation. Membership open to anyone respectful of the mission \u2014 riders and non-riders welcome. Local chapters across the US."}, {"name": "Pheasants Forever / Quail Forever", "url": "https://www.pheasantsforever.org", "category": "outdoor-fitness", "tradition": "secular", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-multiple"], "description": "Upland-bird hunting and habitat-conservation nonprofit founded in 1982 (Pheasants Forever) with Quail Forever added in 2005. Strongest concentration in the Upper Midwest and Great Plains where pheasant and quail populations are most significant. Local chapters run banquet-fundraisers, habitat-restoration days, and youth mentor programs."}, {"name": "Pioneer Total Abstinence Association (PTAA)", "url": "https://www.pioneers.ie/", "category": "therapy-clinical", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["ireland-nationwide", "gb-northern-ireland"], "description": "Irish Catholic temperance and total-abstinence society founded in 1898 by Fr. James Cullen SJ. Members (\"Pioneers\") take a lifelong pledge of total abstinence from alcohol as a Catholic devotional practice. Distinctive Irish institution \u2014 historical membership in the hundreds of thousands; modern membership smaller but active."}, {"name": "Plum Village US Sangha (Thich Nhat Hanh tradition)", "url": "https://plumvillage.org", "category": "faith-community", "tradition": "buddhist", "cost": "free", "intake": "open", "crisis_safe": "no", "regions": ["us-multiple"], "description": "US sanghas in the Plum Village tradition of Vietnamese Zen master Thich Nhat Hanh (1926\u20132022). Two monastic centers operate in the US: Deer Park Monastery (Escondido, CA) and Magnolia Grove Monastery (Batesville, MS). Plus countless local lay sanghas across the US that practice the Plum Village tradition through weekly mindfulness gatherings. Mixed-gender; men's-specific gathering happens through participation."}, {"name": "Progressive National Baptist Convention Brotherhood", "url": "https://pnbc.org/", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "Men's ministry of the Progressive National Baptist Convention, Inc. (PNBC) \u2014 the Black Baptist denomination founded in 1961 by ministers who broke from the National Baptist Convention USA over the latter's hesitance to align with the civil-rights movement. PNBC was Martin Luther King Jr.'s eventual denominational home. The Brotherhood / Layman's Movement operates at member churches with annual congresses."}, {"name": "Polish Falcons of America", "url": "https://www.polishfalcons.org", "category": "civic-fraternal", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "unknown", "regions": ["us-multiple"], "description": "Polish-American fraternal benefit society founded in 1887 in Chicago, originally part of the Polish-Slavic \"Sok\u00f3\u0142\" (Falcon) gymnastics movement and dedicated to physical fitness, Polish cultural preservation, and Catholic faith. Active in the Pittsburgh, Chicago, Buffalo, Detroit, and Cleveland metros plus other US cities with substantial Polish-American Catholic populations. Local \"nests\" run gymnastics programs, scholarships, and fellowship gatherings."}, {"name": "Presbyterian Men (PCUSA)", "url": "https://pcusa.org/", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "Men's ministry of the Presbyterian Church (USA) \u2014 the largest mainline Presbyterian denomination in the US. Local Presbyterian Men chapters at member congregations run study groups, work projects, and an annual gathering. Smaller in absolute size than [[United Methodist Men]] or [[Knights of Columbus]] but represents the directory's coverage of mainline Reformed Protestant men's ministry."}, {"name": "Prison Fellowship", "url": "https://www.prisonfellowship.org", "category": "reentry", "tradition": "christian", "cost": "free", "intake": "vetted", "crisis_safe": "yes", "regions": ["us-nationwide"], "description": "Christian ministry serving currently and formerly incarcerated men and their families, founded in 1976 by Chuck Colson. Programs include in-prison Bible studies and life-skills classes (Prison Fellowship Academy), mentorship for men preparing for re-entry, Angel Tree (gifts for prisoners' children), and policy advocacy. Volunteer-heavy on the outside; access for incarcerated men is through facility chaplains."}, {"name": "Project Healing Waters Fly Fishing", "url": "https://projecthealingwaters.org/", "category": "outdoor-fitness", "tradition": "secular", "cost": "free", "intake": "vetted", "crisis_safe": "yes", "regions": ["us-nationwide"], "description": "National non-profit teaching fly fishing, fly tying, and rod building to active-duty military personnel and veterans with disabilities, founded in 2005. Programs at hundreds of US locations; participants typically join a local chapter for ongoing weekly meetings plus quarterly outings. Free for participants. Therapeutic-recreation framework \u2014 peer support and skill-building combine into a serious resource for veterans coping with PTSD, traumatic brain injury, and physical injuries."}, {"name": "Promise Keepers", "url": "https://promisekeepers.org", "category": "faith-community", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide", "online"], "description": "Evangelical Christian men's ministry calling men to a set of \"promises\" around faith, family, and integrity, originally known for stadium-scale gatherings in the 1990s. Relaunched with renewed event programming and digital community in recent years. Local follow-up is decentralized \u2014 the events are the front door, and ongoing brotherhood depends on the man's home church."}, {"name": "Psychology Today Therapist Directory", "url": "https://www.psychologytoday.com/us/therapists", "category": "therapy-clinical", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide", "online"], "description": "The most-used find-a-therapist directory in the US, with hundreds of thousands of clinician listings filterable by location, specialty, modality, and group format \u2014 including \"Men's Issues\" and \"Group Therapy\" filters. Most US therapists maintain a Psychology Today profile. Not men's-specific, but its scale and filter granularity make it the practical starting point for finding a clinician-led men's group in most US locations."}, {"name": "Pure Desire Ministries", "url": "https://puredesire.org", "category": "therapy-clinical", "tradition": "christian", "cost": "fee", "intake": "open", "crisis_safe": "yes", "regions": ["us-nationwide"], "description": "Christian sexual integrity ministry founded in 1986 by Ted Roberts. Operates \"Seven Pillars of Freedom\" workbook-based small groups in churches across the US, addressing pornography, sexual compulsion, and intimacy disorders within a Christian frame. Free for participants in church-hosted groups (some materials cost). Distinct from 12-step ([[Sex Addicts Anonymous]], [[Sex and Love Addicts Anonymous]], [[Sexaholics Anonymous]]) by its explicit Christian theological framework."}, {"name": "Radical Faeries", "url": "https://www.radfae.org/", "category": "curriculum-retreat", "tradition": "interfaith", "cost": "sliding", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide", "online"], "description": "Decentralised global movement of queer / gay men (and increasingly non-binary and trans participants) co-founded 1979 by Harry Hay, John Burnside, Don Kilhefner, and Mitch Walker. Operates through autonomous \"sanctuaries\" (intentional rural retreat communities) and gatherings. Major US sanctuaries include Short Mountain Sanctuary (TN), Wolf Creek Sanctuary (OR), Faerie Camp Destiny (VT), and others. Faeries gatherings and \"heart-circle\" practice are the core ritual forms; pagan / counter-cultural / Indigenous-respect-attempt frame throughout. Sliding-scale or donation-based."}, {"name": "RCCG Men's Fellowship", "url": "https://www.rccg.org/", "category": "faith-community", "tradition": "christian", "cost": "free", "intake": "open", "crisis_safe": "no", "regions": ["nigeria-nationwide", "online"], "description": "Men's ministry network of the Redeemed Christian Church of God (RCCG) \u2014 one of the largest Pentecostal denominations in the world, founded in Lagos in 1952. RCCG operates tens of thousands of parishes globally with the majority in Nigeria. Men's fellowship runs at parish level with weekly meetings; Holy Ghost Service (the monthly all-night Friday vigil at Redemption Camp) gathers hundreds of thousands of men and families. Free participation; charismatic-evangelical Pentecostal frame throughout."}, {"name": "RCMP Veterans' Association", "url": "https://rcmpva.org", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "yes", "regions": ["canada-nationwide"], "description": "Royal Canadian Mounted Police Veterans' Association, founded in 1924 for retired and former RCMP members and their families. Operates divisions across Canada providing fellowship, advocacy, charitable work, and connection to RCMP heritage. Many divisions run men's-gathering events alongside the broader association programming."}, {"name": "REBOOT Recovery", "url": "https://rebootrecovery.com/", "category": "drop-in", "tradition": "christian", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["us-nationwide", "online"], "description": "Faith-based trauma-recovery program for combat veterans, first responders, and their families, founded in 2011 by Dr. Evan and Jenny Owens. Twelve-week course-format groups meet at host churches and other community sites across the US, addressing PTSD, moral injury, and family trauma within a Christian frame. Free for participants; volunteer-led with trained facilitators."}, {"name": "Recovery Dharma", "url": "https://recoverydharma.org", "category": "drop-in", "tradition": "buddhist", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["us-nationwide", "online"], "description": "Peer-led, Buddhist-influenced recovery community for any addiction, founded in 2019 (forked from Refuge Recovery during organizational restructuring). Meetings use a Buddhist-rooted approach to recovery \u2014 mindfulness, the Four Noble Truths, and the Eightfold Path adapted for addiction. Free, peer-led, with both in-person and online groups. Most groups are mixed-gender; men-only meetings exist in larger metros."}, {"name": "Refuge Recovery", "url": "https://www.refugerecovery.org/", "category": "drop-in", "tradition": "buddhist", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["us-nationwide", "online"], "description": "Buddhist-influenced peer recovery community based on the work of Noah Levine and the 2014 book *Refuge Recovery*. Operates meetings across the US and online using a Four Noble Truths / Eightfold Path framework adapted for addiction. The original Buddhist-recovery organization from which [[Recovery Dharma]] forked in 2019 during a governance restructuring; both continue to operate independently with similar but distinct approaches."}, {"name": "Renascent Foundation", "url": "https://renascent.ca", "category": "therapy-clinical", "tradition": "12-step", "cost": "fee", "intake": "vetted", "crisis_safe": "yes", "regions": ["ca-ON"], "description": "Toronto-based addiction-treatment foundation operating residential treatment centres, day programs, and continuing care for substance-use issues since 1970. Includes a men-specific residential program at the Graham Munro Centre. 12-step rooted with strong abstinence-based clinical model. Insurance-funded for many participants; private-pay also."}, {"name": "R\u00e9seau Hommes Qu\u00e9bec (RHQ)", "url": "https://reseauhommesquebec.com", "category": "curriculum-retreat", "tradition": "secular", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["ca-QC"], "description": "French-language men's-circle network in Quebec, founded in 1992 with Jean Monbourquette and others as foundational influences. Operates ongoing local \"cercles d'hommes\" (men's circles) plus periodic weekend retreats and rites-of-passage events. Mythopoetic men's-work tradition adapted to Qu\u00e9b\u00e9cois culture and language. Distinct from English-Canada men's-work scenes (e.g., [[ManKind Project Canada]]) by its French-language operation and Quebec-specific cultural register."}, {"name": "Rocky Mountain Elk Foundation (RMEF)", "url": "https://www.rmef.org", "category": "outdoor-fitness", "tradition": "secular", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Hunting and habitat-conservation nonprofit founded in 1984 in Missoula, MT, with approximately 230,000 members and chapters across the US. Mission centers on elk habitat conservation, but the chapter banquets, mentor programs, and sportsmen's events function as significant men's-gathering sites in regions with substantial big-game hunting culture."}, {"name": "Rotary International", "url": "https://www.rotary.org/en", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "International civic service organization, founded in 1905 in Chicago by Paul Harris. Operates roughly 35,000 clubs worldwide focused on community service, professional networking, and large-scale charitable initiatives \u2014 most notably Rotary's polio-eradication partnership with the WHO. Co-ed since 1989 and increasingly so since, but remains male-majority in many US clubs, particularly outside major metros. Membership is typically by invitation; meetings are weekly with structured programming."}, {"name": "Round Table (Great Britain & Ireland)", "url": "https://www.roundtable.co.uk", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["uk-nationwide", "ireland-nationwide"], "description": "British and Irish men's social and service organization, founded in 1927 in Norwich. Membership is for men ages 18\u201345 \u2014 uniquely among major civic-service orgs in the directory, Round Table maintains explicit men-only membership at the working-age tier. After age 45 members \"graduate\" to the 41 Club (post-Round-Table fellowship). Operates Tables across the UK, Ireland, and former Commonwealth countries."}, {"name": "Royal Antediluvian Order of Buffaloes (RAOB)", "url": "https://www.raob-gle.org.uk", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["uk-nationwide"], "description": "UK fraternal organization founded in 1822 in London \u2014 sometimes called \"the working man's Freemasonry\" reflecting its historical accessibility to men outside the social tiers UGLE traditionally drew from. Operates lodges across the UK with charitable work, fellowship, and ritual structure. Several Grand Lodges exist (Grand Lodge of England being the largest; separate Grand Lodges for Australasia and elsewhere)."}, {"name": "Royal British Legion (RBL)", "url": "https://www.britishlegion.org.uk", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "yes", "regions": ["uk-nationwide"], "description": "UK's largest veterans' charity, founded in 1921 to support members and former members of HM Armed Forces. Operates approximately 2,500 branches across the UK plus international branches in countries with British veteran populations. Programs include welfare support, advocacy, the November Poppy Appeal, and branch fellowship. Members include veterans, currently-serving personnel, and \"associate\" members."}, {"name": "Royal Canadian Legion (RCL)", "url": "https://legion.ca", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "yes", "regions": ["canada-nationwide"], "description": "Largest Canadian veterans organization, founded in 1925 with approximately 250,000 members across about 1,400 branches in all 10 provinces and the territories. Open to veterans, currently-serving CAF members, and \"associate\" members (general public who support the mission). Programs include veteran-benefits advocacy, the November Remembrance Day poppy campaign, charitable work, youth programs, and branch fellowship. Most branches operate canteen/club spaces that double as informal gathering points."}, {"name": "Royal Rangers", "url": "https://royalrangers.com", "category": "rites-boys", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Pentecostal Christian boys' mentoring and outdoor program \u2014 the official boys' ministry of the Assemblies of God (USA), founded in 1962. Boys ages 5\u201317 join age-graded \"outposts\" led by adult male commanders. Combines biblical training, outdoor skills, and merit-based advancement (similar to Boy Scouts) within an explicitly Pentecostal Christian frame. Operates in thousands of Assemblies of God churches and selected partner congregations across the US."}, {"name": "Returned and Services League of Australia (RSL)", "url": "https://www.rslaustralia.org/", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "yes", "regions": ["australia-nationwide"], "description": "Australian veterans' organisation founded in 1916 to support returned servicemen and -women and their families. Operates at sub-branch level through ~1,200 local sub-branches across Australia, plus the broader RSL Club network \u2014 licensed clubs that function as social and gathering venues for members and the public. Membership requires Australian Defence Force service or eligible service. Provides advocacy, welfare support, mateship, and the annual Anzac Day commemoration."}, {"name": "Sacred Sons", "url": "https://www.sacredsons.com/", "category": "curriculum-retreat", "tradition": "secular", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide", "online"], "description": "Modern men's-work community known for \"Convergence\" \u2014 multi-day immersive gatherings combining ritual, embodiment practice, and brotherhood. Continues between events through regional pods and online programs. Suited to men stable enough to engage intense intentional work; not designed as a door for active acute crisis."}, {"name": "SAGE (Services and Advocacy for GLBT Elders)", "url": "https://www.sageusa.org", "category": "civic-fraternal", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["us-nationwide", "online"], "description": "Oldest and largest US national organisation dedicated to LGBTQ+ older adults, founded in 1978 in New York City as Senior Action in a Gay Environment. Operates the SAGE National Resource Center on LGBT Aging (federally-funded), SAGE Centers across NYC, and a national network of SAGE chapters in 23+ states delivering case-management, advocacy, peer support, befriending services, and the SAGEConnect telephone friendly-visitor programme. Free for older LGBTQ+ adults. Co-ed but men-relevant \u2014 older gay men are disproportionate in SAGE's user base given LGBT-elder demographics shaped by AIDS-era survivor patterns."}, {"name": "Salvation Army Adult Rehabilitation Centers (ARC)", "url": "https://www.salvationarmyusa.org/usn/adult-rehabilitation-centers", "category": "reentry", "tradition": "christian", "cost": "free", "intake": "vetted", "crisis_safe": "yes", "regions": ["us-nationwide"], "description": "Residential addiction-recovery program operated by The Salvation Army, with approximately 100 Adult Rehabilitation Centers across the US. Six-month-plus residential program combines structured work therapy (often in Salvation Army's thrift-store operations), spiritual programming, counseling, and 12-step-style group work. Free for participants \u2014 funded through thrift-store revenue. Open to men in active addiction."}, {"name": "Salvation Army Canada", "url": "https://salvationarmy.ca", "category": "reentry", "tradition": "christian", "cost": "free", "intake": "vetted", "crisis_safe": "yes", "regions": ["canada-nationwide"], "description": "Canadian Territory of The Salvation Army, operating since 1882 with adult rehabilitation centres, residential recovery programs, family services, shelters, and community ministries across Canada. Functions as the Canadian parallel to [[Salvation Army Adult Rehabilitation]] (US) \u2014 same denominational structure with Canadian-specific governance and programming. Strong men's-recovery infrastructure in major Canadian metros plus rural community work."}, {"name": "Salvation Army Caribbean Territory (Jamaica)", "url": "https://salvationarmycarib.org", "category": "reentry", "tradition": "christian", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["jamaica-nationwide"], "description": "Headquarters territory of The Salvation Army's Caribbean operations \u2014 based in Kingston, Jamaica, since The Salvation Army arrived in Jamaica in 1887. The Caribbean Territory covers Jamaica, Haiti, the Bahamas, Bermuda, Cayman Islands, the Eastern Caribbean (Antigua, Barbados, Grenada, etc.), Guyana, Suriname, and the Latin Caribbean. Operates corps (churches), homeless shelters, addiction-recovery programmes, and men's-rehabilitation work across the territory. Free for participants; Christian frame throughout."}, {"name": "Salvation Army UK and Ireland", "url": "https://www.salvationarmy.org.uk", "category": "reentry", "tradition": "christian", "cost": "free", "intake": "vetted", "crisis_safe": "yes", "regions": ["uk-nationwide", "ireland-nationwide"], "description": "UK and Ireland Territory of The Salvation Army, founded in 1865 in East London by William and Catherine Booth \u2014 the global birthplace of The Salvation Army movement. Operates corps (churches), residential addiction-recovery centres, family-services centres, social work, and homelessness shelters across the UK and Ireland. Strong men's-recovery and homeless-men's-services infrastructure."}, {"name": "Samaritans", "url": "https://www.samaritans.org", "category": "drop-in", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["uk-nationwide", "ireland-nationwide"], "description": "UK and Ireland crisis-support charity, founded in 1953 by Chad Varah. Operates a 24/7 helpline (UK: 116 123; Ireland: 116 123), email and webchat support, and branches across the UK and Ireland. Free, anonymous, listening-focused (Samaritans don't give advice \u2014 they listen). Not exclusively men's-focused, but male callers represent a substantial portion of contacts and Samaritans plays a critical role in UK and Irish men's-suicide-prevention infrastructure given that suicide is the leading killer of men under 50 in the UK."}, {"name": "San Francisco Zen Center", "url": "https://www.sfzc.org", "category": "faith-community", "tradition": "buddhist", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-CA"], "description": "Soto Zen training and practice community founded in 1962 by Shunryu Suzuki Roshi. Operates three centers: City Center on Page Street in San Francisco, Green Gulch Farm in Marin County, and Tassajara Zen Mountain Center in Big Sur. Hosts daily zazen, weekend retreats, and longer practice periods. Mixed-gender; men's-specific groups exist within the broader sangha."}, {"name": "The Scout Association (UK)", "url": "https://www.scouts.org.uk", "category": "rites-boys", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["uk-nationwide"], "description": "The founding national Scout organization, established in 1907 by Robert Baden-Powell after the Brownsea Island camp. All other Scouting movements globally (including [[Scouts Canada]] and [[Sea Scouts BSA]] / Boy Scouts of America) trace their origins here. Now co-ed since the 1990s; adult male volunteer leaders constitute a meaningful men's-gathering layer."}, {"name": "Scouting Ireland", "url": "https://www.scouts.ie", "category": "rites-boys", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["ireland-nationwide", "gb-northern-ireland"], "description": "Irish national Scouting organization, formed in 2003 by the merger of Catholic Boy Scouts of Ireland (CBSI, founded 1927) and the Scout Association of Ireland (SAI). Operates across the Republic of Ireland and Northern Ireland \u2014 uniquely all-Ireland; most other organizations split along the political border. Programs cover Beavers, Cubs, Scouts, Venturers, and Rovers age-graded sections. Co-ed since merger."}, {"name": "Scouts Canada", "url": "https://www.scouts.ca", "category": "rites-boys", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["canada-nationwide"], "description": "Canadian national Scouting organization, founded in 1908. Co-ed since the 1990s. Adult volunteer Scouters constitute a meaningful adult-male brotherhood layer alongside the youth program. Programs cover Beavers, Cubs, Scouts, Venturers, and Rovers age-graded sections. Operates across all Canadian provinces and territories."}, {"name": "Sea Cadets UK", "url": "https://www.sea-cadets.org", "category": "rites-boys", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["uk-nationwide"], "description": "UK uniformed youth organization for ages 10\u201318, sponsored by the Royal Navy and operated by the Marine Society & Sea Cadets charity. Operates approximately 400 units across the UK with adult volunteer instructors (many of whom are former Royal Navy or Royal Marines). Programs include seamanship, leadership, drill, and adventure training. Co-ed."}, {"name": "Sea Scouts BSA", "url": "https://seascout.org", "category": "rites-boys", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Maritime branch of Scouts BSA, founded 1912, for youth ages 14\u201321. Local \"ships\" operate across the US (concentrated in coastal and lake regions) with adult Skippers and Mates as mentors. Programs cover seamanship, boat operations, navigation, and leadership development with Sea Scout-specific advancement awards. Co-ed since 2018."}, {"name": "Self-Realization Fellowship (SRF)", "url": "https://yogananda.org/", "category": "faith-community", "tradition": "hindu", "cost": "free", "intake": "open", "crisis_safe": "unknown", "regions": ["us-multiple"], "description": "Hindu yoga organization founded in 1920 in Boston by Paramahansa Yogananda (author of *Autobiography of a Yogi*), now headquartered in Los Angeles. Teaches Kriya Yoga \u2014 meditation techniques rooted in Indian Vedantic-yogic tradition. Operates approximately 50 US temples and meditation centers plus a global lay-meditation membership through correspondence Lessons. Mixed-gender; men's-specific gathering happens through participation in temple programs and lay-membership cohorts."}, {"name": "Sertoma International", "url": "https://www.sertoma.org/", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Civic service organization founded in 1912 in Kansas City, MO (\"Sertoma\" = SERvice TO MAnkind). Operates clubs across the US focused primarily on hearing-health initiatives (the organization's signature charitable mission) and youth scholarships. Now formally co-ed; many local clubs remain male-majority, especially in smaller US cities. Smaller absolute footprint than [[Lions Clubs International]] or [[Rotary International]] but distinctive hearing-health mission."}, {"name": "Sex Addicts Anonymous", "url": "https://saa-recovery.org", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["us-nationwide", "online"], "description": "12-step fellowship for men and women recovering from compulsive sexual behavior, founded in 1977. Phone, online, and in-person meetings nationally; many men-only formats. Free, anonymous, and structurally parallel to AA \u2014 the foundational door for sexual-compulsion recovery."}, {"name": "Sex and Love Addicts Anonymous (SLAA)", "url": "https://slaafws.org", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["us-nationwide", "online"], "description": "12-step fellowship founded in 1976 for recovery from compulsive behaviors related to sex, romance, and emotional dependence \u2014 distinguished from [[Sex Addicts Anonymous]] by SLAA's broader focus on love-and-romance addiction patterns alongside sexual compulsion. Phone, online, and in-person meetings nationally; many men-only formats. Free, anonymous, low-friction intake."}, {"name": "Sexaholics Anonymous (SA)", "url": "https://www.sa.org/", "category": "drop-in", "tradition": "12-step", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["us-nationwide", "online"], "description": "12-step fellowship founded in 1979 for recovery from sexual compulsion, distinguished from [[Sex Addicts Anonymous]] by a more traditionally-conservative definition of sexual sobriety (sexual activity only with a spouse). In-person meetings across the US plus online. Free, anonymous, low-friction intake."}, {"name": "Soka Gakkai International USA (SGI-USA) Men's Division", "url": "https://www.sgi-usa.org", "category": "faith-community", "tradition": "buddhist", "cost": "free", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "US affiliate of Soka Gakkai International, a global Nichiren Buddhist lay organization with US chapters since 1960. SGI-USA's Men's Division is one of four age/gender divisions and meets weekly at local SGI community centers and member homes for chanting (Nam-myoho-renge-kyo), Buddhist study, and structured group discussion. Free, open to anyone interested. Membership is significantly more racially and economically diverse than most US Buddhist organizations."}, {"name": "Sikh Gurdwaras of Canada", "url": "https://www.worldsikh.org", "category": "faith-community", "tradition": "sikh", "cost": "free", "intake": "open", "crisis_safe": "unknown", "regions": ["canada-nationwide"], "description": "Local Sikh sangats (congregations) gather at gurdwaras across Canada, with substantial Sikh populations in BC's Lower Mainland (Surrey, Vancouver, Abbotsford), the Greater Toronto Area (Brampton, Mississauga), Calgary, and other metro areas. Men's-specific gathering happens through participation in seva (service) at the gurdwara, daily prayer (Nitnem), and study circles. Same model as the US [[Local Gurdwara Sangat]] entry but with Canadian gurdwaras' distinctive size and cultural prominence."}, {"name": "Singles for Christ (SFC)", "url": "https://singlesforchrist.com", "category": "faith-community", "tradition": "christian", "cost": "free", "intake": "vetted", "crisis_safe": "no", "regions": ["philippines-nationwide", "online"], "description": "Young-adult arm of Couples for Christ (CFC), founded 1993 in the Philippines for unmarried Catholic young adults aged ~21\u201340. SFC operates men-specific and women-specific household / chapter structures. Weekly household meetings, monthly chapter assemblies, and the SFC Christian Life Program (CLP) introductory teaching series. Free participation; Catholic-charismatic frame throughout. Operates in 100+ countries reflecting the Filipino diaspora."}, {"name": "Slovak Catholic Sokol", "url": "https://www.slovakcatholicsokol.org", "category": "civic-fraternal", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "unknown", "regions": ["us-multiple"], "description": "Slovak-American Catholic fraternal benefit society founded in 1905, with the gymnastic-fitness tradition of the Sokol movement parallel to [[Polish Falcons of America]]. Operates lodges concentrated in Pennsylvania, Ohio, New Jersey, and other states with substantial Slovak-American Catholic populations. Programs include life insurance, scholarships, gymnastics programs, and Slovak cultural preservation."}, {"name": "SMART Recovery", "url": "https://smartrecovery.org/", "category": "drop-in", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["us-nationwide", "online"], "description": "Secular, CBT-based recovery community for any addiction, founded in 1994 as Self-Management And Recovery Training. Meetings use a four-point program (motivation, cravings, behavior, balanced living) drawn from cognitive-behavioral therapy and rational emotive behavior therapy. Free, peer-led, with both in-person and online groups across the US."}, {"name": "Soci\u00e9t\u00e9 Saint-Jean-Baptiste (SSJB)", "url": "https://ssjb.com", "category": "civic-fraternal", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["ca-QC"], "description": "Patriotic and cultural society founded in 1834 in Montreal, dedicated to Quebec French-Canadian culture, language preservation, and civic life. While now formally co-ed and broader in mission, the SSJB remains an institution where many Quebec men engage in civic-cultural fellowship through chapters across Quebec. Most active around June 24 (la F\u00eate nationale du Qu\u00e9bec, originally St-Jean-Baptiste Day)."}, {"name": "Sokol USA", "url": "https://sokolusa.org", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "unknown", "regions": ["us-multiple"], "description": "Czech-American gymnastic-fraternal benefit society founded in 1865, the oldest of the US Sokol organizations. Distinct from [[Slovak Catholic Sokol]] (Slovak Catholic) and [[Polish Falcons of America]] (Polish Catholic) \u2014 Sokol USA has historically secular roots in Czech freethinker tradition. Operates lodges concentrated in Chicago, Cleveland, and other Czech-American communities. Programs include gymnastics, scholarships, and Czech cultural preservation."}, {"name": "Sonke Gender Justice", "url": "https://genderjustice.org.za", "category": "drop-in", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "no", "regions": ["south-africa-nationwide", "online"], "description": "South African non-profit working across the African continent and globally to engage men and boys in gender equality, the prevention of gender-based violence, and HIV/AIDS prevention. Co-founded MenEngage Alliance (2008). Headquartered in Cape Town with a Johannesburg office. Programs include the One Man Can campaign, community education and dialogue groups (CAGs), policy advocacy, and digital storytelling. Free participation; movement-building model rather than direct-service."}, {"name": "Order Sons and Daughters of Italy in America (OSDIA)", "url": "https://www.osia.org", "category": "civic-fraternal", "tradition": "christian", "cost": "fee", "intake": "vetted", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "Italian-American fraternal benefit society founded in 1905, with national headquarters in Washington DC and local lodges across the US. Now formally co-ed and renamed to include daughters; many local lodges still function as primarily men's gatherings. Programs include scholarships, anti-defamation work, Italian cultural preservation, and charitable service. Strongest concentration in NY, NJ, PA, MA, CT, IL, OH, FL, and CA."}, {"name": "Sons of Norway", "url": "https://www.sofn.com", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "Norwegian-American fraternal benefit society founded in 1895 in Minneapolis, MN. Operates approximately 350 lodges across the US and Canada, concentrated in the Upper Midwest (Minnesota, North Dakota, South Dakota, Wisconsin) plus Norwegian-heritage communities elsewhere. Now formally co-ed; many lodges still function as primarily men's gatherings. Programs include Norwegian cultural preservation, scholarships, language instruction, and charitable work."}, {"name": "Sons of the American Revolution (SAR)", "url": "https://www.sar.org", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Patriotic lineage fraternal society founded in 1889, restricted to male descendants of patriots who served the American cause in the Revolutionary War. Local chapters across the US run patriotic education, color guard ceremonies, scholarship programs, and historical preservation. Membership requires documented genealogical descent. The Daughters of the American Revolution (DAR) is the parallel women's organization (older, founded 1890)."}, {"name": "Sons of the Revolution (SR)", "url": "https://sr1776.org/", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Patriotic lineage fraternal society founded in 1876, restricted to male descendants of patriots who served the American cause in the Revolutionary War. Older than its more-active sibling [[Sons of the American Revolution]] (founded 1889 after a split). Smaller in absolute size than SAR but with continuing local society activity in some states. Membership requires documented genealogical descent."}, {"name": "Spirit Rock Meditation Center", "url": "https://www.spiritrock.org", "category": "faith-community", "tradition": "buddhist", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-CA"], "description": "Vipassana / Insight Meditation retreat center in West Marin County, CA, founded in 1988. Hosts mixed-gender retreats year-round plus dedicated men's retreats and weekend programs. Mostly fee-based with sliding-scale and dana (donation-based) options. Listed because the West Coast Vipassana scene is a real men's-gathering ecosystem distinct from the temple-network Buddhist communities ([[Buddhist Churches of America]], [[Hsi Lai Temple Fo Guang Shan]], [[SGI-USA Mens Division]]) and from Buddhist-recovery communities ([[Recovery Dharma]], [[Refuge Recovery]])."}, {"name": "SSAFA (Soldiers, Sailors, Airmen and Families Association)", "url": "https://www.ssafa.org.uk", "category": "civic-fraternal", "tradition": "secular", "cost": "free", "intake": "vetted", "crisis_safe": "yes", "regions": ["uk-nationwide"], "description": "The oldest UK armed-forces charity, founded in 1885. Provides welfare support, casework, and helplines for serving and ex-serving members of the British Armed Forces and their families. Trained volunteers (many of whom are veterans themselves) handle casework across the UK. Free for serving personnel, veterans, and families."}, {"name": "St. Leonard's Society of Canada", "url": "https://stleonards.ca", "category": "reentry", "tradition": "christian", "cost": "free", "intake": "vetted", "crisis_safe": "yes", "regions": ["canada-nationwide"], "description": "Canadian community-corrections and reentry organization founded in 1962, with member societies operating residential reentry houses, post-release programs, and advocacy across Canada. Catholic-rooted in origin (named for Saint Leonard, patron of prisoners) but operates ecumenically."}, {"name": "St Mary's Catholic Church Dubai Men's Ministry", "url": "https://stmarysdubai.org", "category": "faith-community", "tradition": "christian", "cost": "free", "intake": "open", "crisis_safe": "no", "regions": ["united-arab-emirates-nationwide"], "description": "Men's-ministry network of St Mary's Catholic Church Dubai (Oud Metha compound) \u2014 the largest Catholic parish in the UAE, founded 1967. Part of the Apostolic Vicariate of Southern Arabia. Men's-fellowship operates through multi-language structures: English-language Holy Name Society / Catholic Men's Group, plus substantial Filipino-Catholic men's groups (CFC chapter, SFC chapter, parish-level Brotherhood structures), Indian Catholic (Konkani, Malayalee), Sri Lankan, and others. Free participation; multi-cultural Catholic frame."}, {"name": "Sterling Men's Weekend", "url": "https://www.sterlingmensdivision.com", "category": "curriculum-retreat", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-multiple"], "description": "Personal-development weekend retreat for men, run by the Sterling Institute of Relationship since the early 1980s. Weekend format combines confrontational group work, exercises, and brotherhood building, with ongoing \"men's teams\" that continue meeting after the weekend. Historically active in California and other West Coast metros, with periodic regional events elsewhere."}, {"name": "Sunshine Coast Health Centre", "url": "https://sunshinecoasthealthcentre.ca", "category": "therapy-clinical", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "yes", "regions": ["ca-BC"], "description": "British Columbia residential addiction-treatment centre on the Sunshine Coast (Powell River area), founded in 2004, with a specifically men-only clinical model. Combines 12-step rooted recovery with non-12-step elements (CBT, motivational interviewing, recreation therapy). Insurance-funded for many participants; private-pay also."}, {"name": "Tablighi Jamaat", "url": "https://en.wikipedia.org/wiki/Tablighi_Jamaat", "category": "faith-community", "tradition": "muslim", "cost": "free", "intake": "open", "crisis_safe": "no", "regions": ["us-multiple", "online"], "description": "Global Sunni Muslim revivalist movement founded 1926 in Mewat, India, by Maulana Muhammad Ilyas al-Kandhlawi. Tablighi Jamaat (\"Society for Spreading Faith\") is one of the largest grassroots Islamic movements in the world, with active presence across 150+ countries. Distinctively organised around weekly mosque-based gatherings (mashwara), longer-form daawah excursions (khuruj \u2014 typically 3 days, 40 days, or 4 months), and an annual ijtema (mass-gathering \u2014 the Bishwa Ijtema in Bangladesh and the Raiwind Ijtema in Pakistan are among the largest annual male-religious gatherings on earth, drawing millions). Men-only by traditional structure (women's separate Tablighi work exists in some contexts). Free participation; entirely volunteer-led, no formal hierarchy. Operates through local mosque networks rather than a central headquarters."}, {"name": "Team Rubicon", "url": "https://teamrubiconusa.org", "category": "civic-fraternal", "tradition": "secular", "cost": "free", "intake": "vetted", "crisis_safe": "yes", "regions": ["us-nationwide"], "description": "Veteran-led disaster response organization founded in 2010 after the Haiti earthquake. Deploys teams of military veterans (called \"Greyshirts\") plus civilian volunteers to disaster-response operations across the US and internationally \u2014 hurricanes, wildfires, floods, tornadoes. Operations include initial damage assessment, debris removal, mucking-and-gutting, and longer-term rebuild coordination. Free for participating veterans; training provided."}, {"name": "The American Legion", "url": "https://www.legion.org", "category": "civic-fraternal", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "yes", "regions": ["us-nationwide"], "description": "Fraternal organization for US military veterans, founded in 1919. Membership is open to any honorably discharged US veteran (no foreign-service requirement, unlike [[Veterans of Foreign Wars]]). Operates roughly 12,000 local posts across the US providing fellowship, veteran advocacy, youth programs (Boys State, American Legion Baseball), and community service. Larger and broader than VFW; the most accessible veterans' fraternal in the country in terms of intake."}, {"name": "The Bowery Mission", "url": "https://www.bowery.org", "category": "reentry", "tradition": "christian", "cost": "free", "intake": "vetted", "crisis_safe": "yes", "regions": ["us-NY"], "description": "Christian mission to homeless and unhoused men in New York City, founded in 1879. Operates a Men's Center on the Bowery with a residential discipleship/recovery program (typically 9\u201312 months) integrating addiction recovery, vocational training, and Christian formation. Free for participants; supported by donor philanthropy. One of the oldest continuously-operating rescue missions in the US."}, {"name": "The Bridge to Recovery", "url": "https://www.thebridgetorecovery.com/", "category": "therapy-clinical", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "yes", "regions": ["us-KY"], "description": "Residential therapy and addiction-recovery center in Bowling Green, KY, founded in 1981. Uses a 14-day workshop format combining group therapy, addiction recovery, and trauma work. Smaller and less well-known than [[The Meadows]] or [[Hazelden Betty Ford]] but with a distinct workshop-intensive model focused on emotional and trauma recovery."}, {"name": "The Center for Group Studies", "url": "https://www.centerforgroupstudies.com", "category": "therapy-clinical", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-NY"], "description": "NYC-based group-analysis training institute and clinical practice, founded in 1979 by Louis Ormont. Offers ongoing therapy groups including men's-focused groups, plus training programs for clinicians who want to lead group therapy. The most-established academic group-therapy practice in NYC \u2014 direct service is geographically limited to the metro area, but the Ormont-method approach has shaped clinicians nationwide."}, {"name": "The Character Company", "url": "https://www.thecharactercompany.co.za/", "category": "rites-boys", "tradition": "secular", "cost": "free", "intake": "vetted", "crisis_safe": "no", "regions": ["south-africa-nationwide"], "description": "South African mentoring charity matching boys (typically aged 7\u201316) without active father figures with screened, trained adult-male mentors for long-term group and one-to-one mentoring. Founded 2011, based in Johannesburg with chapters across Gauteng and other provinces. Vetted intake \u2014 both boys and mentors are screened and oriented. Free for the boys and their families."}, {"name": "The Doe Fund", "url": "https://www.doe.org", "category": "reentry", "tradition": "secular", "cost": "free", "intake": "vetted", "crisis_safe": "yes", "regions": ["us-NY"], "description": "NYC-based non-profit founded in 1985 by George T. McDonald, providing transitional work, paid training, supportive housing, and case management for homeless and formerly-incarcerated men. The \"Ready, Willing & Able\" program is the Doe Fund's signature \u2014 distinctive blue uniforms, daily street-cleaning work, and a structured 9\u201312 month residential program with substance-use treatment, GED prep, and job placement."}, {"name": "The Father Effect", "url": "https://thefathereffect.com", "category": "fatherhood", "tradition": "christian", "cost": "free", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide", "online"], "description": "Christian-rooted fatherhood ministry founded by John Finch around the 2014 documentary film of the same name. Programs address the impact of fatherlessness and the work of becoming a present, healing father. Includes a short documentary, a workbook curriculum for small groups, and ongoing speaking and church-based programming."}, {"name": "The Hoffman Institute", "url": "https://www.hoffmaninstitute.org", "category": "therapy-clinical", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "Personal-development non-profit running \"The Hoffman Process\" \u2014 a week-long residential intensive addressing patterns from childhood and the dysfunctional behaviors that grow out of them, founded in 1967 by Bob Hoffman. Group size is intentionally small (around 30 participants per cohort); held at retreat properties in California and selected international locations. Mixed-gender, but the structured emotional work creates substantial men's-gathering function for participating men, and many participate as a pre-requisite to longer therapy or men's-work paths."}, {"name": "The Junto Institute", "url": "https://www.thejuntoinstitute.com/", "category": "curriculum-retreat", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "no", "regions": ["us-IL", "us-multiple"], "description": "Chicago-based leadership-development and peer-circle organization for founders, CEOs, and emerging leaders, founded in 2014 in the lineage of Benjamin Franklin's original Junto discussion circles. Programs combine teaching, peer feedback, and small-group reflection in a Franklin-style \"junto\" format. Cohorts run one to two years; alumni network continues afterward. Mixed-gender in many cohorts but functions as significant men's-gathering for participating men."}, {"name": "The Last Mile", "url": "https://thelastmile.org", "category": "reentry", "tradition": "secular", "cost": "free", "intake": "vetted", "crisis_safe": "no", "regions": ["us-nationwide"], "description": "In-prison technology and entrepreneurship training program for incarcerated men and women, founded in 2010 at San Quentin State Prison. Participants learn coding, web development, audio/video production, and other technical skills in a structured classroom environment, plus business mentorship from outside professionals. Alumni network supports re-entry employment and continued growth."}, {"name": "The Man Cave", "url": "https://themancave.life", "category": "rites-boys", "tradition": "secular", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["australia-nationwide"], "description": "Australian charity running preventative mental-health and emotional-development programs for adolescent boys (typically Years 8\u201310) in schools and community settings. Founded in 2014. Programs are facilitated by trained men and use a mix of group dialogue, storytelling, and rites-of-passage framing to support boys through adolescence with stronger emotional vocabulary, healthier relationships, and clearer identity formation. Operates across multiple Australian states with school partnerships."}, {"name": "The Meadows", "url": "https://www.themeadows.com", "category": "therapy-clinical", "tradition": "secular", "cost": "fee", "intake": "vetted", "crisis_safe": "yes", "regions": ["us-AZ"], "description": "Residential addiction and trauma treatment center in Wickenburg, AZ, founded in 1976. Distinctive for its integration of trauma work (Pia Mellody's developmental immaturity model) with traditional addiction treatment. Mixed-gender residential program plus specialized programs (The Meadows Outpatient, Willow House for women, Brookside Place for chemical dependency, Rio Retreat Center for workshops)."}, {"name": "The Men's Project (Jesuit Social Services)", "url": "https://jss.org.au/programs/the-mens-project/", "category": "curriculum-retreat", "tradition": "christian", "cost": "free", "intake": "open", "crisis_safe": "no", "regions": ["australia-nationwide"], "description": "Healthy-masculinity research-and-program initiative within Jesuit Social Services, the social-justice arm of the Australian Jesuits. Best known internationally for *The Man Box* study (2017, repeated 2024), which measured the prevalence of rigid masculine norms among Australian men and their correlation with violence, depression, and suicide. The Men's Project also runs Modelling Respect & Equality (MoRE), Unpacking the Man Box workshops, and partnerships with sports clubs, schools, and workplaces."}, {"name": "The Mission Continues", "url": "https://www.missioncontinues.org", "category": "civic-fraternal", "tradition": "secular", "cost": "free", "intake": "vetted", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "Non-profit founded in 2007 deploying post-9/11 veterans into community service in underserved neighborhoods through \"Service Platoons\" \u2014 local teams of veterans who commit to ongoing volunteer service projects together. Operates in cities across the US. Free for participating veterans. Distinct from purely-fraternal VSOs by its explicit civilian-service mission as a vehicle for veteran reintegration and continued purpose."}, {"name": "The Mosque Cares (Imam W. Deen Mohammed Community)", "url": "https://www.themosquecares.com", "category": "faith-community", "tradition": "muslim", "cost": "fee", "intake": "open", "crisis_safe": "unknown", "regions": ["us-nationwide"], "description": "Network of Sunni Muslim mosques and communities established by Imam Warith Deen Mohammed (1933\u20132008), son of Elijah Muhammad. After his father's death in 1975, W. Deen Mohammed led the largest movement of African-American Muslims into mainstream Sunni Islam, transforming the Nation of Islam infrastructure he inherited. The Mosque Cares maintains his legacy and the affiliated mosque network. Active in major US metros with substantial Black American Muslim populations."}, {"name": "The Mountaineers", "url": "https://www.mountaineers.org", "category": "outdoor-fitness", "tradition": "secular", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-WA"], "description": "Pacific Northwest outdoor community founded in Seattle in 1906, offering courses and trips in hiking, climbing, mountaineering, paddling, and conservation. Membership-based with seven WA branches plus partner relationships outside the region. Not formally men's-only, but the climbing and mountaineering programs have historically been male-dominated and continue to function for many men as a primary brotherhood \u2014 long expedition partnerships, course cohorts, and committee work create durable men-to-men relationships."}, {"name": "The Mussar Institute", "url": "https://www.mussarinstitute.org/", "category": "faith-community", "tradition": "jewish", "cost": "fee", "intake": "open", "crisis_safe": "no", "regions": ["us-nationwide", "online"], "description": "Jewish character-development organization founded in 2004 by Alan Morinis, reviving the 19th-century Eastern European Mussar tradition for contemporary practice. The Mussar tradition emphasizes systematic work on personal character traits (middot) \u2014 patience, humility, generosity, equanimity, etc. \u2014 through practice, study, and small-group accountability. Offers online courses, in-person retreats, and supports the formation of local \"vaad\" or chavurot (small accountability groups), some men's-only."}, {"name": "The Phoenix", "url": "https://thephoenix.org", "category": "drop-in", "tradition": "secular", "cost": "free", "intake": "open", "crisis_safe": "yes", "regions": ["us-nationwide"], "description": "Sober active community found
