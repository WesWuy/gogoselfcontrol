<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your path — gogoselfcontrol.org</title>
<meta name="description" content="Help men who need their men to find their men. A directory of men's gatherings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F2EAD3;
  --bg-card: #FBF6E8;
  --bg-soft: #EBE2C5;
  --fg: #2A2520;
  --fg-mute: #6B6256;
  --fg-deep: #423B30;
  --accent: #3D5A40;
  --accent-soft: #6E8A6F;
  --rule: #C7B98F;
  --rule-soft: #DDD2A8;
  --warn-bg: #ECE0BF;
  --warn-fg: #6B4F18;
  --crisis-bg: #2A4D3A;
  --crisis-fg: #F2EAD3;
  --serif: 'EB Garamond', Garamond, 'Times New Roman', Georgia, serif;
  --mono: 'IBM Plex Mono', Menlo, Consolas, monospace;
  --measure: 36rem;
  --measure-wide: 64rem;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  font-family: var(--serif);
  font-size: 1.0625rem;
  line-height: 1.55;
  color: var(--fg);
  background: var(--bg);
  margin: 0;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { color: var(--fg); }
hr { border: none; border-top: 1px solid var(--rule-soft); margin: 2rem 0; }

.site-wrap { max-width: var(--measure-wide); margin: 0 auto; padding: 2rem 1.5rem 3rem; }
.measure { max-width: var(--measure); }

/* Masthead — used on inner pages, not on home */
.masthead {
  border-bottom: 1px solid var(--rule);
  padding-bottom: 1rem;
  margin-bottom: 2.5rem;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 1rem 2rem;
}
.masthead .brand {
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 500;
  letter-spacing: 0.01em;
  color: var(--fg);
  text-decoration: none;
  margin-right: auto;
}
.masthead .brand .dot { color: var(--accent); }
.masthead nav {
  font-family: var(--mono);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.13em;
  display: flex;
  gap: 1.5rem;
}
.masthead nav a {
  color: var(--fg-mute);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  padding-bottom: 2px;
}
.masthead nav a:hover,
.masthead nav a[aria-current="page"] {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* Type */
h1, h2, h3 { font-family: var(--serif); font-weight: 500; color: var(--fg); margin-top: 0; }
h1 { font-size: 2.25rem; line-height: 1.18; margin-bottom: 1rem; }
h2 { font-size: 1.5rem; line-height: 1.25; margin: 2rem 0 0.75rem; }
h3 { font-size: 1.2rem; line-height: 1.3; margin: 1.4rem 0 0.5rem; }
p { margin: 0 0 1rem; }
.lede { font-size: 1.2rem; line-height: 1.5; color: var(--fg-deep); max-width: 38rem; }
.lede em { color: var(--accent); font-style: italic; }
.kicker {
  font-family: var(--mono);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent);
  margin-bottom: 0.75rem;
}

/* ---------- HOME (Google-style assessment) ---------- */

body.home {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  padding: 0;
}
.home-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 3rem 1.5rem 2rem;
  max-width: 36rem;
  margin: 0 auto;
}
.home-wordmark {
  font-family: var(--serif);
  font-size: 2.6rem;
  font-weight: 500;
  margin: 0 0 0.5rem;
  letter-spacing: -0.005em;
}
.home-wordmark .dot { color: var(--accent); }
.home-mission {
  font-family: var(--serif);
  font-style: italic;
  color: var(--fg-mute);
  font-size: 1.05rem;
  margin: 0 0 3.5rem;
  max-width: 28rem;
}

/* Quiet crisis link in home footer — for the man who needs it; not a primary CTA */
.crisis-quiet {
  color: var(--fg-mute);
  text-decoration: none;
  border-bottom: 1px dotted var(--rule);
}
.crisis-quiet:hover { color: var(--accent); border-bottom-color: var(--accent); }

/* Primary CTA — the assessment journey */
.journey-cta {
  display: inline-flex;
  align-items: center;
  gap: 0.75rem;
  margin: 0 auto 2rem;
  padding: 0.95rem 1.5rem;
  background: var(--accent);
  color: var(--crisis-fg);
  text-decoration: none;
  border-radius: 2px;
  font-family: var(--mono);
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  font-weight: 500;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  box-shadow: 0 2px 8px rgba(61, 90, 64, 0.18);
  min-height: 48px;
}
.journey-cta:hover, .journey-cta:focus {
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(61, 90, 64, 0.28);
  background: var(--fg);
  color: var(--crisis-fg);
  outline: none;
}
.journey-cta-arrow { font-family: var(--serif); font-size: 1.1rem; letter-spacing: 0; }
.home-or {
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--fg-mute);
  margin: 0 0 1rem;
  position: relative;
}
.home-or::before, .home-or::after {
  content: '';
  display: inline-block;
  width: 2.5rem;
  height: 1px;
  background: var(--rule-soft);
  vertical-align: middle;
  margin: 0 0.75rem;
}
@media (max-width: 540px) {
  .journey-cta { width: 100%; max-width: 24rem; justify-content: center; padding: 1rem 1.2rem; }
}

/* ---------- ASSESSMENT (choose-your-own-adventure wizard) ---------- */
body.assess {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  padding: 0;
}

/* Wireframe-head ambient presence — top-right of the assessment, drifts
   toward the cursor. Hidden on small screens and when reduced motion is
   preferred. The canvas is positioned fixed and pointer-events: none so it
   never interferes with the wizard interaction. */
.head-mount {
  position: fixed;
  top: 1.25rem;
  right: 1.25rem;
  width: 140px;
  height: 140px;
  pointer-events: none;
  z-index: 1;
  opacity: 0.6;
}
.head-mount canvas { display: block; }
@media (max-width: 720px) {
  .head-mount { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .head-mount { display: none; }
}
.assess-stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 3rem 1.5rem 4rem;
  max-width: 36rem;
  margin: 0 auto;
  width: 100%;
}
.assess-progress {
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--fg-mute);
  margin: 0 0 2.5rem;
  text-align: center;
}
.assess-progress .bar {
  display: inline-block;
  width: 8rem;
  height: 2px;
  background: var(--rule-soft);
  margin-left: 0.75rem;
  vertical-align: middle;
  position: relative;
}
.assess-progress .bar > span {
  position: absolute;
  top: 0; left: 0; height: 100%;
  background: var(--accent);
  transition: width 0.4s ease;
}
.assess-screen { animation: fadeIn 0.45s ease-out both; width: 100%; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.assess-scene {
  font-family: var(--serif);
  font-style: italic;
  color: var(--fg-mute);
  font-size: 1.05rem;
  line-height: 1.55;
  margin: 0 0 1.5rem;
}
.assess-scene p + p { margin-top: 0.8rem; }
.assess-prompt {
  font-family: var(--serif);
  font-size: 1.55rem;
  line-height: 1.25;
  font-weight: 500;
  margin: 0 0 1.75rem;
  color: var(--fg);
}
.assess-options {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 0.65rem;
}
.assess-options button {
  display: block;
  width: 100%;
  text-align: left;
  font-family: var(--serif);
  font-size: 1.05rem;
  line-height: 1.4;
  padding: 0.95rem 1.1rem;
  background: var(--bg-card);
  border: 1px solid var(--rule-soft);
  border-left: 3px solid var(--rule);
  border-radius: 2px;
  color: var(--fg);
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
}
.assess-options button:hover, .assess-options button:focus {
  border-left-color: var(--accent);
  background: white;
  outline: none;
}
.assess-options button:active { transform: translateY(1px); }
.assess-echo {
  font-family: var(--serif);
  font-size: 1.15rem;
  line-height: 1.55;
  color: var(--fg-deep);
  margin: 0 0 2rem;
  padding-left: 1.1rem;
  border-left: 3px solid var(--accent);
}
.assess-continue {
  font-family: var(--mono);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  padding: 0.85rem 1.4rem;
  background: var(--accent);
  color: var(--crisis-fg);
  border: 1px solid var(--accent);
  cursor: pointer;
  border-radius: 2px;
}
.assess-continue:hover { background: var(--fg); border-color: var(--fg); }
.assess-back {
  display: inline-block;
  margin-top: 2rem;
  font-family: var(--mono);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--fg-mute);
  text-decoration: none;
  border: none;
  background: none;
  cursor: pointer;
}
.assess-back:hover { color: var(--accent); }
.assess-intro h1 {
  font-family: var(--serif);
  font-size: 2.4rem;
  font-weight: 500;
  margin: 0 0 1.5rem;
}
.assess-intro p {
  font-size: 1.1rem;
  line-height: 1.55;
  color: var(--fg-deep);
  margin: 0 0 1rem;
}
.assess-intro .assess-continue { margin-top: 1.5rem; }

/* Results */
.assess-results h1 {
  font-family: var(--serif);
  font-size: 2.1rem;
  font-weight: 500;
  margin: 0 0 1rem;
}
.assess-results .synthesis {
  font-family: var(--serif);
  font-size: 1.15rem;
  line-height: 1.55;
  color: var(--fg-deep);
  margin: 0 0 2rem;
  font-style: italic;
}
.assess-results .doors-label {
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 0.75rem;
}
.assess-results .door-bucket {
  margin-bottom: 2.5rem;
}
.assess-results .door-bucket h2 {
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 500;
  margin: 0 0 0.4rem;
  border: none;
  padding: 0;
}
.assess-results .door-bucket .why {
  font-family: var(--serif);
  font-style: italic;
  color: var(--fg-mute);
  font-size: 1rem;
  margin: 0 0 1rem;
}
.assess-results .door-bucket ul {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 0.85rem;
}
.assess-results .results-foot {
  margin-top: 2rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--rule-soft);
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem 1.5rem;
  font-family: var(--mono);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.13em;
}
.assess-results .results-foot a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px dotted var(--accent);
}
.assess-results .results-foot a:hover { border-bottom-style: solid; }

@media (max-width: 540px) {
  .assess-stage { padding: 2rem 1.25rem 3rem; }
  .assess-prompt { font-size: 1.3rem; }
  .assess-intro h1 { font-size: 1.9rem; }
  .assess-results h1 { font-size: 1.75rem; }
}

/* Crisis-block tel: links + locale priority */
.crisis-block .tel {
  font-family: var(--mono);
  font-size: 1rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  white-space: nowrap;
  color: var(--crisis-fg);
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
  padding: 0.4rem 0;
  display: inline-block;
  min-height: 44px;
  line-height: 1.2;
}
.crisis-block .tel:hover { color: var(--accent-soft); }
.crisis-block li.locale-priority {
  background: rgba(255, 255, 255, 0.06);
  padding: 0.7rem 0.7rem;
  margin: 0.25rem -0.7rem;
  border-radius: 2px;
  border-top: none;
}
.crisis-block li.locale-priority + li { border-top: 1px solid rgba(242, 234, 211, 0.2); }
.crisis-block li.locale-priority .region {
  color: var(--bg);
  font-weight: 500;
}

/* Disclaimer crisis-line tap targets */
.callout.warn .tel {
  font-family: var(--mono);
  font-weight: 500;
  white-space: nowrap;
  padding: 0.15rem 0.4rem;
  border-radius: 2px;
  background: rgba(107, 79, 24, 0.08);
  text-decoration: none;
  color: var(--warn-fg);
}
.callout.warn .tel:hover { background: rgba(107, 79, 24, 0.18); text-decoration: underline; }

.home-prompt {
  font-family: var(--serif);
  font-size: 1.55rem;
  font-weight: 500;
  margin: 0 0 1.25rem;
  color: var(--fg);
}
.ask-form {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
  align-items: center;
}
.ask-form .ask-row {
  display: flex;
  width: 100%;
  gap: 0.5rem;
}
.ask-form input {
  flex: 1;
  font-family: var(--serif);
  font-size: 1.1rem;
  padding: 0.85rem 1rem;
  border: 1px solid var(--rule);
  background: white;
  color: var(--fg);
  border-radius: 2px;
  min-width: 0;
}
.ask-form input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(61, 90, 64, 0.2);
}
.ask-form button {
  font-family: var(--mono);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  padding: 0.85rem 1.4rem;
  background: var(--accent);
  color: var(--crisis-fg);
  border: 1px solid var(--accent);
  cursor: pointer;
  border-radius: 2px;
  white-space: nowrap;
}
.ask-form button:hover { background: var(--fg); border-color: var(--fg); }

.pills {
  list-style: none;
  padding: 0;
  margin: 1.5rem 0 0;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.5rem 0.75rem;
}
.pills li a {
  display: inline-block;
  font-family: var(--mono);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.13em;
  padding: 0.45rem 0.95rem;
  border: 1px solid var(--rule);
  background: var(--bg-card);
  color: var(--fg-deep);
  text-decoration: none;
  border-radius: 999px;
  transition: border-color 0.15s ease, color 0.15s ease;
}
.pills li a:hover {
  color: var(--accent);
  border-color: var(--accent);
  background: white;
}
.home-foot {
  font-family: var(--mono);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.13em;
  color: var(--fg-mute);
  text-align: center;
  padding: 1.5rem 1rem 2rem;
  border-top: 1px solid var(--rule-soft);
  margin: 2.5rem auto 0;
  max-width: 40rem;
}
.home-foot a { color: var(--fg-mute); text-decoration: none; border-bottom: 1px dotted var(--rule); }
.home-foot a:hover { color: var(--accent); border-bottom-color: var(--accent); }
.home-foot .dot-sep { margin: 0 0.6rem; color: var(--rule); }

/* ---------- PATH (tailored response) ---------- */

.path-echo {
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  color: var(--fg-mute);
  background: var(--bg-card);
  border-left: 2px solid var(--rule);
  padding: 0.7rem 1rem;
  margin-bottom: 2rem;
  text-transform: uppercase;
}
.path-echo .you-said { display: block; font-size: 0.65rem; color: var(--accent); margin-bottom: 0.2rem; }
.path-echo .text { font-family: var(--serif); font-size: 0.95rem; text-transform: none; letter-spacing: 0; color: var(--fg); font-style: italic; }
.path-headline { font-family: var(--serif); font-size: 2.1rem; line-height: 1.18; margin: 0 0 0.75rem; max-width: 28ch; }
.path-intro { font-size: 1.1rem; line-height: 1.55; color: var(--fg-deep); max-width: 38rem; margin: 0 0 2rem; }

.crisis-block {
  background: var(--crisis-bg);
  color: var(--crisis-fg);
  padding: 1.5rem 1.75rem;
  border-radius: 2px;
  margin: 1.5rem 0 2rem;
}
.crisis-block h2 {
  font-family: var(--mono);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--crisis-fg);
  margin: 0 0 1rem;
  font-weight: 500;
  border: none;
  padding: 0;
}
.crisis-block ul { list-style: none; padding: 0; margin: 0; }
.crisis-block ul li {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.5rem 1rem;
  padding: 0.5rem 0;
  border-top: 1px solid rgba(242, 234, 211, 0.2);
}
.crisis-block ul li:first-child { border-top: none; }
.crisis-block .label {
  font-family: var(--serif);
  font-size: 1rem;
  flex: 1 1 auto;
}
.crisis-block .number {
  font-family: var(--mono);
  font-size: 1rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  white-space: nowrap;
}
.crisis-block .region {
  font-family: var(--mono);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.13em;
  color: var(--accent-soft);
  flex-basis: 100%;
  margin-bottom: -0.25rem;
}

.starts {
  list-style: none;
  padding: 0;
  margin: 0 0 2rem;
  display: grid;
  gap: 1rem;
}
.start-card {
  background: var(--bg-card);
  border: 1px solid var(--rule-soft);
  border-left: 3px solid var(--rule);
  padding: 1.1rem 1.4rem 1.2rem;
  border-radius: 2px;
}
.start-card:hover { border-left-color: var(--accent); }
.start-card .name {
  font-family: var(--serif);
  font-size: 1.2rem;
  font-weight: 500;
  margin: 0 0 0.4rem;
}
.start-card .name a { color: var(--fg); text-decoration: none; }
.start-card .name a:hover { color: var(--accent); }
.start-card .badges { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.35rem 0 0.6rem; }
.start-card .badge {
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 0.15rem 0.5rem;
  background: var(--bg-soft);
  color: var(--fg-deep);
  border: 1px solid var(--rule-soft);
  border-radius: 2px;
}
.start-card .badge.crisis { background: var(--crisis-bg); color: var(--crisis-fg); border-color: var(--crisis-bg); }
.start-card .badge.cost-free { background: #DDE9DA; color: #2C4A2D; border-color: #BFD4BC; }
.start-card .description { margin: 0 0 0.5rem; font-size: 1rem; line-height: 1.5; color: var(--fg); }
.start-card .locator {
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.04em;
  word-break: break-all;
}
.start-card .locator a { color: var(--accent); }

.path-foot {
  margin-top: 2rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--rule-soft);
  font-family: var(--mono);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem 1.5rem;
}
.path-foot a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); }
.path-foot a:hover { border-bottom-style: solid; }

/* ---------- DIRECTORY page ---------- */
.dir-toolbar {
  background: var(--bg-card);
  border: 1px solid var(--rule-soft);
  border-radius: 2px;
  padding: 1.25rem 1.5rem;
  margin-bottom: 1.5rem;
  display: grid;
  grid-template-columns: 1fr;
  gap: 1rem;
}
@media (min-width: 720px) {

}

}
.dir-toolbar label {

}
.dir-toolbar input,
.dir-toolbar select {

}

}

.entry {

.entry p.description { margin: 0.5rem 0 0.75rem; font-size: 1.0625rem; line-height: 1.55; }

.entry .locator a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.entry .locator-label { color: var(--fg-mute); margin-right: 0.5rem; text-transform: uppercase; letter-spacing: 0.13em; font-size: 0.7rem; }
.entry .verification-flag {

.empty { padding: 3rem 1.5rem; text-align: center; color: var(--fg-mute); font-style: italic; background: var(--bg-card); border: 1px dashed var(--rule); border-radius: 2px; }

/* Prose (about / disclaimer) */
.prose { max-width: var(--measure); }

.prose ul { padding-left: 1.5rem; }

.callout {

footer.site-foot {

@media (max-width: 540px) {

}

<script>
(function() {
  const PATHS = {"crisis": {"headline": "You're in the hardest hour.", "intro": "If you can't keep yourself safe in the next hour, please call. The numbers below are free, anonymous, and the people on the other end are trained for exactly this. Tap to dial.", "crisis_lines": [{"region": "United States / Canada", "label": "988 Suicide and Crisis Lifeline", "number": "988", "tel": "988", "locales": ["en-us", "en-ca"]}, {"region": "United Kingdom / Ireland", "label": "Samaritans", "number": "116 123", "tel": "116123", "locales": ["en-gb", "en-ie"]}, {"region": "Australia (general)", "label": "Lifeline", "number": "13 11 14", "tel": "131114", "locales": ["en-au"]}, {"region": "Australia (men's-specific)", "label": "MensLine", "number": "1300 78 99 78", "tel": "1300789978", "locales": ["en-au"]}, {"region": "New Zealand", "label": "Lifeline Aotearoa", "number": "0800 543 354", "tel": "0800543354", "locales": ["en-nz"]}], "after_crisis_intro": "When you're past the next hour, these are doors that receive men in any state, without prior screening, free, with no membership.", "starts": [{"name": "Andy's Man Club", "url": "https://andysmanclub.co.uk", "description": "UK men's peer-support and suicide-prevention community founded in 2016 by Luke Ambler in memory of his brother-in-law Andy Roberts. Operates approximately 200 weekly Monday-night peer-support groups across the UK. Free, anonymous, peer-led. The motto is \"It's OK to talk.\" Has become one of the most-recognized UK men's-mental-health movements.", "category": "drop-in", "tradition": "secular", "cost": "free", "crisis_safe": "yes"}, {"name": "Alcoholics Anonymous", "url": "https://www.aa.org", "description": "International fellowship of men and women recovering from alcoholism, founded in 1935. Meetings happen multiple times daily in most US cities; many groups host men-only formats. Free, anonymous, and the lowest-barrier intake of any recovery community \u2014 a foundational door for any man in active crisis around drinking.", "category": "drop-in", "tradition": "12-step", "cost": "free", "crisis_safe": "yes"}, {"name": "Celebrate Recovery", "url": "https://celebraterecovery.com/", "description": "Christian 12-step-influenced recovery program hosted by churches across the US, addressing addictions and what they call \"hurts, habits, and hang-ups.\" Most meetings include open share groups segmented by gender. Free, weekly, and low-friction \u2014 a viable door for a man in crisis who's open to a Christian frame.", "category": "drop-in", "tradition": "christian", "cost": "free", "crisis_safe": "yes"}, {"name": "Samaritans", "url": "https://www.samaritans.org", "description": "UK and Ireland crisis-support charity, founded in 1953 by Chad Varah. Operates a 24/7 helpline (UK: 116 123; Ireland: 116 123), email and webchat support, and branches across the UK and Ireland. Free, anonymous, listening-focused (Samaritans don't give advice \u2014 they listen). Not exclusively men's-focused, but male callers represent a substantial portion of contacts and Samaritans plays a critical role in UK and Irish men's-suicide-prevention infrastructure given that suicide is the leading killer of men under 50 in the UK.", "category": "drop-in", "tradition": "secular", "cost": "free", "crisis_safe": "yes"}]}, "recovery": {"headline": "You're trying to stop something.", "intro": "Pick the door that fits how you talk to yourself. They all work. They're all free.", "crisis_lines": null, "after_crisis_intro": null, "starts": [{"name": "Alcoholics Anonymous", "url": "https://www.aa.org", "description": "International fellowship of men and women recovering from alcoholism, founded in 1935. Meetings happen multiple times daily in most US cities; many groups host men-only formats. Free, anonymous, and the lowest-barrier intake of any recovery community \u2014 a foundational door for any man in active crisis around drinking.", "category": "drop-in", "tradition": "12-step", "cost": "free", "crisis_safe": "yes"}, {"name": "SMART Recovery", "url": "https://smartrecovery.org/", "description": "Secular, CBT-based recovery community for any addiction, founded in 1994 as Self-Management And Recovery Training. Meetings use a four-point program (motivation, cravings, behavior, balanced living) drawn from cognitive-behavioral therapy and rational emotive behavior therapy. Free, peer-led, with both in-person and online groups across the US.", "category": "drop-in", "tradition": "secular", "cost": "free", "crisis_safe": "yes"}, {"name": "Celebrate Recovery", "url": "https://celebraterecovery.com/", "description": "Christian 12-step-influenced recovery program hosted by churches across the US, addressing addictions and what they call \"hurts, habits, and hang-ups.\" Most meetings include open share groups segmented by gender. Free, weekly, and low-friction \u2014 a viable door for a man in crisis who's open to a Christian frame.", "category": "drop-in", "tradition": "christian", "cost": "free", "crisis_safe": "yes"}, {"name": "Refuge Recovery", "url": "https://www.refugerecovery.org/", "description": "Buddhist-influenced peer recovery community based on the work of Noah Levine and the 2014 book *Refuge Recovery*. Operates meetings across the US and online using a Four Noble Truths / Eightfold Path framework adapted for addiction. The original Buddhist-recovery organization from which [[Recovery Dharma]] forked in 2019 during a governance restructuring; both continue to operate independently with similar but distinct approaches.", "category": "drop-in", "tradition": "buddhist", "cost": "free", "crisis_safe": "yes"}, {"name": "Sex Addicts Anonymous", "url": "https://saa-recovery.org", "description": "12-step fellowship for men and women recovering from compulsive sexual behavior, founded in 1977. Phone, online, and in-person meetings nationally; many men-only formats. Free, anonymous, and structurally parallel to AA \u2014 the foundational door for sexual-compulsion recovery.", "category": "drop-in", "tradition": "12-step", "cost": "free", "crisis_safe": "yes"}]}, "fatherhood": {"headline": "You want to be a better father.", "intro": "These are doors that meet dads where they are \u2014 new dads, separated dads, working dads, dads who've messed up and want to try again.", "crisis_lines": null, "after_crisis_intro": null, "starts": [{"name": "All Pro Dad", "url": "https://allprodad.com/", "description": "National fatherhood organization running \"All Pro Dad's Day\" \u2014 monthly father-child breakfasts at participating elementary schools across the US. Founded in 1997 as a program of Family First (a Christian family-policy organization in Tampa, FL). The school-based programming is religion-dry by design, focused on the dad-child relationship and structured conversation. Workplace and community-chapter formats also exist. Free for participants.", "category": "fatherhood", "tradition": "christian", "cost": "free", "crisis_safe": "no"}, {"name": "City Dads Group", "url": "https://dadssupportingdads.org/", "description": "Network of dad meetup groups in major US cities, founded in NYC in 2008. Local chapters host playdates, dad's nights out, and discussion groups; entry is free and informal. Best for new and active dads looking for peer connection in an urban environment.", "category": "fatherhood", "tradition": "secular", "cost": "free", "crisis_safe": "no"}, {"name": "National Fatherhood Initiative", "url": "https://www.fatherhood.org", "description": "National non-profit providing fatherhood programs, curriculum (24/7 Dad, Inside Out Dad), and resources to organizations that serve dads \u2014 workplaces, faith communities, military, and corrections. Direct programs are typically delivered through partner organizations rather than NFI itself; the website locator helps a man find a local program.", "category": "fatherhood", "tradition": "secular", "cost": "unknown", "crisis_safe": "unknown"}, {"name": "Inside Out Dad", "url": "https://store.fatherhood.org/insideout-dad-3rd-edition-facilitators-kit/", "description": "Group-based fatherhood curriculum delivered to incarcerated dads inside US correctional facilities. Operated through National Fatherhood Initiative; sessions are facilitated on-site by trained corrections staff or chaplains. Goal is to maintain father-child bond during incarceration and prepare dads for re-entry as engaged fathers.", "category": "reentry", "tradition": "secular", "cost": "free", "crisis_safe": "no"}, {"name": "Dads Group Australia", "url": "https://www.dadsgroup.org", "description": "Australian fatherhood charity supporting a national network of free local Dads Groups \u2014 peer-led gatherings of new and existing fathers with their kids, modeled loosely on traditional mothers' groups but designed for dads. Founded in 2014. Groups typically meet weekly or fortnightly at parks, cafes, libraries, or community centres. Free to join; volunteer-run with light national infrastructure for support and training.", "category": "fatherhood", "tradition": "secular", "cost": "free", "crisis_safe": "no"}]}, "brotherhood": {"headline": "You need other men.", "intro": "Most men's loneliness isn't from lack of acquaintances. It's the absence of men who'll take you seriously and tell you the truth. These are doors built for that.", "crisis_lines": null, "after_crisis_intro": null, "starts": [{"name": "ManKind Project USA", "url": "https://mkpusa.org/", "description": "International men's organization that runs the New Warrior Training Adventure weekend, plus ongoing peer-led integration groups (I-Groups) that meet weekly across the US. Open to any man over 18 who is willing to do the work; entry is typically through the weekend training, after which men are invited into local I-Groups. Sliding scale exists for the weekend; ongoing group participation is generally low-cost or free.", "category": "drop-in", "tradition": "secular", "cost": "sliding", "crisis_safe": "unknown"}, {"name": "Sacred Sons", "url": "https://www.sacredsons.com/", "description": "Modern men's-work community known for \"Convergence\" \u2014 multi-day immersive gatherings combining ritual, embodiment practice, and brotherhood. Continues between events through regional pods and online programs. Suited to men stable enough to engage intense intentional work; not designed as a door for active acute crisis.", "category": "curriculum-retreat", "tradition": "secular", "cost": "fee", "crisis_safe": "no"}, {"name": "Evryman", "url": "https://www.evryman.com", "description": "National community of men's groups built around emotional fluency, vulnerability, and peer support. Runs weekly virtual and in-person groups, multi-day retreats, and an online member community. Free intro events lead into paid ongoing groups; intake is straightforward.", "category": "curriculum-retreat", "tradition": "secular", "cost": "fee", "crisis_safe": "unknown"}, {"name": "F3 Nation", "url": "https://f3nation.com", "description": "National network of free, peer-led men's outdoor workouts held before dawn \u2014 five days a week in most cities. Founded 2011 in Charlotte, NC; now operates thousands of \"AOs\" (areas of operation) across all 50 states. The three Fs are Fitness, Fellowship, and Faith \u2014 the third is framed broadly enough to include any belief in something larger than self, and the workouts themselves carry no overt religious content.", "category": "outdoor-fitness", "tradition": "interfaith", "cost": "free", "crisis_safe": "no"}, {"name": "Andy's Man Club", "url": "https://andysmanclub.co.uk", "description": "UK men's peer-support and suicide-prevention community founded in 2016 by Luke Ambler in memory of his brother-in-law Andy Roberts. Operates approximately 200 weekly Monday-night peer-support groups across the UK. Free, anonymous, peer-led. The motto is \"It's OK to talk.\" Has become one of the most-recognized UK men's-mental-health movements.", "category": "drop-in", "tradition": "secular", "cost": "free", "crisis_safe": "yes"}]}, "faith": {"headline": "You want a faith-rooted space.", "intro": "The directory has dozens of faith-specific men's communities \u2014 Christian, Jewish, Muslim, Buddhist, Hindu, Sikh, Bah\u00e1'\u00ed, interfaith. Browse all of them, or start here:", "crisis_lines": null, "after_crisis_intro": null, "starts": [{"name": "Iron Sharpens Iron Conferences", "url": "https://ironsharpensiron.net/", "description": "Network of one-day regional Christian men's conferences across the US, with workshops on marriage, fatherhood, work, and faith. The conferences are the front door \u2014 local follow-up depends on the host church. Built for men already inside Protestant Christian orbit; not a low-barrier door for the religiously unaffiliated.", "category": "faith-community", "tradition": "christian", "cost": "fee", "crisis_safe": "no"}, {"name": "Federation of Jewish Men's Clubs", "url": "https://fjmc.org/", "description": "Brotherhood organization affiliated with Conservative Jewish synagogues across the US, founded in 1929. Local clubs at member synagogues run social events, men's-focused study, charitable activities, and signature programs like \"Hearing Men's Voices\" on emotional vulnerability and mental health. The Conservative-movement parallel to [[Men of Reform Judaism]].", "category": "faith-community", "tradition": "jewish", "cost": "fee", "crisis_safe": "unknown"}, {"name": "Tablighi Jamaat", "url": "https://en.wikipedia.org/wiki/Tablighi_Jamaat", "description": "Global Sunni Muslim revivalist movement founded 1926 in Mewat, India, by Maulana Muhammad Ilyas al-Kandhlawi. Tablighi Jamaat (\"Society for Spreading Faith\") is one of the largest grassroots Islamic movements in the world, with active presence across 150+ countries. Distinctively organised around weekly mosque-based gatherings (mashwara), longer-form daawah excursions (khuruj \u2014 typically 3 days, 40 days, or 4 months), and an annual ijtema (mass-gathering \u2014 the Bishwa Ijtema in Bangladesh and the Raiwind Ijtema in Pakistan are among the largest annual male-religious gatherings on earth, drawing millions). Men-only by traditional structure (women's separate Tablighi work exists in some contexts). Free participation; entirely volunteer-led, no formal hierarchy. Operates through local mosque networks rather than a central headquarters.", "category": "faith-community", "tradition": "muslim", "cost": "free", "crisis_safe": "no"}, {"name": "BAPS Swaminarayan Sanstha", "url": "https://www.baps.org", "description": "Global Swaminarayan Hindu denomination with one of the largest US temple networks, including the BAPS Swaminarayan Akshardham Mahamandir in Robbinsville, NJ \u2014 the largest Hindu temple in the US (opened 2023). Local BAPS centers (mandirs) across the US run age-graded men's groups including Bal Mandals (boys), Yuvak Mandals (young men), and Karyakar networks (adult male volunteers and seva). Strong men's-specific structure within a fundamentally family-oriented religious community.", "category": "faith-community", "tradition": "hindu", "cost": "free", "crisis_safe": "unknown"}, {"name": "Knights of Columbus", "url": "https://www.kofc.org", "description": "Catholic fraternal order with thousands of local councils across the US providing fellowship, charitable work, and faith formation for Catholic men 18 and over. Membership requires being a practicing Catholic man; council activity is typically monthly with charitable and family-focused programming. Long-running and accessible to its target population \u2014 not a low-barrier door for non-Catholics.", "category": "faith-community", "tradition": "christian", "cost": "fee", "crisis_safe": "unknown"}]}, "becoming": {"headline": "You're at a transition.", "intro": "Rites of passage exist for a reason. These are programs that help boys become men and help men step into the next thing.", "crisis_lines": null, "after_crisis_intro": null, "starts": [{"name": "Illuman", "url": "https://www.illuman.org/", "description": "Adult men's rites of passage organization founded in 2010, carrying forward the legacy of Franciscan priest Richard Rohr's \"M.A.L.Es\" (Men As Learners and Elders) community. Hosts Rohr-influenced rites of passage weekends and ongoing local \"Illumination Communities\" focused on contemplative spirituality, ego/shadow work, and elder-mentor relationships. Although Rohr's roots are Franciscan Catholic, Illuman is explicitly interfaith and welcomes men of any tradition or none.", "category": "rites-boys", "tradition": "interfaith", "cost": "fee", "crisis_safe": "no"}, {"name": "Boys to Men Mentoring Network", "url": "https://boystomen.org", "description": "Mentorship and rites-of-passage program for adolescent boys, founded in San Diego in 1996. Combines weekly mentor-led groups for boys with multi-day \"Adventure\" weekends led by adult male volunteers. Adult mentors are vetted and trained. US chapter network is concentrated in California with expansions across the country and abroad.", "category": "rites-boys", "tradition": "secular", "cost": "sliding", "crisis_safe": "no"}, {"name": "The Man Cave", "url": "https://themancave.life", "description": "Australian charity running preventative mental-health and emotional-development programs for adolescent boys (typically Years 8\u201310) in schools and community settings. Founded in 2014. Programs are facilitated by trained men and use a mix of group dialogue, storytelling, and rites-of-passage framing to support boys through adolescence with stronger emotional vocabulary, healthier relationships, and clearer identity formation. Operates across multiple Australian states with school partnerships.", "category": "rites-boys", "tradition": "secular", "cost": "fee", "crisis_safe": "no"}, {"name": "ManKind Project USA", "url": "https://mkpusa.org/", "description": "International men's organization that runs the New Warrior Training Adventure weekend, plus ongoing peer-led integration groups (I-Groups) that meet weekly across the US. Open to any man over 18 who is willing to do the work; entry is typically through the weekend training, after which men are invited into local I-Groups. Sliding scale exists for the weekend; ongoing group participation is generally low-cost or free.", "category": "drop-in", "tradition": "secular", "cost": "sliding", "crisis_safe": "unknown"}, {"name": "Trail Life USA", "url": "https://www.traillifeusa.com", "description": "Christian boys' outdoor and character-development program, founded in 2013 as an alternative to Boy Scouts of America following BSA's membership-policy changes. Combines outdoor skills (camping, navigation, service) with explicitly Christian formation. Boys ages 5\u201318 join age-graded \"troops\" led by adult male volunteers; the adult-leadership structure (\"Trailmen\") includes its own training and brotherhood gatherings, making this a real men's-gathering site even though the boys are the ostensible focus. Operates in roughly 1,000 troops across all 50 US states.", "category": "rites-boys", "tradition": "christian", "cost": "fee", "crisis_safe": "no"}]}, "outdoor": {"headline": "You want to do hard things outside.", "intro": "Sweat, hike, ruck, fish. These groups gather men around the body and the land.", "crisis_lines": null, "after_crisis_intro": null, "starts": [{"name": "F3 Nation", "url": "https://f3nation.com", "description": "National network of free, peer-led men's outdoor workouts held before dawn \u2014 five days a week in most cities. Founded 2011 in Charlotte, NC; now operates thousands of \"AOs\" (areas of operation) across all 50 states. The three Fs are Fitness, Fellowship, and Faith \u2014 the third is framed broadly enough to include any belief in something larger than self, and the workouts themselves carry no overt religious content.", "category": "outdoor-fitness", "tradition": "interfaith", "cost": "free", "crisis_safe": "no"}, {"name": "GORUCK", "url": "https://www.goruck.com/pages/goruck-events", "description": "Endurance/ruck-march event company and brotherhood, founded in 2008 by former Special Forces operator Jason McCarthy. Hosts overnight endurance events (\"Tough,\" \"Heavy,\" \"Selection,\" \"Sandlot\") in cities across the US year-round, led by current/former military cadre, that build small-group cohesion through shared physical hardship. The company sells gear, but the durable men's-gathering function is the events plus active local Facebook groups, training meetups, and continuing post-event teams.", "category": "outdoor-fitness", "tradition": "secular", "cost": "fee", "crisis_safe": "no"}, {"name": "The Mountaineers", "url": "https://www.mountaineers.org", "description": "Pacific Northwest outdoor community founded in Seattle in 1906, offering courses and trips in hiking, climbing, mountaineering, paddling, and conservation. Membership-based with seven WA branches plus partner relationships outside the region. Not formally men's-only, but the climbing and mountaineering programs have historically been male-dominated and continue to function for many men as a primary brotherhood \u2014 long expedition partnerships, course cohorts, and committee work create durable men-to-men relationships.", "category": "outdoor-fitness", "tradition": "secular", "cost": "fee", "crisis_safe": "no"}, {"name": "Veterans Expeditions", "url": "https://www.vetexpeditions.com", "description": "Non-profit running peer-led wilderness expeditions for US military veterans, founded in 2010. Expeditions include backpacking, mountaineering, climbing, and skiing trips of varying length and skill level, designed to provide brotherhood, post-service purpose, and trauma processing in wilderness settings. Veteran-led; participants are veterans of all eras.", "category": "outdoor-fitness", "tradition": "secular", "cost": "free", "crisis_safe": "yes"}, {"name": "Backcountry Hunters & Anglers", "url": "https://www.backcountryhunters.org", "description": "Hunting, fishing, and public-land conservation organization, founded in 2004 in Oregon. Operates state and regional chapters across the US \u2014 chapter meetings, \"Pint Nights,\" habitat-stewardship days, and educational events constitute the recurring gathering. Officially mixed-gender; in practice many chapter events function as significant men's-gathering sites in regions where hunting and fishing remain male-coded activities.", "category": "outdoor-fitness", "tradition": "secular", "cost": "fee", "crisis_safe": "no"}]}, "therapy": {"headline": "You want professional help.", "intro": "Therapy is not weakness. These services help you find a therapist who works with men, often on a sliding scale.", "crisis_lines": null, "after_crisis_intro": null, "starts": [{"name": "Open Path Psychotherapy Collective", "url": "https://openpathcollective.org", "description": "Non-profit therapy network providing access to licensed therapists at sliding-scale rates of $30\u201380 per session, founded 2013. Users pay a one-time lifetime membership fee (around $59 as of recent verification) and then book sessions directly with member therapists. Not men's-specific, but addresses the cost barrier that keeps many men out of group and individual therapy. Members can search the network for therapists who lead men's groups.", "category": "therapy-clinical", "tradition": "secular", "cost": "sliding", "crisis_safe": "no"}, {"name": "Psychology Today Therapist Directory", "url": "https://www.psychologytoday.com/us/therapists", "description": "The most-used find-a-therapist directory in the US, with hundreds of thousands of clinician listings filterable by location, specialty, modality, and group format \u2014 including \"Men's Issues\" and \"Group Therapy\" filters. Most US therapists maintain a Psychology Today profile. Not men's-specific, but its scale and filter granularity make it the practical starting point for finding a clinician-led men's group in most US locations.", "category": "therapy-clinical", "tradition": "secular", "cost": "fee", "crisis_safe": "no"}, {"name": "American Group Psychotherapy Association", "url": "https://agpa.org/", "description": "National professional association for group psychotherapists, founded in 1942. AGPA's website hosts a \"Find a Therapist\" directory of clinicians who run therapy groups across the US, including men's-only groups. The right meta-entry for a man seeking clinician-led group therapy \u2014 the locator surfaces practitioners by state and specialty.", "category": "therapy-clinical", "tradition": "secular", "cost": "fee", "crisis_safe": "no"}, {"name": "Inclusive Therapists", "url": "https://www.inclusivetherapists.com", "description": "Find-a-therapist directory focused on culturally-responsive and identity-affirming therapy across the US, with strong representation of BIPOC, LGBTQ+, and neurodivergent clinicians. Listings can be filtered by clinician identity, specialty, modality, and group format. Not men's-specific, but addresses an access gap that [[Psychology Today Therapist Directory]] doesn't always solve well: a man searching for a therapist who shares or understands his cultural context.", "category": "therapy-clinical", "tradition": "secular", "cost": "fee", "crisis_safe": "no"}, {"name": "Beyond Blue", "url": "https://www.beyondblue.org.au", "description": "Australia's largest mental-health charity, founded in 2000 by former Victorian Premier Jeff Kennett. Operates a 24/7 phone and webchat support service (1300 22 4636), peer-moderated online forums, and substantial men's-specific mental-health programs and resources. Not men-only, but its men's-mental-health programming and the heavily-male user base of its forums make it a primary entry point for Australian men in distress.", "category": "therapy-clinical", "tradition": "secular", "cost": "free", "crisis_safe": "yes"}]}, "reentry": {"headline": "You're coming home.", "intro": "These programs work with men coming out of incarceration \u2014 practical reentry, fatherhood while inside or after, ongoing brotherhood.", "crisis_lines": null, "after_crisis_intro": null, "starts": [{"name": "Defy Ventures", "url": "https://defyventures.org", "description": "Entrepreneurship and personal-development program for currently and formerly incarcerated men, founded 2010. Combines in-prison curriculum with post-release coaching and volunteer mentorship from outside business professionals. Free for participants; supported by volunteer engagement and donor funding.", "category": "reentry", "tradition": "secular", "cost": "free", "crisis_safe": "no"}, {"name": "Prison Fellowship", "url": "https://www.prisonfellowship.org", "description": "Christian ministry serving currently and formerly incarcerated men and their families, founded in 1976 by Chuck Colson. Programs include in-prison Bible studies and life-skills classes (Prison Fellowship Academy), mentorship for men preparing for re-entry, Angel Tree (gifts for prisoners' children), and policy advocacy. Volunteer-heavy on the outside; access for incarcerated men is through facility chaplains.", "category": "reentry", "tradition": "christian", "cost": "free", "crisis_safe": "yes"}, {"name": "Inside Out Dad", "url": "https://store.fatherhood.org/insideout-dad-3rd-edition-facilitators-kit/", "description": "Group-based fatherhood curriculum delivered to incarcerated dads inside US correctional facilities. Operated through National Fatherhood Initiative; sessions are facilitated on-site by trained corrections staff or chaplains. Goal is to maintain father-child bond during incarceration and prepare dads for re-entry as engaged fathers.", "category": "reentry", "tradition": "secular", "cost": "free", "crisis_safe": "no"}, {"name": "The Doe Fund", "url": "https://www.doe.org", "description": "NYC-based non-profit founded in 1985 by George T. McDonald, providing transitional work, paid training, supportive housing, and case management for homeless and formerly-incarcerated men. The \"Ready, Willing & Able\" program is the Doe Fund's signature \u2014 distinctive blue uniforms, daily street-cleaning work, and a structured 9\u201312 month residential program with substance-use treatment, GED prep, and job placement.", "category": "reentry", "tradition": "secular", "cost": "free", "crisis_safe": "yes"}, {"name": "Inside Circle", "url": "https://insidecircle.org", "description": "California-rooted program running intensive men's-work circles inside US prisons, founded in 1996 by James McLeary. Outside facilitators trained in modern men's-work (mythopoetic, embodied, accountability-focused) lead weekly circles with incarcerated men \u2014 most prominently at Folsom State Prison, which was the subject of the 2017 documentary *The Work*. The program runs intentional emotional-development work for men serving long sentences, often for violent offenses, alongside skill-building for the outside men who facilitate.", "category": "reentry", "tradition": "secular", "cost": "free", "crisis_safe": "yes"}]}};

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  function orderByLocale(lines) {
    if (!lines || !lines.length) return lines || [];
    var lang = (navigator.language || '').toLowerCase();
    // Find first line whose locales match the browser language; pull it (and any
    // subsequent line with the same primary locale, e.g. AU has two lines) to top.
    var primary = [];
    var rest = [];
    var primaryLocale = null;
    for (var i = 0; i < lines.length; i++) {
      var locs = lines[i].locales || [];
      var match = locs.some(function(l) { return lang.startsWith(l); });
      if (match) {
        primary.push(lines[i]);
        primaryLocale = locs[0];
      } else {
        rest.push(lines[i]);
      }
    }
    return primary.length ? primary.concat(rest) : lines;
  }

  function renderCrisisBlock(lines) {
    if (!lines || !lines.length) return '';
    var ordered = orderByLocale(lines);
    var lang = (navigator.language || '').toLowerCase();
    var rows = ordered.map(function(l) {
      var locs = l.locales || [];
      var isPriority = locs.some(function(loc) { return lang.startsWith(loc); });
      var cls = isPriority ? ' class="locale-priority"' : '';
      var tel = (l.tel || l.number || '').replace(/\s/g, '');
      var numHtml = tel
        ? '<a class="tel" href="tel:' + escapeHtml(tel) + '">' + escapeHtml(l.number) + '</a>'
        : '<span class="number">' + escapeHtml(l.number) + '</span>';
      return '<li' + cls + '>' +
        '<span class="region">' + escapeHtml(l.region) + '</span>' +
        '<span class="label">' + escapeHtml(l.label) + '</span>' +
        numHtml +
      '</li>';
    }).join('');
    return '<aside class="crisis-block"><h2>Call right now</h2><ul>' + rows + '</ul></aside>';
  }

  var CATEGORY_LABELS = {
    'drop-in': 'Drop-in support rooms',
    'faith-community': 'Faith-rooted community',
    'curriculum-retreat': 'Curriculum or retreat program',
    'civic-fraternal': 'Civic or fraternal order',
    'outdoor-fitness': 'Outdoor or fitness brotherhood',
    'fatherhood': 'Fatherhood program',
    'reentry': 'Reentry / justice-adjacent',
    'therapy-clinical': 'Therapy / clinical',
    'rites-boys': 'Rites of passage / boys'
  };
  function labelForCategory(slug) { return CATEGORY_LABELS[slug] || slug; }

  function renderStartCard(s) {
    var badges = [];
    if (s.category) badges.push('<span class="badge">' + escapeHtml(labelForCategory(s.category)) + '</span>');
    if (s.tradition) badges.push('<span class="badge">' + escapeHtml(s.tradition) + '</span>');
    if (s.cost) badges.push('<span class="badge cost-' + escapeHtml(s.cost) + '">' + escapeHtml(s.cost) + '</span>');
    if (s.crisis_safe === 'yes') badges.push('<span class="badge crisis">Crisis-safe</span>');
    return '<li class="start-card">' +
      '<h3 class="name"><a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(s.name) + '</a></h3>' +
      '<div class="badges">' + badges.join('') + '</div>' +
      '<p class="description">' + escapeHtml(s.description) + '</p>' +
      '<p class="locator"><a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(s.url) + '</a></p>' +
    '</li>';
  }

  function renderEcho(answer) {
    if (!answer) return '';
    return '<aside class="path-echo"><span class="you-said">You said</span><span class="text">' + escapeHtml(answer) + '</span></aside>';
  }

  var params = new URLSearchParams(window.location.search);
  var pathKey = params.get('p') || 'brotherhood';
  var answer = params.get('q') || '';
  var cfg = PATHS[pathKey];

  if (!cfg) {
    window.location.replace('directory.html');
    return;
  }

  var html = '';
  html += renderEcho(answer);
  html += '<h1 class="path-headline">' + escapeHtml(cfg.headline) + '</h1>';
  html += '<p class="path-intro">' + escapeHtml(cfg.intro) + '</p>';
  html += renderCrisisBlock(cfg.crisis_lines);
  if (cfg.after_crisis_intro) {
    html += '<p class="path-intro">' + escapeHtml(cfg.after_crisis_intro) + '</p>';
  }
  html += '<ul class="starts">' + cfg.starts.map(renderStartCard).join('') + '</ul>';

  document.getElementById('path-content').innerHTML = html;
  document.title = cfg.headline + ' — gogoselfcontrol.org';
})();
