<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home — gogoselfcontrol.org</title>
<meta name="description" content="Help men who need their men to find their men. A directory of men's gatherings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F2EAD3;
  --bg-card: #FBF6E8;
  --bg-soft: #EBE2C5;
  --fg: #2A2520;
  --fg-mute: #6B6256;
  --fg-deep: #423B30;
  --accent: #3D5A40;
  --accent-soft: #6E8A6F;
  --rule: #C7B98F;
  --rule-soft: #DDD2A8;
  --warn-bg: #ECE0BF;
  --warn-fg: #6B4F18;
  --crisis-bg: #2A4D3A;
  --crisis-fg: #F2EAD3;
  --serif: 'EB Garamond', Garamond, 'Times New Roman', Georgia, serif;
  --mono: 'IBM Plex Mono', Menlo, Consolas, monospace;
  --measure: 36rem;
  --measure-wide: 64rem;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  font-family: var(--serif);
  font-size: 1.0625rem;
  line-height: 1.55;
  color: var(--fg);
  background: var(--bg);
  margin: 0;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { color: var(--fg); }
hr { border: none; border-top: 1px solid var(--rule-soft); margin: 2rem 0; }

.site-wrap { max-width: var(--measure-wide); margin: 0 auto; padding: 2rem 1.5rem 3rem; }
.measure { max-width: var(--measure); }

/* Masthead — used on inner pages, not on home */
.masthead {
  border-bottom: 1px solid var(--rule);
  padding-bottom: 1rem;
  margin-bottom: 2.5rem;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 1rem 2rem;
}
.masthead .brand {
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 500;
  letter-spacing: 0.01em;
  color: var(--fg);
  text-decoration: none;
  margin-right: auto;
}
.masthead .brand .dot { color: var(--accent); }
.masthead nav {
  font-family: var(--mono);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.13em;
  display: flex;
  gap: 1.5rem;
}
.masthead nav a {
  color: var(--fg-mute);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  padding-bottom: 2px;
}
.masthead nav a:hover,
.masthead nav a[aria-current="page"] {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* Type */
h1, h2, h3 { font-family: var(--serif); font-weight: 500; color: var(--fg); margin-top: 0; }
h1 { font-size: 2.25rem; line-height: 1.18; margin-bottom: 1rem; }
h2 { font-size: 1.5rem; line-height: 1.25; margin: 2rem 0 0.75rem; }
h3 { font-size: 1.2rem; line-height: 1.3; margin: 1.4rem 0 0.5rem; }
p { margin: 0 0 1rem; }
.lede { font-size: 1.2rem; line-height: 1.5; color: var(--fg-deep); max-width: 38rem; }
.lede em { color: var(--accent); font-style: italic; }
.kicker {
  font-family: var(--mono);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--accent);
  margin-bottom: 0.75rem;
}

/* ---------- HOME (Google-style assessment) ---------- */

body.home {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  padding: 0;
}
.home-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 3rem 1.5rem 2rem;
  max-width: 36rem;
  margin: 0 auto;
}
.home-wordmark {
  font-family: var(--serif);
  font-size: 2.6rem;
  font-weight: 500;
  margin: 0 0 0.5rem;
  letter-spacing: -0.005em;
}
.home-wordmark .dot { color: var(--accent); }
.home-mission {
  font-family: var(--serif);
  font-style: italic;
  color: var(--fg-mute);
  font-size: 1.05rem;
  margin: 0 0 3.5rem;
  max-width: 28rem;
}

/* Quiet crisis link in home footer — for the man who needs it; not a primary CTA */
.crisis-quiet {
  color: var(--fg-mute);
  text-decoration: none;
  border-bottom: 1px dotted var(--rule);
}
.crisis-quiet:hover { color: var(--accent); border-bottom-color: var(--accent); }

/* Primary CTA — the assessment journey */
.journey-cta {
  display: inline-flex;
  align-items: center;
  gap: 0.75rem;
  margin: 0 auto 2rem;
  padding: 0.95rem 1.5rem;
  background: var(--accent);
  color: var(--crisis-fg);
  text-decoration: none;
  border-radius: 2px;
  font-family: var(--mono);
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  font-weight: 500;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  box-shadow: 0 2px 8px rgba(61, 90, 64, 0.18);
  min-height: 48px;
}
.journey-cta:hover, .journey-cta:focus {
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(61, 90, 64, 0.28);
  background: var(--fg);
  color: var(--crisis-fg);
  outline: none;
}
.journey-cta-arrow { font-family: var(--serif); font-size: 1.1rem; letter-spacing: 0; }
.home-or {
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--fg-mute);
  margin: 0 0 1rem;
  position: relative;
}
.home-or::before, .home-or::after {
  content: '';
  display: inline-block;
  width: 2.5rem;
  height: 1px;
  background: var(--rule-soft);
  vertical-align: middle;
  margin: 0 0.75rem;
}
@media (max-width: 540px) {
  .journey-cta { width: 100%; max-width: 24rem; justify-content: center; padding: 1rem 1.2rem; }
}

/* ---------- ASSESSMENT (choose-your-own-adventure wizard) ---------- */
body.assess {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  padding: 0;
}
.assess-stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 3rem 1.5rem 4rem;
  max-width: 36rem;
  margin: 0 auto;
  width: 100%;
}
.assess-progress {
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--fg-mute);
  margin: 0 0 2.5rem;
  text-align: center;
}
.assess-progress .bar {
  display: inline-block;
  width: 8rem;
  height: 2px;
  background: var(--rule-soft);
  margin-left: 0.75rem;
  vertical-align: middle;
  position: relative;
}
.assess-progress .bar > span {
  position: absolute;
  top: 0; left: 0; height: 100%;
  background: var(--accent);
  transition: width 0.4s ease;
}
.assess-screen { animation: fadeIn 0.45s ease-out both; width: 100%; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.assess-scene {
  font-family: var(--serif);
  font-style: italic;
  color: var(--fg-mute);
  font-size: 1.05rem;
  line-height: 1.55;
  margin: 0 0 1.5rem;
}
.assess-scene p + p { margin-top: 0.8rem; }
.assess-prompt {
  font-family: var(--serif);
  font-size: 1.55rem;
  line-height: 1.25;
  font-weight: 500;
  margin: 0 0 1.75rem;
  color: var(--fg);
}
.assess-options {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 0.65rem;
}
.assess-options button {
  display: block;
  width: 100%;
  text-align: left;
  font-family: var(--serif);
  font-size: 1.05rem;
  line-height: 1.4;
  padding: 0.95rem 1.1rem;
  background: var(--bg-card);
  border: 1px solid var(--rule-soft);
  border-left: 3px solid var(--rule);
  border-radius: 2px;
  color: var(--fg);
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
}
.assess-options button:hover, .assess-options button:focus {
  border-left-color: var(--accent);
  background: white;
  outline: none;
}
.assess-options button:active { transform: translateY(1px); }
.assess-echo {
  font-family: var(--serif);
  font-size: 1.15rem;
  line-height: 1.55;
  color: var(--fg-deep);
  margin: 0 0 2rem;
  padding-left: 1.1rem;
  border-left: 3px solid var(--accent);
}
.assess-continue {
  font-family: var(--mono);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  padding: 0.85rem 1.4rem;
  background: var(--accent);
  color: var(--crisis-fg);
  border: 1px solid var(--accent);
  cursor: pointer;
  border-radius: 2px;
}
.assess-continue:hover { background: var(--fg); border-color: var(--fg); }
.assess-back {
  display: inline-block;
  margin-top: 2rem;
  font-family: var(--mono);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--fg-mute);
  text-decoration: none;
  border: none;
  background: none;
  cursor: pointer;
}
.assess-back:hover { color: var(--accent); }
.assess-intro h1 {
  font-family: var(--serif);
  font-size: 2.4rem;
  font-weight: 500;
  margin: 0 0 1.5rem;
}
.assess-intro p {
  font-size: 1.1rem;
  line-height: 1.55;
  color: var(--fg-deep);
  margin: 0 0 1rem;
}
.assess-intro .assess-continue { margin-top: 1.5rem; }

/* Results */
.assess-results h1 {
  font-family: var(--serif);
  font-size: 2.1rem;
  font-weight: 500;
  margin: 0 0 1rem;
}
.assess-results .synthesis {
  font-family: var(--serif);
  font-size: 1.15rem;
  line-height: 1.55;
  color: var(--fg-deep);
  margin: 0 0 2rem;
  font-style: italic;
}
.assess-results .doors-label {
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 0.75rem;
}
.assess-results .door-bucket {
  margin-bottom: 2.5rem;
}
.assess-results .door-bucket h2 {
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 500;
  margin: 0 0 0.4rem;
  border: none;
  padding: 0;
}
.assess-results .door-bucket .why {
  font-family: var(--serif);
  font-style: italic;
  color: var(--fg-mute);
  font-size: 1rem;
  margin: 0 0 1rem;
}
.assess-results .door-bucket ul {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 0.85rem;
}
.assess-results .results-foot {
  margin-top: 2rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--rule-soft);
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem 1.5rem;
  font-family: var(--mono);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.13em;
}
.assess-results .results-foot a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px dotted var(--accent);
}
.assess-results .results-foot a:hover { border-bottom-style: solid; }

@media (max-width: 540px) {
  .assess-stage { padding: 2rem 1.25rem 3rem; }
  .assess-prompt { font-size: 1.3rem; }
  .assess-intro h1 { font-size: 1.9rem; }
  .assess-results h1 { font-size: 1.75rem; }
}

/* Crisis-block tel: links + locale priority */
.crisis-block .tel {
  font-family: var(--mono);
  font-size: 1rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  white-space: nowrap;
  color: var(--crisis-fg);
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
  padding: 0.4rem 0;
  display: inline-block;
  min-height: 44px;
  line-height: 1.2;
}
.crisis-block .tel:hover { color: var(--accent-soft); }
.crisis-block li.locale-priority {
  background: rgba(255, 255, 255, 0.06);
  padding: 0.7rem 0.7rem;
  margin: 0.25rem -0.7rem;
  border-radius: 2px;
  border-top: none;
}
.crisis-block li.locale-priority + li { border-top: 1px solid rgba(242, 234, 211, 0.2); }
.crisis-block li.locale-priority .region {
  color: var(--bg);
  font-weight: 500;
}

/* Disclaimer crisis-line tap targets */
.callout.warn .tel {
  font-family: var(--mono);
  font-weight: 500;
  white-space: nowrap;
  padding: 0.15rem 0.4rem;
  border-radius: 2px;
  background: rgba(107, 79, 24, 0.08);
  text-decoration: none;
  color: var(--warn-fg);
}
.callout.warn .tel:hover { background: rgba(107, 79, 24, 0.18); text-decoration: underline; }

.home-prompt {
  font-family: var(--serif);
  font-size: 1.55rem;
  font-weight: 500;
  margin: 0 0 1.25rem;
  color: var(--fg);
}
.ask-form {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
  align-items: center;
}
.ask-form .ask-row {
  display: flex;
  width: 100%;
  gap: 0.5rem;
}
.ask-form input {
  flex: 1;
  font-family: var(--serif);
  font-size: 1.1rem;
  padding: 0.85rem 1rem;
  border: 1px solid var(--rule);
  background: white;
  color: var(--fg);
  border-radius: 2px;
  min-width: 0;
}
.ask-form input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(61, 90, 64, 0.2);
}
.ask-form button {
  font-family: var(--mono);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  padding: 0.85rem 1.4rem;
  background: var(--accent);
  color: var(--crisis-fg);
  border: 1px solid var(--accent);
  cursor: pointer;
  border-radius: 2px;
  white-space: nowrap;
}
.ask-form button:hover { background: var(--fg); border-color: var(--fg); }

.pills {
  list-style: none;
  padding: 0;
  margin: 1.5rem 0 0;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.5rem 0.75rem;
}
.pills li a {
  display: inline-block;
  font-family: var(--mono);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.13em;
  padding: 0.45rem 0.95rem;
  border: 1px solid var(--rule);
  background: var(--bg-card);
  color: var(--fg-deep);
  text-decoration: none;
  border-radius: 999px;
  transition: border-color 0.15s ease, color 0.15s ease;
}
.pills li a:hover {
  color: var(--accent);
  border-color: var(--accent);
  background: white;
}
.home-foot {
  font-family: var(--mono);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.13em;
  color: var(--fg-mute);
  text-align: center;
  padding: 1.5rem 1rem 2rem;
  border-top: 1px solid var(--rule-soft);
  margin: 2.5rem auto 0;
  max-width: 40rem;
}
.home-foot a { color: var(--fg-mute); text-decoration: none; border-bottom: 1px dotted var(--rule); }
.home-foot a:hover { color: var(--accent); border-bottom-color: var(--accent); }
.home-foot .dot-sep { margin: 0 0.6rem; color: var(--rule); }

/* ---------- PATH (tailored response) ---------- */

.path-echo {
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  color: var(--fg-mute);
  background: var(--bg-card);
  border-left: 2px solid var(--rule);
  padding: 0.7rem 1rem;
  margin-bottom: 2rem;
  text-transform: uppercase;
}
.path-echo .you-said { display: block; font-size: 0.65rem; color: var(--accent); margin-bottom: 0.2rem; }
.path-echo .text { font-family: var(--serif); font-size: 0.95rem; text-transform: none; letter-spacing: 0; color: var(--fg); font-style: italic; }
.path-headline { font-family: var(--serif); font-size: 2.1rem; line-height: 1.18; margin: 0 0 0.75rem; max-width: 28ch; }
.path-intro { font-size: 1.1rem; line-height: 1.55; color: var(--fg-deep); max-width: 38rem; margin: 0 0 2rem; }

.crisis-block {
  background: var(--crisis-bg);
  color: var(--crisis-fg);
  padding: 1.5rem 1.75rem;
  border-radius: 2px;
  margin: 1.5rem 0 2rem;
}
.crisis-block h2 {
  font-family: var(--mono);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--crisis-fg);
  margin: 0 0 1rem;
  font-weight: 500;
  border: none;
  padding: 0;
}
.crisis-block ul { list-style: none; padding: 0; margin: 0; }
.crisis-block ul li {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.5rem 1rem;
  padding: 0.5rem 0;
  border-top: 1px solid rgba(242, 234, 211, 0.2);
}
.crisis-block ul li:first-child { border-top: none; }
.crisis-block .label {
  font-family: var(--serif);
  font-size: 1rem;
  flex: 1 1 auto;
}
.crisis-block .number {
  font-family: var(--mono);
  font-size: 1rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  white-space: nowrap;
}
.crisis-block .region {
  font-family: var(--mono);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.13em;
  color: var(--accent-soft);
  flex-basis: 100%;
  margin-bottom: -0.25rem;
}

.starts {
  list-style: none;
  padding: 0;
  margin: 0 0 2rem;
  display: grid;
  gap: 1rem;
}
.start-card {
  background: var(--bg-card);
  border: 1px solid var(--rule-soft);
  border-left: 3px solid var(--rule);
  padding: 1.1rem 1.4rem 1.2rem;
  border-radius: 2px;
}
.start-card:hover { border-left-color: var(--accent); }
.start-card .name {
  font-family: var(--serif);
  font-size: 1.2rem;
  font-weight: 500;
  margin: 0 0 0.4rem;
}
.start-card .name a { color: var(--fg); text-decoration: none; }
.start-card .name a:hover { color: var(--accent); }
.start-card .badges { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.35rem 0 0.6rem; }
.start-card .badge {
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 0.15rem 0.5rem;
  background: var(--bg-soft);
  color: var(--fg-deep);
  border: 1px solid var(--rule-soft);
  border-radius: 2px;
}
.start-card .badge.crisis { background: var(--crisis-bg); color: var(--crisis-fg); border-color: var(--crisis-bg); }
.start-card .badge.cost-free { background: #DDE9DA; color: #2C4A2D; border-color: #BFD4BC; }
.start-card .description { margin: 0 0 0.5rem; font-size: 1rem; line-height: 1.5; color: var(--fg); }
.start-card .locator {
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.04em;
  word-break: break-all;
}
.start-card .locator a { color: var(--accent); }

.path-foot {
  margin-top: 2rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--rule-soft);
  font-family: var(--mono);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem 1.5rem;
}
.path-foot a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); }
.path-foot a:hover { border-bottom-style: solid; }

/* ---------- DIRECTORY page ---------- */
.dir-toolbar {
  background: var(--bg-card);
  border: 1px solid var(--rule-soft);
  border-radius: 2px;
  padding: 1.25rem 1.5rem;
  margin-bottom: 1.5rem;
  display: grid;
  grid-template-columns: 1fr;
  gap: 1rem;
}
@media (min-width: 720px) {
  .dir-toolbar { grid-template-columns: 1.4fr repeat(2, 1fr); }
}
@media (min-width: 960px) {
  .dir-toolbar { grid-template-columns: 1.4fr repeat(5, 1fr); }
}
.dir-toolbar label {
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
  font-family: var(--mono);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--fg-mute);
}
.dir-toolbar input,
.dir-toolbar select {
  font-family: var(--serif);
  font-size: 1rem;
  padding: 0.55rem 0.7rem;
  border: 1px solid var(--rule);

      <div class="ask-row">
        <input
          type="text"
          id="q"
          name="q"
          autocomplete="off"
          autocapitalize="off"
          placeholder="Search if you already know what you need…"
          aria-label="Search the directory">
        <button type="submit">Show me</button>

<script>
(function() {
  const PATH_KEYWORDS = {
    crisis: ['crisis','suicide','suicidal','kill','dying','die','hurt','hurting','desperate','tonight','help me','can\'t','cant','lost','alone','no one','nobody','end it','ending it','give up'],
    recovery: ['drink','drinking','drunk','alcohol','alcoholic','drug','drugs','addict','addiction','addicted','sober','sobriety','porn','gambl','recovery','meeting','clean','using','substance','heroin','meth','cocaine','weed','cannabis'],
    fatherhood: ['dad','father','child','children','kid','kids','son','daughter','parent','parenting','family','divorce','custody','co-parent','co parent','baby'],
    brotherhood: ['lonely','loneliness','friend','friends','friendless','isolated','isolation','no friends','men','brother','brotherhood','community','belong','connect','connection','men\'s group','mens group','circle'],
    faith: ['god','jesus','christ','christian','catholic','muslim','islam','buddha','buddhist','jewish','jew','torah','quran','bible','hindu','sikh','church','mosque','temple','synagogue','pray','prayer','spiritual','soul','faith','believer'],
    becoming: ['boy','young','teen','teenager','adolescent','rite','transition','manhood','man up','becoming','grow up','grow','mature','purpose','direction','identity','who am i'],
    outdoor: ['hike','hiking','outdoor','outside','fitness','run','running','gym','workout','fish','fishing','hunt','hunting','wilderness','forest','mountain','nature','adventure'],
    therapy: ['therapy','therapist','counsel','counselor','counselling','counseling','depress','depression','anxious','anxiety','mental','mental health','professional','group therapy','psychiatrist','psychologist'],
    reentry: ['prison','jail','incarcerat','parole','released','inside','time','felon','convict','sentence','reentry','re-entry','formerly incarcerated']
  };

  function routeFromText(answer) {
    if (!answer) return null;
    const lower = answer.toLowerCase();
    let best = null, bestScore = 0;
    for (const [key, kws] of Object.entries(PATH_KEYWORDS)) {
      let score = 0;
      for (const kw of kws) { if (lower.includes(kw)) score++; }
      if (score > bestScore) { bestScore = score; best = key; }
    }
    return bestScore > 0 ? best : null;
  }

  document.getElementById('ask').addEventListener('submit', function(ev) {
    ev.preventDefault();
    const q = document.getElementById('q').value.trim();
    if (!q) return;
    const path = routeFromText(q);
    const params = new URLSearchParams();
    params.set('q', q);
    if (path) {
      params.set('p', path);
      window.location.href = 'path.html?' + params.toString();
    } else {
      window.location.href = 'directory.html?q=' + encodeURIComponent(q);
    }
  });
})();
</script>
